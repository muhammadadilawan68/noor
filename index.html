<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1714">
<title>Noor — Duas & Dhikr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d9b46a'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle'%3E%F0%9F%8C%99%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1714; --bg2:#12201c; --card:#172722; --card2:#1d302a; --line:#2a4038;
  --gold:#d9b46a; --gold2:#f0d79a; --cream:#f3ecdc; --muted:#9db0a7; --dim:#6f847b;
  --green:#46c08f; --teal:#55b9cf; --amber:#e6a344; --rust:#df8a5b; --grey:#9aa6b2; --qgold:#d2a94f;
  --ar-size:30px; --radius:20px;
  --en-font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ur-font: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", serif;
  --ar-font: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--en-font);font-size:16px}
body{background:radial-gradient(1200px 600px at 50% -200px,#1b3a30 0%,transparent 60%),var(--bg);min-height:100vh}
body.ur{font-family:var(--ur-font)}
body.ur .txt, body.ur p, body.ur li, body.ur .lbl{line-height:2.15}
.app{max-width:560px;margin:0 auto;padding:0 14px 110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 10px 14px -6px var(--bg);margin:0 -14px;padding:12px 14px 8px;display:flex;align-items:center;gap:8px}
.brand{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#a5793a);display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px #d9b46a33;flex:none}
.brand h1{font-size:17px;margin:0;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
body.ur .brand h1{font-size:16px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;flex:none}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.lang button{padding:6px 9px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.lang button.on{background:var(--gold);color:#1a1408}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;width:100%;display:flex;background:#132320ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 10px 30px #0008}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:16px;font-size:10.5px;color:var(--muted);font-weight:600;transition:.2s}
.nav button span{font-size:20px;line-height:1.1;transition:transform .25s}
.nav button.on{background:var(--card2);color:var(--gold2)}
.nav button.on span{transform:translateY(-2px) scale(1.12)}
body.ur .nav button{font-size:10px}

/* hero / today */
.hero{background:linear-gradient(145deg,#1f3a31,#162a24);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#d9b46a22,transparent 70%)}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:24px}
.ring .pct small{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.hero h2{margin:0 0 4px;font-size:19px}
.hero p{margin:0;color:var(--muted);font-size:13px}
.stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{background:#0d1a16aa;border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700}
.week{display:flex;gap:6px;margin-top:10px}
.week i{width:22px;height:22px;border-radius:7px;background:#0d1a16;border:1px solid var(--line);display:grid;place-items:center;font-size:9.5px;font-style:normal;color:var(--dim)}
.week i.half{background:#46c08f44;color:var(--cream)} .week i.full{background:var(--green);color:#062}
.week i.today{outline:2px solid var(--gold);outline-offset:1px}
.row-btns{display:flex;gap:8px;margin:14px 0 4px}
.chipbtn{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.chipbtn.gold{background:linear-gradient(135deg,var(--gold),#b8863f);color:#1a1408;border:0}

.group{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:13px 14px;font-weight:800;font-size:15px}
.ghead .e{font-size:20px}
.ghead .cnt{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:700;background:var(--bg2);padding:3px 9px;border-radius:999px}
.ghead .cnt.done{background:var(--green);color:#052}
.gbar{height:3px;background:var(--bg2)} .gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .4s}
.task{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.task .lbl{flex:1;font-size:14.5px;font-weight:600;min-width:0}
.task .lbl small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:1px}
.task.done .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:#46c08f99}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:.2s;background:var(--bg2);font-size:15px}
.chk.on{background:var(--green);border-color:var(--green);color:#042;animation:pop .35s}
.slots{display:flex;gap:5px;flex:none}
.slot{width:26px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--bg2);font-size:10px;font-weight:800;color:var(--muted);display:grid;place-items:center;transition:.2s}
.slot.on{background:var(--green);border-color:var(--green);color:#042;animation:pop .35s}
.opn{color:var(--gold);font-size:18px;padding:4px}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin:0 -14px;padding-inline:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--muted)}
.chip.on{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.chip b{font-size:11px;background:#0003;padding:1px 6px;border-radius:999px}
.toggle{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;margin:6px 0 12px;font-weight:700;font-size:14px}
.toggle .sw{margin-inline-start:auto;width:46px;height:27px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);position:relative;transition:.2s;flex:none}
.toggle .sw i{position:absolute;top:2px;inset-inline-start:2px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:.25s}
.toggle.on .sw{background:var(--gold)} .toggle.on .sw i{inset-inline-start:21px;background:#1a1408}
.sect-title{display:flex;align-items:center;gap:10px;margin:8px 2px 12px}
.sect-title .e{font-size:28px}
.sect-title h2{margin:0;font-size:20px}
.sect-title p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.sub{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin:18px 4px 8px}
body.ur .sub{letter-spacing:0;font-size:13px}

/* need grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px;text-align:start;min-height:108px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .e{font-size:28px}
.tile b{font-size:14px;line-height:1.3}
.tile small{color:var(--muted);font-size:11.5px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-weight:800;padding:6px 0;margin-bottom:4px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;position:relative;scroll-margin-top:70px}
.card.flash{animation:flash 1.4s}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--gold)}}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.2px;border:1px solid transparent}
.g-sahih{background:#46c08f22;color:var(--green);border-color:#46c08f55}
.g-hasan{background:#55b9cf22;color:var(--teal);border-color:#55b9cf55}
.g-quran{background:#d2a94f22;color:var(--qgold);border-color:#d2a94f55}
.g-weak{background:#e6a34422;color:var(--amber);border-color:#e6a34455}
.g-disputed{background:#df8a5b22;color:var(--rust);border-color:#df8a5b55}
.g-general{background:#9aa6b222;color:var(--grey);border-color:#9aa6b255}
.g-athar{background:#b49ad922;color:#cdb8f0;border-color:#b49ad955}
.badge.daily{background:#d9b46a22;color:var(--gold2);border-color:#d9b46a66}
.badge.kind{background:var(--bg2);color:var(--muted);border-color:var(--line)}
.card h3{margin:0 0 12px;font-size:16.5px;line-height:1.4}
body.ur .card h3{line-height:2;font-size:16px}
.arabic{font-family:var(--ar-font);direction:rtl;text-align:right;font-size:var(--ar-size);line-height:2.15;color:var(--gold2);background:linear-gradient(180deg,#0f1d19,#13241f);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 6px;white-space:pre-line;word-spacing:2px}
.arabic.small{font-size:calc(var(--ar-size)*.82)}
.ar2l{font-size:12.5px;color:var(--muted);margin:10px 2px 4px;font-weight:700}
.mean{font-style:italic;color:#e3dccb;margin:10px 2px 4px;font-size:15px;line-height:1.6}
body.ur .mean{font-style:normal;line-height:2.2}
.field{margin-top:12px}
.field .h{font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--gold);margin-bottom:3px;display:flex;align-items:center;gap:6px}
body.ur .field .h{letter-spacing:0;font-size:12.5px}
.field .txt{font-size:14.5px;line-height:1.6;color:#dfe7e1}
.note{margin-top:12px;background:#e6a34414;border:1px solid #e6a34444;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.55;color:#f1d9b2}
body.ur .note{line-height:2.1}
.src{margin-top:12px;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.src b{color:var(--cream)}
.from{font-size:11.5px;color:var(--dim);margin-top:4px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{flex:1;min-width:92px;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:10px 8px;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.act.primary{background:linear-gradient(135deg,var(--gold),#b8863f);border:0;color:#1a1408}
.act.done{background:var(--green);border-color:var(--green);color:#042}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11.5px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}

/* knowledge */
.kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.khead{display:flex;align-items:center;gap:12px;padding:15px;width:100%;text-align:start}
.khead .e{font-size:26px;flex:none}
.khead b{flex:1;font-size:15px;line-height:1.4}
.khead .chev{transition:transform .25s;color:var(--gold)}
.kcard.open .chev{transform:rotate(180deg)}
.kbody{display:none;padding:0 16px 16px;font-size:14.5px;line-height:1.65;color:#dfe7e1}
.kcard.open .kbody{display:block;animation:fade .3s}
.kbody ul,.kbody ol{padding-inline-start:20px;margin:6px 0} .kbody li{margin:6px 0}
.ar-inline{font-family:var(--ar-font);color:var(--gold2);font-size:1.25em;direction:rtl;unicode-bidi:isolate}
.ar-block{font-family:var(--ar-font);direction:rtl;text-align:center;font-size:calc(var(--ar-size)*1.05);color:var(--gold2);background:#0f1d19;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;line-height:2}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

/* ruqyah */
.rq-hero{background:linear-gradient(145deg,#2a2440,#1b2230);border:1px solid #3a3456;border-radius:26px;padding:18px;margin-bottom:14px}
.rq-hero h2{margin:0 0 6px;font-size:19px}
.rq-hero p{margin:0 0 12px;color:#c8c3dc;font-size:13.5px;line-height:1.55}
body.ur .rq-hero p{line-height:2.1}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #ffffff12;font-size:13.5px;font-weight:600}
.steps li:before{content:counter(s);width:24px;height:24px;border-radius:8px;background:#ffffff18;display:grid;place-items:center;font-size:12px;flex:none}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;background:#050b09ee;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:fade .25s}
.ov.show{display:flex}
.ov .bar{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.ov .bar .t{flex:1;font-weight:800;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;user-select:none;-webkit-user-select:none}
.cphrase{font-family:var(--ar-font);direction:rtl;font-size:calc(var(--ar-size)*1.15);color:var(--gold2);text-align:center;line-height:1.9;min-height:2em;padding:0 8px}
.cstage{color:var(--muted);font-size:13px;font-weight:700}
.bigring{width:min(72vw,300px);height:min(72vw,300px);position:relative;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#22423a,#11201c 70%);box-shadow:0 20px 60px #0009, inset 0 0 0 1px var(--line);transition:transform .08s}
.bigring:active{transform:scale(.97)}
.bigring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.bigring .n{font-size:64px;font-weight:800;line-height:1}
.bigring .of{color:var(--muted);font-weight:700;font-size:14px;text-align:center}
.tapme{color:var(--dim);font-size:12.5px}
.targets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.targets button{padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--muted)}
.targets button.on{background:var(--gold);color:#1a1408;border-color:var(--gold)}
.ctrl{display:flex;gap:10px;width:100%;max-width:520px}
.ctrl button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:800}
.sheet{width:100%;max-width:560px;flex:1;overflow-y:auto;margin-top:10px;padding-bottom:20px}
.search-in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--cream);font:inherit;font-size:15px;outline:none}
.search-in:focus{border-color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a1408;font-weight:800;padding:10px 16px;border-radius:999px;opacity:0;transition:.3s;z-index:90;pointer-events:none;white-space:nowrap;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.foot{color:var(--dim);font-size:11.5px;text-align:center;margin:26px 10px 0;line-height:1.6}
.hello{margin:4px 2px 12px}
.hello h2{margin:0;font-size:22px}
.hello p{margin:3px 0 0;color:var(--muted);font-size:13px}
.sizebtns{display:flex;gap:6px}

.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lnk{font-size:12px;font-weight:700;color:var(--gold2);background:#d9b46a14;border:1px solid #d9b46a44;border-radius:999px;padding:5px 10px;text-decoration:none;direction:ltr;unicode-bidi:isolate}
.lnk:active{background:#d9b46a33}
.badge.ok{background:#46c08f14;color:#8fe0bd;border-color:#46c08f44}

.inst{display:flex;align-items:center;gap:8px;margin:0 0 12px;background:linear-gradient(135deg,#d9b46a22,#d9b46a0c);border:1px solid #d9b46a55;border-radius:14px;padding:10px 10px 10px 12px;font-size:13.5px;line-height:1.5;color:#f1e3c2}
.inst span{flex:1}
body.ur .inst{line-height:2.1}
.inst button{border:0;border-radius:999px;font:inherit;font-weight:800;cursor:pointer}
#instBtn{background:var(--gold);color:#1a1408;padding:7px 14px}
#instX{background:transparent;color:#f1e3c2aa;padding:4px 8px;font-size:15px}

</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Noor">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="Daily duas and dhikr by act and by need, with Arabic, English/Urdu meaning, rewards and authentic references. Works offline.">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">🌙</div><div style="min-width:0"><h1 id="bt">Noor</h1><small id="bs"></small></div></div>
    <button class="iconbtn" id="helpBtn" aria-label="How to open">ℹ️</button><button class="iconbtn" id="searchBtn" aria-label="Search">🔍</button>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="ur">اردو</button></div>
  </header>
  <div class="sizebtns" style="justify-content:flex-end;margin:-2px 0 8px"><button class="iconbtn" id="szDn" style="width:auto;padding:0 10px;height:30px;font-size:13px;font-family:var(--ar-font)">ع−</button><button class="iconbtn" id="szUp" style="width:auto;padding:0 10px;height:30px;font-size:15px;font-family:var(--ar-font)">ع+</button></div>
  <main id="main"></main>
</div>
<nav class="nav"><div class="in" id="nav"></div></nav>
<div class="ov" id="ov"><div class="bar"><div class="t" id="ovT"></div><button class="iconbtn" id="ovX" aria-label="Close">✕</button></div><div id="ovC" style="width:100%;display:flex;flex-direction:column;align-items:center;flex:1;min-height:0"></div></div>
<div class="toast" id="toast"></div>

{id:"baqarah_end", kind:"quran", g:"quran",
 t:{en:"Recite the last two verses of Surah Al-Baqarah (2:285–286) at night", ur:"رات کو سورۂ بقرہ کی آخری دو آیتیں (285–286) پڑھیں"},
 ar:"آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ ۚ كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ ۚ وَقَالُوا سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ﴿٢٨٥﴾ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ ۖ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا ۚ أَنتَ مَوْلَانَا فَانصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ﴿٢٨٦﴾",
 m:{en:"The Messenger believes in what was sent down to him from his Lord, and so do the believers. Each believes in Allah, His angels, His Books and His messengers — 'We make no distinction between any of His messengers.' And they say: 'We hear and we obey. Your forgiveness, our Lord; and to You is the return.' Allah does not burden a soul beyond what it can bear. It gets the good it earned and bears the evil it earned. 'Our Lord, do not take us to task if we forget or make a mistake. Our Lord, do not place on us a burden like the one You placed on those before us. Our Lord, do not burden us with what we have no strength for. Pardon us, forgive us and have mercy on us. You are our Protector, so help us against the disbelieving people.'",
    ur:"رسول اس پر ایمان لایا جو اس کے رب کی طرف سے اس پر اتارا گیا، اور مومن بھی۔ سب اللہ، اس کے فرشتوں، اس کی کتابوں اور اس کے رسولوں پر ایمان لائے — ’ہم اس کے رسولوں میں سے کسی میں فرق نہیں کرتے۔‘ اور انہوں نے کہا: ’ہم نے سنا اور مانا، اے ہمارے رب! ہم تیری بخشش چاہتے ہیں اور تیری ہی طرف لوٹنا ہے۔‘ اللہ کسی جان پر اس کی طاقت سے زیادہ بوجھ نہیں ڈالتا۔ جو نیکی کرے اس کا فائدہ اسی کو، اور جو برائی کرے اس کا وبال اسی پر۔ ’اے ہمارے رب! اگر ہم بھول جائیں یا غلطی کر بیٹھیں تو ہماری پکڑ نہ کر۔ اے ہمارے رب! ہم پر ویسا بوجھ نہ ڈال جیسا ہم سے پہلے لوگوں پر ڈالا تھا۔ اے ہمارے رب! ہم پر وہ بوجھ نہ ڈال جس کی ہمیں طاقت نہیں۔ ہمیں معاف فرما، ہمیں بخش دے اور ہم پر رحم فرما۔ تو ہی ہمارا مالک ہے، پس کافروں کے مقابلے میں ہماری مدد فرما۔‘"},
 use:{en:"Night-time protection, forgiveness, and asking Allah not to burden you beyond your strength.", ur:"رات کی حفاظت، مغفرت، اور یہ دعا کہ اللہ طاقت سے زیادہ بوجھ نہ ڈالے۔"},
 rw:{en:"The Prophet ﷺ said: whoever recites the last two verses of Surah Al-Baqarah at night, they will suffice him (Bukhari 5009, Muslim 807).", ur:"نبی ﷺ نے فرمایا: جو رات کو سورۂ بقرہ کی آخری دو آیتیں پڑھ لے، وہ اس کے لیے کافی ہو جاتی ہیں (بخاری 5009، مسلم 807)۔"},
 how:{en:"Once every night — after Isha or before sleeping.", ur:"ہر رات ایک بار — عشاء کے بعد یا سونے سے پہلے۔"},
 src:"Qur'an 2:285–286 · Bukhari 5009 · Muslim 807", acts:["sleep"], needs:["protect","forgive"], ruq:true, from:"Your screenshots (2.285 & 2.286)"},

{id:"adhan_dua", kind:"dua", g:"sahih",
 t:{en:"Say the dua after the Adhan ends", ur:"اذان ختم ہونے کے بعد یہ دعا پڑھیں"},
 ar:"اللَّهُمَّ رَبَّ هَذِهِ الدَّعْوَةِ التَّامَّةِ، وَالصَّلَاةِ الْقَائِمَةِ، آتِ مُحَمَّدًا الْوَسِيلَةَ وَالْفَضِيلَةَ، وَابْعَثْهُ مَقَامًا مَحْمُودًا الَّذِي وَعَدْتَهُ",
 m:{en:"O Allah, Lord of this perfect call and of the prayer about to be established, grant Muhammad al-Wasilah (the highest station) and excellence, and raise him to the praised station You promised him.", ur:"اے اللہ! اس کامل دعوت اور قائم ہونے والی نماز کے رب! محمد ﷺ کو وسیلہ اور فضیلت عطا فرما، اور انہیں اس مقامِ محمود پر فائز فرما جس کا تو نے ان سے وعدہ کیا ہے۔"},
 use:{en:"Honouring the Prophet ﷺ after every Adhan.", ur:"ہر اذان کے بعد نبی ﷺ کے لیے دعا۔"},
 rw:{en:"His intercession becomes due for you on the Day of Judgement (Bukhari 614).", ur:"قیامت کے دن اس کے لیے نبی ﷺ کی شفاعت واجب ہو جاتی ہے (بخاری 614)۔"},
 how:{en:"After each of the 5 Adhans. First repeat the Adhan after the muezzin, then send salawat, then say this.", ur:"پانچوں اذانوں کے بعد۔ پہلے مؤذن کے ساتھ اذان کے کلمات دہرائیں، پھر درود پڑھیں، پھر یہ دعا۔"},
 note:{en:"Your screenshot ends with «إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ». That ending is not in Bukhari; it comes from a later narration (al-Bayhaqi) that al-Albani judged an irregular (shādh) addition. The version above is the Bukhari wording.", ur:"آپ کے اسکرین شاٹ کے آخر میں «إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ» ہے۔ یہ الفاظ بخاری میں نہیں؛ یہ بیہقی کی روایت کا اضافہ ہے جسے البانیؒ نے شاذ قرار دیا۔ اوپر بخاری کے الفاظ ہیں۔"},
 src:"Sahih al-Bukhari 614", acts:["adhan"], needs:["jannah","reward"], from:"Your screenshot"},

{id:"adhan_reply", kind:"action", g:"sahih",
 t:{en:"Repeat the Adhan after the muezzin — and say «lā ḥawla…» at «ḥayya ʿalā…»", ur:"مؤذن کے ساتھ اذان دہرائیں — اور «حَیَّ عَلَی…» پر «لا حول…» کہیں"},
 ar:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
 m:{en:"There is no might and no power except with Allah.", ur:"اللہ کے سوا نہ کوئی طاقت ہے نہ قوت۔"},
 use:{en:"Answering the call to prayer the Sunnah way.", ur:"سنت کے مطابق اذان کا جواب دینا۔"},
 rw:{en:"Whoever answers the Adhan this way from his heart will enter Jannah (Muslim 385).", ur:"جو دل سے اس طرح اذان کا جواب دے وہ جنت میں داخل ہوگا (مسلم 385)۔"},
 how:{en:"Say what the muezzin says, except at «ḥayya ʿalaṣ-ṣalāh» and «ḥayya ʿalal-falāḥ» — there say «lā ḥawla wa lā quwwata illā billāh».", ur:"جو مؤذن کہے وہی کہیں، سوائے «حَیَّ عَلَی الصَّلَاۃ» اور «حَیَّ عَلَی الفَلَاح» کے — وہاں «لا حول ولا قوۃ الا باللہ» کہیں۔"},
 src:"Sahih Muslim 385", acts:["adhan"], needs:["jannah"], from:"@aliexplainsdeen slides"},

{id:"fatiha", kind:"quran", g:"quran",
 t:{en:"Recite Surah Al-Fatiha over yourself (ruqyah)", ur:"اپنے اوپر سورۂ فاتحہ پڑھ کر دم کریں (رقیہ)"},
 ar:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ﴿١﴾ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴿٢﴾ الرَّحْمَٰنِ الرَّحِيمِ ﴿٣﴾ مَالِكِ يَوْمِ الدِّينِ ﴿٤﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿٥﴾ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ﴿٦﴾ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ﴿٧﴾",
 m:{en:"In the name of Allah, the Most Merciful, the Especially Merciful. All praise is for Allah, Lord of the worlds, the Most Merciful, the Especially Merciful, Master of the Day of Judgement. You alone we worship and You alone we ask for help. Guide us to the straight path — the path of those You have blessed, not of those who earned anger, nor of those who went astray.", ur:"اللہ کے نام سے جو بڑا مہربان، نہایت رحم والا ہے۔ سب تعریف اللہ کے لیے ہے جو سارے جہانوں کا رب ہے، بڑا مہربان، نہایت رحم والا، روزِ جزا کا مالک۔ ہم تیری ہی عبادت کرتے ہیں اور تجھ ہی سے مدد مانگتے ہیں۔ ہمیں سیدھا راستہ دکھا — ان لوگوں کا راستہ جن پر تو نے انعام کیا، نہ ان کا جن پر غضب ہوا اور نہ گمراہوں کا۔"},
 use:{en:"Healing and ruqyah — the Prophet ﷺ called it a ruqyah.", ur:"شفا اور رقیہ — نبی ﷺ نے اسے رقیہ قرار دیا۔"},
 rw:{en:"A companion recited Al-Fatiha over a man stung by a scorpion and he recovered; the Prophet ﷺ asked: «How did you know it is a ruqyah?» (Bukhari 5736).", ur:"ایک صحابی نے بچھو کے ڈسے ہوئے پر سورۂ فاتحہ پڑھ کر دم کیا تو وہ ٹھیک ہو گیا؛ نبی ﷺ نے فرمایا: «تمہیں کیسے معلوم ہوا کہ یہ رقیہ ہے؟» (بخاری 5736)۔"},
 how:{en:"Recite, then lightly blow (with a little breath) over yourself or into your palms and wipe over your body.", ur:"پڑھ کر اپنے اوپر یا ہتھیلیوں میں ہلکی پھونک ماریں اور جسم پر پھیر لیں۔"},
 note:{en:"The reel says to recite it 1, 3, 5 or 7 times «as long as it’s odd». There is no specific narration requiring an odd number for Al-Fatiha — recite it as many times as you like.", ur:"ریل میں کہا گیا کہ 1، 3، 5 یا 7 بار، یعنی طاق عدد۔ فاتحہ کے لیے طاق عدد کی کوئی خاص روایت نہیں — جتنی بار چاہیں پڑھیں۔"},
 src:"Qur'an 1 · Sahih al-Bukhari 5736, 5007", acts:["ill"], needs:["heal","protect"], ruq:true, cnt:7, from:"Ruqyah screenshot (@abostani)"},

{id:"ayat_kursi", kind:"quran", g:"quran",
 t:{en:"Recite Ayat al-Kursi (2:255)", ur:"آیت الکرسی (2:255) پڑھیں"},
 ar:"اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ",
 m:{en:"Allah — there is no god but Him, the Ever-Living, the Sustainer of all. Neither drowsiness nor sleep overtakes Him. To Him belongs whatever is in the heavens and the earth. Who could intercede with Him except by His permission? He knows what is before them and what is behind them, and they encompass nothing of His knowledge except what He wills. His Kursi extends over the heavens and the earth, and guarding them does not tire Him. He is the Most High, the Most Great.", ur:"اللہ، اس کے سوا کوئی معبود نہیں، وہ ہمیشہ زندہ اور سب کو قائم رکھنے والا ہے۔ نہ اسے اونگھ آتی ہے نہ نیند۔ آسمانوں اور زمین میں جو کچھ ہے سب اسی کا ہے۔ کون ہے جو اس کی اجازت کے بغیر اس کے ہاں سفارش کرے؟ وہ جانتا ہے جو ان کے آگے ہے اور جو ان کے پیچھے ہے، اور وہ اس کے علم میں سے کسی چیز کا احاطہ نہیں کر سکتے سوائے اس کے جو وہ چاہے۔ اس کی کرسی آسمانوں اور زمین پر چھائی ہوئی ہے اور ان کی حفاظت اسے تھکاتی نہیں۔ وہی سب سے بلند، سب سے عظیم ہے۔"},
 use:{en:"Protection through the night, and a key to Jannah after every prayer.", ur:"رات بھر کی حفاظت، اور ہر نماز کے بعد جنت کی کنجی۔"},
 rw:{en:"At bedtime: a guardian from Allah stays with you and no devil comes near you until morning (Bukhari 2311). After every obligatory prayer: nothing stands between you and Jannah except death (an-Nasa'i, al-Sunan al-Kubra 9928 — graded sahih by Ibn Hibban and al-Albani).", ur:"سوتے وقت: اللہ کی طرف سے ایک نگہبان مقرر رہتا ہے اور صبح تک شیطان قریب نہیں آتا (بخاری 2311)۔ ہر فرض نماز کے بعد: جنت میں داخلے سے صرف موت رکاوٹ رہ جاتی ہے (نسائی، السنن الکبریٰ 9928 — ابن حبانؒ و البانیؒ: صحیح)۔"},
 how:{en:"After each of the 5 prayers, before sleeping, and in ruqyah.", ur:"پانچوں نمازوں کے بعد، سونے سے پہلے، اور رقیہ میں۔"},
 src:"Qur'an 2:255 · Bukhari 2311 · an-Nasa'i al-Kubra 9928", acts:["after","sleep"], needs:["protect","jannah"], ruq:true, from:"Ruqyah screenshot, @aboo.yahyaa, @brother_sulaiman_fariz"},

{id:"three_quls", kind:"quran", g:"quran",
 t:{en:"Recite Al-Ikhlas, Al-Falaq and An-Nas — 3 times each", ur:"سورۂ اخلاص، فلق اور ناس — ہر ایک تین بار"},
 ar:"قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾\nقُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾\nقُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾",
 m:{en:"Say: He is Allah, the One; Allah, the Self-Sufficient; He neither begets nor was begotten, and none is equal to Him. — Say: I seek refuge in the Lord of the daybreak from the evil of what He created, from the evil of darkness when it settles, from the evil of those who blow on knots, and from the evil of an envier when he envies. — Say: I seek refuge in the Lord of mankind, the King of mankind, the God of mankind, from the evil of the sneaking whisperer who whispers into the hearts of people — from among jinn and people.", ur:"کہہ دو: وہ اللہ ایک ہے؛ اللہ بے نیاز ہے؛ نہ اس کی کوئی اولاد ہے نہ وہ کسی کی اولاد، اور کوئی اس کا ہمسر نہیں۔ — کہہ دو: میں صبح کے رب کی پناہ مانگتا ہوں، اس کی مخلوق کے شر سے، اندھیری رات کے شر سے جب وہ چھا جائے، گرہوں میں پھونکنے والیوں کے شر سے، اور حسد کرنے والے کے شر سے جب وہ حسد کرے۔ — کہہ دو: میں لوگوں کے رب، لوگوں کے بادشاہ، لوگوں کے معبود کی پناہ مانگتا ہوں، اس وسوسہ ڈالنے والے کے شر سے جو (اللہ کا نام سن کر) پیچھے ہٹ جاتا ہے، جو لوگوں کے دلوں میں وسوسے ڈالتا ہے — جنوں میں سے بھی اور انسانوں میں سے بھی۔"},
 use:{en:"All-round protection — from envy, evil eye, magic and Shaytan’s whispers.", ur:"ہر طرح کی حفاظت — حسد، نظرِ بد، جادو اور شیطانی وسوسوں سے۔"},
 rw:{en:"Said 3 times in the morning and evening, «they will suffice you against everything» (Abu Dawud 5082 — hasan per al-Albani). Every night the Prophet ﷺ blew into his cupped hands, recited them and wiped over his body, three times (Bukhari 5017). He also used them as ruqyah when ill (Bukhari 5748).", ur:"صبح و شام تین تین بار پڑھیں تو «یہ ہر چیز سے تمہیں کافی ہوں گی» (ابوداؤد 5082)۔ نبی ﷺ ہر رات ہتھیلیاں جوڑ کر ان میں پھونکتے، یہ سورتیں پڑھتے اور پورے جسم پر ہاتھ پھیرتے، تین بار (بخاری 5017)۔ بیماری میں بھی ان سے دم کرتے (بخاری 5748)۔"},
 how:{en:"Morning (after Fajr) and evening (after Maghrib): 3 times each. Before sleep: cup your hands, blow lightly, recite all three, wipe over as much of your body as you can — do this 3 times.", ur:"صبح (فجر کے بعد) اور شام (مغرب کے بعد): ہر ایک تین بار۔ سونے سے پہلے: ہتھیلیاں جوڑیں، ہلکی پھونک ماریں، تینوں سورتیں پڑھیں، جسم پر ہاتھ پھیریں — یہ تین بار کریں۔"},
 src:"Qur'an 112–114 · Abu Dawud 5082 · Bukhari 5017, 5748", acts:["morning","sleep"], needs:["protect","heal"], ruq:true, cnt:3, from:"Ruqyah screenshot (@abostani)"},

{id:"ruqyah_nas", kind:"dua", g:"sahih",
 t:{en:"Make the Prophet’s healing dua (place your hand where it hurts)", ur:"نبی ﷺ کی شفا والی دعا پڑھیں (تکلیف کی جگہ ہاتھ رکھ کر)"},
 ar:"أَذْهِبِ الْبَاسَ رَبَّ النَّاسِ، اشْفِ وَأَنْتَ الشَّافِي، لَا شِفَاءَ إِلَّا شِفَاؤُكَ، شِفَاءً لَا يُغَادِرُ سَقَمًا",
 m:{en:"Remove the harm, O Lord of mankind. Heal, for You are the Healer. There is no healing except Your healing — a healing that leaves no illness behind.", ur:"اے لوگوں کے رب! تکلیف دور فرما۔ شفا دے، تو ہی شفا دینے والا ہے۔ تیری شفا کے سوا کوئی شفا نہیں — ایسی شفا جو کوئی بیماری باقی نہ چھوڑے۔"},
 use:{en:"Healing for yourself or someone sick.", ur:"اپنے یا کسی بیمار کے لیے شفا۔"},
 rw:{en:"The Prophet ﷺ used to say this when visiting the sick, wiping with his right hand (Bukhari 5675, Muslim 2191).", ur:"نبی ﷺ بیمار کی عیادت میں داہنا ہاتھ پھیرتے ہوئے یہ دعا پڑھتے تھے (بخاری 5675، مسلم 2191)۔"},
 how:{en:"Place your right hand on the pain and say it — repeat as you like.", ur:"داہنا ہاتھ تکلیف کی جگہ رکھ کر پڑھیں — جتنی بار چاہیں۔"},
 note:{en:"The reel’s caption wording («Allāhumma rabban-nās…») is also authentic (Bukhari 5743). The Arabic above is exactly as in Bukhari 5675 — «al-bās» is the narrated spelling of «al-baʾs» (harm).", ur:"ریل کے کیپشن کے الفاظ («اللّٰہم ربّ الناس…») بھی صحیح ہیں (بخاری 5743)۔ اوپر بالکل بخاری 5675 کے الفاظ ہیں — «الباس» روایت کا املا ہے، «البأس» (تکلیف) ہی کا لفظ۔"},
 src:"Sahih al-Bukhari 5675, 5743 · Sahih Muslim 2191", acts:["ill"], needs:["heal"], ruq:true, cnt:3, from:"Ruqyah screenshot (@abostani)"},

{id:"ruqyah_jibril", kind:"dua", g:"sahih",
 t:{en:"Recite Jibril’s ruqyah", ur:"جبریلؑ والا رقیہ پڑھیں"},
 ar:"بِاسْمِ اللَّهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِيكَ، بِاسْمِ اللَّهِ أَرْقِيكَ",
 ar2:"بِاسْمِ اللَّهِ أَرْقِي نَفْسِي، مِنْ كُلِّ شَيْءٍ يُؤْذِينِي، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللَّهُ يَشْفِينِي",
 ar2l:{en:"Adapted for yourself (as in the reel’s caption):", ur:"اپنے لیے (جیسا ریل کے کیپشن میں ہے):"},
 m:{en:"In the name of Allah I perform ruqyah for you, from everything that harms you, from the evil of every soul or envious eye. May Allah heal you. In the name of Allah I perform ruqyah for you.", ur:"اللہ کے نام سے میں تجھ پر دم کرتا ہوں، ہر اس چیز سے جو تجھے تکلیف دے، ہر نفس کے شر سے یا حسد کرنے والی آنکھ کے شر سے۔ اللہ تجھے شفا دے۔ اللہ کے نام سے میں تجھ پر دم کرتا ہوں۔"},
 use:{en:"Evil eye, envy and illness.", ur:"نظرِ بد، حسد اور بیماری۔"},
 rw:{en:"Jibril came to the Prophet ﷺ when he was ill and recited this over him (Muslim 2186).", ur:"نبی ﷺ بیمار تھے تو جبریلؑ آئے اور یہ پڑھ کر دم کیا (مسلم 2186)۔"},
 how:{en:"Say it over yourself or someone else, then blow lightly.", ur:"اپنے یا کسی اور پر پڑھ کر ہلکی پھونک ماریں۔"},
 src:"Sahih Muslim 2186", acts:["ill"], needs:["heal","protect"], ruq:true, cnt:3, from:"Ruqyah screenshot (@abostani)"},

{id:"auzu_kalimat", kind:"dua", g:"sahih",
 t:{en:"Seek refuge in Allah’s perfect words when you stop somewhere, and in the evening", ur:"کسی جگہ ٹھہریں اور شام کو — اللہ کے کامل کلمات کی پناہ مانگیں"},
 ar:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ",
 m:{en:"I seek refuge in the perfect words of Allah from the evil of what He has created.", ur:"میں اللہ کے کامل کلمات کی پناہ مانگتا ہوں اس کی مخلوق کے شر سے۔"},
 use:{en:"Protection from anything harmful — stings, bites, unseen harm.", ur:"ہر نقصان دہ چیز سے حفاظت — ڈنک، کاٹنا، نظر نہ آنے والا نقصان۔"},
 rw:{en:"Whoever stops at a place and says this, nothing will harm him until he leaves it (Muslim 2708). Said in the evening, a scorpion’s sting would not have harmed (Muslim 2709).", ur:"جو کسی جگہ اترے اور یہ پڑھے، وہاں سے روانہ ہونے تک اسے کوئی چیز نقصان نہیں دے گی (مسلم 2708)۔ شام کو پڑھنے پر بچھو کا ڈسنا بھی نقصان نہ دیتا (مسلم 2709)۔"},
 how:{en:"Evening: 3 times. Also whenever you arrive somewhere new.", ur:"شام: تین بار۔ اور جب بھی کسی نئی جگہ پہنچیں۔"},
 src:"Sahih Muslim 2708, 2709", acts:["morning","out"], needs:["protect"], ruq:true, cnt:3, from:"Ruqyah screenshot (@abostani)"},

{id:"pain_dua", kind:"dua", g:"sahih",
 t:{en:"For pain: hand on the spot, «Bismillah» ×3, then this ×7", ur:"درد کے لیے: جگہ پر ہاتھ، تین بار «بسم اللہ»، پھر یہ سات بار"},
 ar:"بِاسْمِ اللَّهِ (×٣) — أَعُوذُ بِاللَّهِ وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ (×٧)",
 m:{en:"In the name of Allah (3×). I seek refuge in Allah and His power from the evil of what I feel and what I fear (7×).", ur:"اللہ کے نام سے (تین بار)۔ میں اللہ اور اس کی قدرت کی پناہ مانگتا ہوں اس تکلیف کے شر سے جو میں محسوس کرتا ہوں اور جس کا مجھے ڈر ہے (سات بار)۔"},
 use:{en:"Any physical pain.", ur:"کسی بھی جسمانی درد کے لیے۔"},
 rw:{en:"The Prophet ﷺ taught this to ʿUthman ibn Abi al-ʿAs who complained of pain (Muslim 2202).", ur:"نبی ﷺ نے یہ عثمان بن ابی العاصؓ کو سکھائی جب انہوں نے درد کی شکایت کی (مسلم 2202)۔"},
 how:{en:"Put your hand where it hurts. Bismillah 3 times, then the line 7 times.", ur:"درد کی جگہ ہاتھ رکھیں۔ تین بار بسم اللہ، پھر سات بار یہ کلمات۔"},
 note:{en:"Added by me from Sahih Muslim — not from your reels — because it completes the ruqyah set.", ur:"یہ میں نے صحیح مسلم سے شامل کی — آپ کی ریلز میں نہیں تھی — کیونکہ رقیہ کا سیٹ مکمل ہو جاتا ہے۔"},
 src:"Sahih Muslim 2202", acts:["ill"], needs:["heal"], ruq:true, cnt:7},

{id:"kids_auzu", kind:"dua", g:"sahih",
 t:{en:"Protect your children the way the Prophet ﷺ protected Hasan and Husayn", ur:"بچوں کی حفاظت اسی طرح کریں جیسے نبی ﷺ حسنؓ و حسینؓ کی کرتے"},
 ar:"أُعِيذُكُمَا بِكَلِمَاتِ اللَّهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لَامَّةٍ",
 ar2:"وَإِنِّي أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ الشَّيْطَانِ الرَّجِيمِ",
 ar2l:{en:"Maryam’s mother’s words for her newborn (Qur'an 3:36):", ur:"مریمؑ کی والدہ کے الفاظ نومولود کے لیے (آل عمران 3:36):"},
 m:{en:"I place you both under the protection of Allah’s perfect words, from every devil and harmful creature, and from every evil eye. — (3:36) «And I seek refuge for her in You, and for her offspring, from Shaytan the outcast.»", ur:"میں تم دونوں کو اللہ کے کامل کلمات کی پناہ میں دیتا ہوں، ہر شیطان اور زہریلے جانور سے، اور ہر نظر لگانے والی آنکھ سے۔ — (3:36) «اور میں اسے اور اس کی اولاد کو مردود شیطان سے تیری پناہ میں دیتی ہوں۔»"},
 use:{en:"Protecting children from Shaytan and the evil eye.", ur:"بچوں کو شیطان اور نظرِ بد سے بچانا۔"},
 rw:{en:"The Prophet ﷺ said this over Hasan and Husayn (Tirmidhi 2060 — this exact wording). He said Ibrahim used to seek refuge for Ismaʿil and Ishaq with «أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ…» (Bukhari 3371). Shaytan touches every newborn except Maryam and her son — because of her mother’s dua (Bukhari 3431).", ur:"نبی ﷺ یہ حسنؓ و حسینؓ پر پڑھتے تھے (ترمذی 2060 — یہی الفاظ)۔ آپ ﷺ نے فرمایا کہ ابراہیمؑ اسماعیلؑ اور اسحاقؑ کے لیے «أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ…» سے پناہ مانگتے تھے (بخاری 3371)۔ شیطان ہر نومولود کو چھوتا ہے سوائے مریمؑ اور ان کے بیٹے کے — ان کی والدہ کی دعا کی وجہ سے (بخاری 3431)۔"},
 how:{en:"For one boy say «uʿīdhuka», for one girl «uʿīdhuki», for two «uʿīdhukumā», for more «uʿīdhukum».", ur:"ایک لڑکے کے لیے «أُعِيذُكَ»، ایک لڑکی کے لیے «أُعِيذُكِ»، دو کے لیے «أُعِيذُكُمَا»، زیادہ کے لیے «أُعِيذُكُمْ»۔"},
 src:"Jami' at-Tirmidhi 2060 · Sahih al-Bukhari 3371, 3431 · Qur'an 3:36", acts:["any"], needs:["family","protect"], ruq:true, from:"@quranflows.app"},

{id:"devils_dua", kind:"dua", g:"disputed",
 t:{en:"Say the words Jibril taught on the night the devils came with fire", ur:"وہ کلمات پڑھیں جو جبریلؑ نے اُس رات سکھائے جب شیاطین آگ لے کر آئے"},
 ar:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّةِ مِنْ شَرِّ مَا خَلَقَ، وَذَرَأَ وَبَرَأَ، وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ، وَمِنْ شَرِّ مَا يَعْرُجُ فِيهَا، وَمِنْ شَرِّ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ شَرِّ كُلِّ طَارِقٍ إِلَّا طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ",
 ar2:"أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ الَّتِي لَا يُجَاوِزُهُنَّ بَرٌّ وَلَا فَاجِرٌ، مِنْ شَرِّ مَا خَلَقَ وَبَرَأَ وَذَرَأَ، وَمِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ، وَمِنْ شَرِّ مَا يَعْرُجُ فِيهَا، وَمِنْ شَرِّ مَا ذَرَأَ فِي الْأَرْضِ، وَمِنْ شَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ شَرِّ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ شَرِّ كُلِّ طَارِقٍ إِلَّا طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمَنُ",
 ar2l:{en:"The longer wording from the reel’s caption (it adds phrases found in other narrations — it is not the exact text of Ahmad 15460):", ur:"ریل کے کیپشن والے لمبے الفاظ (ان میں دوسری روایات کے جملے شامل ہیں — یہ مسند احمد 15460 کے بالکل الفاظ نہیں):"},
 m:{en:"I seek refuge in the perfect words of Allah from the evil of what He created, spread and brought into being; from the evil of what comes down from the sky and what rises up into it; from the evil of the trials of night and day; and from the evil of every night-comer — except one who comes with good, O Most Merciful.", ur:"میں اللہ کے کامل کلمات کی پناہ مانگتا ہوں اس کے شر سے جو اس نے پیدا کیا، پھیلایا اور بنایا؛ اس کے شر سے جو آسمان سے اترتا ہے اور جو اس میں چڑھتا ہے؛ رات اور دن کے فتنوں کے شر سے؛ اور رات کو آنے والے ہر آنے والے کے شر سے — سوائے اس کے جو خیر لے کر آئے، اے رحمٰن!"},
 use:{en:"Protection from devils, jinn and the trials of night and day.", ur:"شیاطین، جنات اور دن رات کے فتنوں سے حفاظت۔"},
 rw:{en:"When devils came down from the valleys with a torch of fire to burn the Prophet ﷺ, Jibril told him to say this — their fire went out and Allah defeated them (Musnad Ahmad 15460, from ʿAbd al-Rahman ibn Khanbash).", ur:"جب شیاطین وادیوں سے آگ کا شعلہ لے کر نبی ﷺ کو جلانے آئے تو جبریلؑ نے یہ پڑھنے کو کہا — ان کی آگ بجھ گئی اور اللہ نے انہیں شکست دی (مسند احمد 15460)۔"},
 how:{en:"Morning, evening, or whenever you feel afraid at night.", ur:"صبح، شام، یا جب رات کو خوف محسوس ہو۔"},
 note:{en:"Grading differs: Shuʿayb al-Arnaʾut graded this chain weak and al-Bukhari said its chain needs scrutiny, while some other scholars judged it good. The words are a sound way of seeking refuge — for a fully authentic short version, use «Aʿūdhu bi-kalimātillāhit-tāmmāti min sharri mā khalaq» (Muslim 2708).", ur:"درجے میں اختلاف ہے: شعیب ارناؤوطؒ نے سند کو ضعیف کہا اور امام بخاریؒ نے فرمایا اس کی سند محلِ نظر ہے، جبکہ بعض دیگر علماء نے اسے جید کہا۔ الفاظ پناہ مانگنے کا درست طریقہ ہیں — مکمل صحیح مختصر الفاظ کے لیے «أعوذ بكلمات الله التامات من شر ما خلق» پڑھیں (مسلم 2708)۔"},
 src:"Musnad Ahmad 15460", acts:["morning","any"], needs:["protect"], ruq:true, from:"@towards.hu (caption)"}
];

ITEMS.push(
/* ================= DHIKR (aliexplainsdeen + videos) ================= */
{id:"subhan_bihamdih", kind:"dhikr", g:"sahih",
 t:{en:"Say «SubḥānAllāhi wa biḥamdihi» 100 times a day", ur:"دن میں سو بار «سبحان اللہ وبحمدہ» کہیں"},
 ar:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ",
 m:{en:"Glory be to Allah, and with His praise.", ur:"اللہ پاک ہے اور اپنی تعریف کے ساتھ۔"},
 use:{en:"Wiping away sins — the words Allah chose for His angels.", ur:"گناہ مٹانا — وہ کلمات جو اللہ نے اپنے فرشتوں کے لیے چنے۔"},
 rw:{en:"Said 100 times in a day, your sins are wiped away even if they are like the foam of the sea (Bukhari 6405, Muslim 2691). Asked which words are best, the Prophet ﷺ said: what Allah chose for His angels — SubḥānAllāhi wa biḥamdihi (Muslim 2731).", ur:"دن میں سو بار کہنے سے گناہ مٹ جاتے ہیں چاہے سمندر کی جھاگ کے برابر ہوں (بخاری 6405، مسلم 2691)۔ پوچھا گیا کون سا کلام بہترین ہے؟ فرمایا: جو اللہ نے اپنے فرشتوں کے لیے چنا — سبحان اللہ وبحمدہ (مسلم 2731)۔"},
 how:{en:"100 times — any time of day. Morning or evening is easiest.", ur:"سو بار — دن میں کسی بھی وقت۔ صبح یا شام سب سے آسان۔"},
 src:"Sahih al-Bukhari 6405 · Sahih Muslim 2691, 2731", acts:["morning","any"], needs:["forgive","reward"], cnt:100, from:"@aliexplainsdeen slides"},

{id:"tahlil100", kind:"dhikr", g:"sahih",
 t:{en:"Say the full «Lā ilāha illallāh…» 100 times a day", ur:"دن میں سو بار مکمل «لا الٰہ الا اللہ…» پڑھیں"},
 ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
 m:{en:"There is no god but Allah, alone, without partner. His is the dominion and His is the praise, and He has power over all things.", ur:"اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے، اس کا کوئی شریک نہیں۔ بادشاہی اسی کی ہے اور تعریف اسی کی، اور وہ ہر چیز پر قادر ہے۔"},
 use:{en:"Massive reward and protection from Shaytan for the whole day.", ur:"بہت بڑا اجر اور سارا دن شیطان سے حفاظت۔"},
 rw:{en:"Equal to freeing ten slaves, 100 good deeds written, 100 sins erased, and protection from Shaytan that day until evening (Bukhari 6403, Muslim 2691).", ur:"دس غلام آزاد کرنے کے برابر، سو نیکیاں لکھی جاتی ہیں، سو گناہ مٹا دیے جاتے ہیں، اور اس دن شام تک شیطان سے حفاظت (بخاری 6403، مسلم 2691)۔"},
 how:{en:"100 times in a day — best early, so the protection covers your day.", ur:"دن میں سو بار — صبح سویرے بہتر تاکہ پورا دن حفاظت رہے۔"},
 src:"Sahih al-Bukhari 6403 · Sahih Muslim 2691", acts:["morning","any"], needs:["reward","protect"], cnt:100, from:"@aliexplainsdeen slides"},

{id:"alhamdulillah", kind:"dhikr", g:"sahih",
 t:{en:"Say «Alḥamdulillāh» — especially after eating or drinking", ur:"«الحمد للہ» کہیں — خاص طور پر کھانے پینے کے بعد"},
 ar:"الْحَمْدُ لِلَّهِ",
 m:{en:"All praise belongs to Allah.", ur:"سب تعریف اللہ کے لیے ہے۔"},
 use:{en:"Gratitude — and gratitude brings increase.", ur:"شکر — اور شکر سے نعمت بڑھتی ہے۔"},
 rw:{en:"«Alḥamdulillāh fills the scale; SubḥānAllāh and Alḥamdulillāh together fill what is between the heavens and the earth» (Muslim 223). Allah is pleased with the servant who praises Him after eating or drinking (Muslim 2734). «If you are grateful, I will surely increase you» (Qur'an 14:7). It is also how the people of Paradise end their prayer (10:10).", ur:"«الحمد للہ میزان کو بھر دیتا ہے؛ سبحان اللہ اور الحمد للہ مل کر آسمان و زمین کے درمیان کو بھر دیتے ہیں» (مسلم 223)۔ اللہ اس بندے سے راضی ہوتا ہے جو کھا پی کر اس کی حمد کرے (مسلم 2734)۔ «اگر تم شکر کرو گے تو میں تمہیں ضرور زیادہ دوں گا» (ابراہیم 14:7)۔ اہلِ جنت کی دعا کا آخر بھی یہی ہے (یونس 10:10)۔"},
 how:{en:"After every meal and drink, and whenever you notice a blessing.", ur:"ہر کھانے اور پینے کے بعد، اور جب بھی کوئی نعمت محسوس ہو۔"},
 src:"Sahih Muslim 223, 2734 · Qur'an 14:7, 10:10", acts:["eat","any"], needs:["grat","rizq"], from:"@aliexplainsdeen slides, @reachmohammed"},

{id:"sleep_tasbih", kind:"dhikr", g:"sahih",
 t:{en:"Before sleep: SubḥānAllāh 33 · Alḥamdulillāh 33 · Allāhu Akbar 34", ur:"سونے سے پہلے: سبحان اللہ 33 · الحمد للہ 33 · اللہ اکبر 34"},
 ar:"سُبْحَانَ اللَّهِ (٣٣) — الْحَمْدُ لِلَّهِ (٣٣) — اللَّهُ أَكْبَرُ (٣٤)",
 m:{en:"Glory be to Allah (33) — All praise is for Allah (33) — Allah is the Greatest (34).", ur:"اللہ پاک ہے (33) — سب تعریف اللہ کے لیے (33) — اللہ سب سے بڑا ہے (34)۔"},
 use:{en:"Strength for your day — what the Prophet ﷺ gave his daughter instead of a servant.", ur:"دن بھر کی طاقت — جو نبی ﷺ نے اپنی بیٹی کو خادم کے بجائے دیا۔"},
 rw:{en:"Fatimah’s hands were sore from the hand-mill and she asked for a servant. He ﷺ said: «Shall I not teach you something better than what you asked?» — this at bedtime — «It is better for you both than a servant» (Bukhari 3705, Muslim 2727). «Allāhu Akbar» is one of the four phrases most beloved to Allah (Muslim 2137).", ur:"فاطمہؓ کے ہاتھ چکی سے زخمی تھے، انہوں نے خادم مانگا۔ آپ ﷺ نے فرمایا: «کیا میں تمہیں اس سے بہتر چیز نہ بتاؤں؟» — سوتے وقت یہ — «یہ تم دونوں کے لیے خادم سے بہتر ہے» (بخاری 3705، مسلم 2727)۔ «اللہ اکبر» اللہ کے سب سے پسندیدہ چار کلمات میں سے ہے (مسلم 2137)۔"},
 how:{en:"In bed, before sleeping. Tap the counter — it walks you through all 100.", ur:"بستر پر، سونے سے پہلے۔ کاؤنٹر دبائیں — یہ آپ کو پورے 100 تک لے جائے گا۔"},
 src:"Sahih al-Bukhari 3705 · Sahih Muslim 2727, 2137", acts:["sleep"], needs:["ease","reward"],
 seq:[{ar:"سُبْحَانَ اللَّهِ",n:33},{ar:"الْحَمْدُ لِلَّهِ",n:33},{ar:"اللَّهُ أَكْبَرُ",n:34}], from:"@aliexplainsdeen slides"},

{id:"la_hawla", kind:"dhikr", g:"sahih",
 t:{en:"Say «Lā ḥawla wa lā quwwata illā billāh» often", ur:"کثرت سے «لا حول ولا قوۃ الا باللہ» کہیں"},
 ar:"لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
 m:{en:"There is no might and no power except with Allah.", ur:"اللہ کے سوا نہ کوئی طاقت ہے نہ قوت۔"},
 use:{en:"When you feel weak or helpless — handing everything over to Allah.", ur:"جب کمزوری یا بے بسی محسوس ہو — سب کچھ اللہ کے سپرد کرنا۔"},
 rw:{en:"The Prophet ﷺ called it «a treasure from the treasures of Paradise» (Bukhari 6384). Ibn Masʿud explained it: no turning from sin except by His protection, no strength to obey except by His help.", ur:"نبی ﷺ نے اسے «جنت کے خزانوں میں سے ایک خزانہ» فرمایا (بخاری 6384)۔ ابن مسعودؓ نے فرمایا: اللہ کی حفاظت کے بغیر گناہ سے بچنا ممکن نہیں، اور اس کی مدد کے بغیر اطاعت کی طاقت نہیں۔"},
 how:{en:"Any time — especially when overwhelmed, and when the Adhan says «ḥayya ʿalaṣ-ṣalāh».", ur:"کسی بھی وقت — خاص طور پر پریشانی میں، اور جب اذان میں «حَیَّ عَلَی الصَّلَاۃ» آئے۔"},
 src:"Sahih al-Bukhari 6384 · Sahih Muslim 385", acts:["any","adhan"], needs:["ease","reward"], cnt:33, from:"@aliexplainsdeen slides, @piousdeenn (April)"},

{id:"umm_hani", kind:"dhikr", g:"hasan",
 t:{en:"The «sitting-down» deed: SubḥānAllāh, Alḥamdulillāh, Allāhu Akbar, Lā ilāha illallāh — 100 each", ur:"«بیٹھے بیٹھے» والا عمل: سبحان اللہ، الحمد للہ، اللہ اکبر، لا الٰہ الا اللہ — ہر ایک سو بار"},
 ar:"سُبْحَانَ اللَّهِ (١٠٠) — الْحَمْدُ لِلَّهِ (١٠٠) — اللَّهُ أَكْبَرُ (١٠٠) — لَا إِلَٰهَ إِلَّا اللَّهُ (١٠٠)",
 m:{en:"Glory be to Allah — All praise is for Allah — Allah is the Greatest — There is no god but Allah.", ur:"اللہ پاک ہے — سب تعریف اللہ کے لیے — اللہ سب سے بڑا ہے — اللہ کے سوا کوئی معبود نہیں۔"},
 use:{en:"A huge deed you can do while sitting, even when old or tired.", ur:"ایک بڑا عمل جو بیٹھے بیٹھے ہو جائے، بڑھاپے یا تھکن میں بھی۔"},
 rw:{en:"Umm Hani said «I have become old and weak». He ﷺ said: 100 tasbih equals freeing 100 slaves from the children of Ismaʿil; 100 tahmid equals 100 saddled horses given in Allah’s path; 100 takbir equals 100 accepted sacrificial camels; and 100 tahlil fills what is between the heavens and the earth — no one’s deed that day is raised above yours unless he did the same (Ahmad 26911).", ur:"ام ہانیؓ نے کہا: «میں بوڑھی اور کمزور ہو گئی ہوں»۔ آپ ﷺ نے فرمایا: سو بار تسبیح اولادِ اسماعیلؑ کے سو غلام آزاد کرنے کے برابر؛ سو بار تحمید اللہ کی راہ میں سو زین کسے گھوڑے دینے کے برابر؛ سو بار تکبیر سو مقبول قربانی کے اونٹوں کے برابر؛ اور سو بار تہلیل آسمان و زمین کے درمیان کو بھر دیتی ہے — اس دن کسی کا عمل تم سے بڑھ کر نہ اٹھایا جائے گا سوائے اس کے جو یہی کرے (مسند احمد 26911)۔"},
 how:{en:"100 of each, any time. The counter goes through all four.", ur:"ہر ایک سو بار، کسی بھی وقت۔ کاؤنٹر چاروں سے گزارے گا۔"},
 note:{en:"Al-Albani graded the Ahmad version hasan (Sahih at-Targhib 1553). The shorter Ibn Majah 3810 version is graded weak.", ur:"البانیؒ نے مسند احمد والی روایت کو حسن کہا (صحیح الترغیب 1553)۔ ابن ماجہ 3810 والی مختصر روایت ضعیف ہے۔"},
 src:"Musnad Ahmad 26911 · Sahih at-Targhib 1553", acts:["any"], needs:["reward"],
 seq:[{ar:"سُبْحَانَ اللَّهِ",n:100},{ar:"الْحَمْدُ لِلَّهِ",n:100},{ar:"اللَّهُ أَكْبَرُ",n:100},{ar:"لَا إِلَٰهَ إِلَّا اللَّهُ",n:100}], from:"@ikh_islamicstudio"},

{id:"juwayriyah", kind:"dhikr", g:"sahih",
 t:{en:"After Fajr: say the four heavy phrases 3 times", ur:"فجر کے بعد: چار وزنی کلمات تین بار"},
 ar:"سُبْحَانَ اللَّهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ",
 m:{en:"Glory be to Allah and with His praise — as many as His creation, as much as pleases Him, as heavy as His Throne, and as much as the ink of His words.", ur:"اللہ پاک ہے اور اپنی تعریف کے ساتھ — اپنی مخلوق کی تعداد کے برابر، اپنی رضا کے برابر، اپنے عرش کے وزن کے برابر، اور اپنے کلمات کی سیاہی کے برابر۔"},
 use:{en:"Outweighing hours of dhikr in seconds.", ur:"چند سیکنڈ میں گھنٹوں کے ذکر سے بھاری۔"},
 rw:{en:"The Prophet ﷺ left Juwayriyah sitting in dhikr after Fajr and returned at mid-morning. He said: «I said four phrases three times after leaving you; if weighed against all you said today, they would outweigh it» (Muslim 2726).", ur:"نبی ﷺ فجر کے بعد جویریہؓ کو ذکر میں بیٹھا چھوڑ کر گئے اور چاشت کو لوٹے۔ فرمایا: «میں نے تمہارے بعد چار کلمے تین بار کہے؛ اگر انہیں تمہارے آج کے سارے ذکر سے تولا جائے تو یہ بھاری ہوں گے» (مسلم 2726)۔"},
 how:{en:"3 times, ideally after Fajr.", ur:"تین بار، بہتر ہے فجر کے بعد۔"},
 src:"Sahih Muslim 2726", acts:["morning"], needs:["reward"], cnt:3, from:"@youssefbaleeghcoach"},

{id:"five_foam", kind:"dhikr", g:"hasan",
 t:{en:"Say the five words that erase sins «like the foam of the sea»", ur:"وہ پانچ کلمات کہیں جو «سمندر کی جھاگ جتنے» گناہ مٹا دیں"},
 ar:"لَا إِلَٰهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَسُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
 m:{en:"There is no god but Allah; Allah is the Greatest; glory be to Allah; all praise is for Allah; and there is no might nor power except with Allah.", ur:"اللہ کے سوا کوئی معبود نہیں؛ اللہ سب سے بڑا ہے؛ اللہ پاک ہے؛ سب تعریف اللہ کے لیے ہے؛ اور اللہ کے سوا نہ کوئی طاقت ہے نہ قوت۔"},
 use:{en:"Quick forgiveness, any time.", ur:"کسی بھی وقت فوری مغفرت۔"},
 rw:{en:"«There is no one on earth who says [these] except that his sins are expiated, even if they were like the foam of the sea» (Tirmidhi 3460 — hasan per al-Albani; Ahmad 6479 includes SubḥānAllāh and Alḥamdulillāh — sahih chain per Ahmad Shakir).", ur:"«زمین پر جو بھی یہ کلمات کہے اس کے گناہ معاف کر دیے جاتے ہیں چاہے سمندر کی جھاگ کے برابر ہوں» (ترمذی 3460 — البانیؒ: حسن؛ مسند احمد 6479 میں سبحان اللہ اور الحمد للہ بھی ہیں — احمد شاکر: سند صحیح)۔"},
 how:{en:"Any time, as often as you like.", ur:"کسی بھی وقت، جتنی بار چاہیں۔"},
 src:"Jami' at-Tirmidhi 3460 · Musnad Ahmad 6479", acts:["any"], needs:["forgive"], cnt:10, from:"@samer_speaks"},

{id:"five_illness", kind:"dhikr", g:"sahih",
 t:{en:"When ill: say the five «Lā ilāha illallāh» phrases that Allah answers", ur:"بیماری میں: «لا الٰہ الا اللہ» کے وہ پانچ کلمات جن کی اللہ تصدیق فرماتا ہے"},
 ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَاللَّهُ أَكْبَرُ\nلَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ\nلَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ\nلَا إِلَٰهَ إِلَّا اللَّهُ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ\nلَا إِلَٰهَ إِلَّا اللَّهُ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
 m:{en:"1) There is no god but Allah, and Allah is the Greatest. 2) There is no god but Allah, alone. 3) There is no god but Allah, alone, without partner. 4) There is no god but Allah; His is the dominion and His is the praise. 5) There is no god but Allah, and there is no might nor power except with Allah.", ur:"1) اللہ کے سوا کوئی معبود نہیں اور اللہ سب سے بڑا ہے۔ 2) اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے۔ 3) اللہ کے سوا کوئی معبود نہیں، اکیلا ہے، کوئی شریک نہیں۔ 4) اللہ کے سوا کوئی معبود نہیں، بادشاہی اور تعریف اسی کی ہے۔ 5) اللہ کے سوا کوئی معبود نہیں، اور اللہ کے سوا نہ طاقت ہے نہ قوت۔"},
 use:{en:"Saying them in illness — protection from the Fire.", ur:"بیماری میں پڑھنا — جہنم سے حفاظت۔"},
 rw:{en:"For each phrase, Allah confirms it: «There is no god but Me, and I am the Greatest…». «Whoever says them in his illness and then dies, the Fire will not consume him» (Tirmidhi 3430 — sahih per al-Albani; hasan per Ibn Hajar).", ur:"ہر کلمے پر اللہ تصدیق فرماتا ہے: «میرے سوا کوئی معبود نہیں اور میں سب سے بڑا ہوں…»۔ «جو بیماری میں یہ کہے اور پھر فوت ہو جائے، آگ اسے نہیں کھائے گی» (ترمذی 3430 — البانیؒ: صحیح؛ ابن حجرؒ: حسن)۔"},
 how:{en:"Any time — especially when unwell. Saying them daily is a good habit too.", ur:"کسی بھی وقت — خاص طور پر بیماری میں۔ روزانہ پڑھنا بھی اچھی عادت ہے۔"},
 note:{en:"The reel says «if you die that day, week or month your sins are forgiven». The well-graded wording is the one above (said in illness → the Fire will not consume him).", ur:"ریل میں کہا گیا «اسی دن، ہفتے یا مہینے مرو تو گناہ معاف»۔ مستند الفاظ اوپر والے ہیں (بیماری میں پڑھنے پر آگ نہیں کھائے گی)۔"},
 src:"Jami' at-Tirmidhi 3430 · Ibn Majah 3794", acts:["ill","any"], needs:["jannah","heal"], from:"@samer_speaks"},

/* ================= DUAS BY NEED (piousdeenn + videos) ================= */
{id:"la_sahla", kind:"dua", g:"sahih",
 t:{en:"Ask Allah to make a hard thing easy", ur:"اللہ سے مشکل کام آسان کرنے کی دعا"},
 ar:"اللَّهُمَّ لَا سَهْلَ إِلَّا مَا جَعَلْتَهُ سَهْلًا، وَأَنْتَ تَجْعَلُ الْحَزْنَ سَهْلًا إِذَا شِئْتَ",
 m:{en:"O Allah, nothing is easy except what You make easy, and You make the difficult easy when You will.", ur:"اے اللہ! کوئی کام آسان نہیں سوائے اس کے جسے تو آسان کر دے، اور تو جب چاہے مشکل کو آسان کر دیتا ہے۔"},
 use:{en:"Exams, interviews, hard tasks, overwhelming days.", ur:"امتحان، انٹرویو، مشکل کام، بوجھل دن۔"},
 rw:{en:"A dua of the Prophet ﷺ (Ibn Hibban 974 — chain sahih per al-Albani, Silsilah as-Sahihah 2886).", ur:"نبی ﷺ کی دعا (ابن حبان 974 — البانیؒ: سند صحیح، سلسلہ صحیحہ 2886)۔"},
 how:{en:"Before starting anything difficult.", ur:"کوئی بھی مشکل کام شروع کرنے سے پہلے۔"},
 note:{en:"The carousel links this dua to people born in January. Matching duas to birth months has no basis — it’s a good dua for everyone.", ur:"کیروسل نے اسے جنوری میں پیدا ہونے والوں سے جوڑا۔ پیدائش کے مہینے سے دعا جوڑنے کی کوئی بنیاد نہیں — یہ سب کے لیے اچھی دعا ہے۔"},
 src:"Sahih Ibn Hibban 974 · as-Silsilah as-Sahihah 2886", acts:["any"], needs:["ease"], from:"@piousdeenn (January)"},

{id:"hasbunallah", kind:"quran", g:"quran",
 t:{en:"Say «Ḥasbunallāhu wa niʿmal-wakīl» when afraid or overwhelmed", ur:"ڈر یا پریشانی میں «حسبنا اللہ ونعم الوکیل» کہیں"},
 ar:"حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ",
 m:{en:"Allah is sufficient for us, and He is the best Disposer of affairs.", ur:"ہمیں اللہ کافی ہے اور وہ بہترین کارساز ہے۔"},
 use:{en:"Fear, pressure, people against you, situations beyond your control.", ur:"خوف، دباؤ، لوگ مخالف ہوں، حالات قابو سے باہر ہوں۔"},
 rw:{en:"Ibrahim said it when thrown into the fire, and Muhammad ﷺ said it when told «people have gathered against you» (Bukhari 4563). Allah says they returned «with favour and bounty from Allah; no harm touched them» (3:173–174).", ur:"ابراہیمؑ نے آگ میں ڈالے جاتے وقت یہ کہا، اور محمد ﷺ نے تب کہا جب کہا گیا «لوگ تمہارے خلاف جمع ہو گئے ہیں» (بخاری 4563)۔ اللہ فرماتا ہے وہ «اللہ کی نعمت اور فضل کے ساتھ لوٹے، انہیں کوئی تکلیف نہ پہنچی» (آل عمران 3:173–174)۔"},
 how:{en:"Whenever worry hits. Say it with full trust.", ur:"جب بھی پریشانی آئے۔ پورے بھروسے کے ساتھ کہیں۔"},
 src:"Qur'an 3:173–174 · Sahih al-Bukhari 4563", acts:["any"], needs:["worry","ease","rizq"], cnt:7, from:"@piousdeenn (February), @uqbah.ibn.faisal, @reachmohammed"},

{id:"yunus", kind:"quran", g:"sahih",
 t:{en:"Make the dua of Yunus (inside the whale) in distress", ur:"مصیبت میں یونسؑ (مچھلی کے پیٹ والی) کی دعا"},
 ar:"لَا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ",
 m:{en:"There is no god but You; glory be to You. Indeed, I have been of the wrongdoers.", ur:"تیرے سوا کوئی معبود نہیں، تو پاک ہے، بے شک میں ہی ظالموں میں سے تھا۔"},
 use:{en:"Distress, regret, and asking for relief and forgiveness.", ur:"مصیبت، ندامت، راحت اور معافی کی طلب۔"},
 rw:{en:"«No Muslim ever calls upon his Lord with it for anything except that He answers him» (Tirmidhi 3505 — sahih per al-Albani). Allah says: «So We answered him and saved him from distress — and thus do We save the believers» (21:88).", ur:"«جو مسلمان بھی کسی معاملے میں اس کے ذریعے اپنے رب کو پکارے، اللہ اس کی دعا قبول کرتا ہے» (ترمذی 3505 — البانیؒ: صحیح)۔ اللہ فرماتا ہے: «ہم نے اس کی دعا قبول کی اور غم سے نجات دی، اور ہم مومنوں کو یوں ہی نجات دیتے ہیں» (الانبیاء 21:88)۔"},
 how:{en:"As often as you like, especially in hard moments.", ur:"جتنی بار چاہیں، خاص طور پر مشکل وقت میں۔"},
 src:"Qur'an 21:87–88 · Jami' at-Tirmidhi 3505", acts:["any"], needs:["worry","forgive","answer"], cnt:33, from:"@piousdeenn (March)"},

{id:"musa_rizq", kind:"quran", g:"quran",
 t:{en:"Make Musa’s dua when you need a job, home or an opening", ur:"نوکری، گھر یا کسی دروازے کے کھلنے کے لیے موسیٰؑ کی دعا"},
 ar:"رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ",
 m:{en:"My Lord, I am truly in need of whatever good You send down to me.", ur:"اے میرے رب! جو بھلائی بھی تو میری طرف اتارے، میں اس کا محتاج ہوں۔"},
 use:{en:"Rizq, a job, marriage, any opportunity.", ur:"رزق، نوکری، رشتہ، کوئی بھی موقع۔"},
 rw:{en:"Musa said it alone, hungry and a stranger in Madyan. In the very next verses Allah gave him safety, work and a wife (28:24–27).", ur:"موسیٰؑ نے مدین میں تنہا، بھوکے اور اجنبی حالت میں یہ کہا۔ اگلی ہی آیات میں اللہ نے انہیں امان، کام اور بیوی عطا کی (القصص 28:24–27)۔"},
 how:{en:"Any time. Pour your need into it.", ur:"کسی بھی وقت۔ اپنی ساری ضرورت اس میں رکھ دیں۔"},
 note:{en:"Reels suggested «pray two rakʿah first» and «do it for 7 nights». Praying first is a good adab, but the 7-night promise has no source.", ur:"ریلز میں «پہلے دو رکعت» اور «سات راتیں کریں» کہا گیا۔ پہلے نماز پڑھنا اچھا ادب ہے، لیکن سات راتوں کے وعدے کا کوئی ماخذ نہیں۔"},
 src:"Qur'an 28:24", acts:["any"], needs:["rizq","family"], cnt:7, from:"@piousdeenn (May), @minaretminds, @reachmohammed"},

{id:"maiya_rabbi", kind:"quran", g:"quran",
 t:{en:"Remind yourself «My Lord is with me» when you feel lost", ur:"جب راستہ نہ سوجھے تو خود کو یاد دلائیں «میرا رب میرے ساتھ ہے»"},
 ar:"إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ",
 m:{en:"Indeed, my Lord is with me; He will guide me.", ur:"بے شک میرا رب میرے ساتھ ہے، وہ ضرور میری رہنمائی کرے گا۔"},
 use:{en:"Uncertainty, fear of the future, feeling trapped.", ur:"بے یقینی، مستقبل کا خوف، پھنسا ہوا محسوس کرنا۔"},
 rw:{en:"Musa said it with the sea in front and Pharaoh’s army behind — then the sea split (26:61–63).", ur:"موسیٰؑ نے یہ تب کہا جب آگے سمندر اور پیچھے فرعون کا لشکر تھا — پھر سمندر پھٹ گیا (الشعراء 26:61–63)۔"},
 how:{en:"A statement of trust (not a hadith dua) — say it to steady your heart.", ur:"یہ بھروسے کا اعلان ہے (حدیث والی دعا نہیں) — دل کو مضبوط کرنے کے لیے کہیں۔"},
 src:"Qur'an 26:62", acts:["any"], needs:["guide","worry"], from:"@piousdeenn (June)"},

{id:"muqallib", kind:"dua", g:"sahih",
 t:{en:"Ask Allah to keep your heart firm on His deen", ur:"اللہ سے دل کو دین پر ثابت رکھنے کی دعا"},
 ar:"يَا مُقَلِّبَ الْقُلُوبِ، ثَبِّتْ قَلْبِي عَلَى دِينِكَ",
 m:{en:"O Turner of hearts, keep my heart firm upon Your religion.", ur:"اے دلوں کو پھیرنے والے! میرے دل کو اپنے دین پر ثابت رکھ۔"},
 use:{en:"Staying steady in faith.", ur:"ایمان پر ثابت قدمی۔"},
 rw:{en:"Umm Salamah said this was the dua the Prophet ﷺ made most often (Tirmidhi 3522 — hasan per Darussalam; sahih per al-Albani).", ur:"ام سلمہؓ نے فرمایا یہ نبی ﷺ کی سب سے زیادہ کی جانے والی دعا تھی (ترمذی 3522 — دارالسلام: حسن؛ البانیؒ: صحیح)۔"},
 how:{en:"Often — in sujud, after salah, any time.", ur:"کثرت سے — سجدے میں، نماز کے بعد، کسی بھی وقت۔"},
 src:"Jami' at-Tirmidhi 3522", acts:["any","salah"], needs:["guide"], cnt:3, from:"@piousdeenn (July)"},

{id:"hasbiyallah", kind:"quran", g:"quran",
 t:{en:"Put your full trust in Allah with «Ḥasbiyallāh…»", ur:"«حسبی اللہ…» کے ساتھ اللہ پر پورا بھروسہ"},
 ar:"حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ",
 m:{en:"Allah is sufficient for me; there is no god but Him. In Him I put my trust, and He is the Lord of the Mighty Throne.", ur:"مجھے اللہ کافی ہے، اس کے سوا کوئی معبود نہیں۔ اسی پر میں نے بھروسہ کیا اور وہی عرشِ عظیم کا رب ہے۔"},
 use:{en:"Anxiety about the future, waiting for Allah’s help.", ur:"مستقبل کی فکر، اللہ کی مدد کا انتظار۔"},
 rw:{en:"A verse of the Qur'an (9:129) — a powerful declaration of tawakkul.", ur:"قرآن کی آیت (التوبہ 9:129) — توکل کا زبردست اعلان۔"},
 how:{en:"Any time, morning and evening.", ur:"کسی بھی وقت، صبح و شام۔"},
 note:{en:"A popular claim says «say it 7 times morning and evening and Allah will suffice you». That report (Abu Dawud 5081) is a saying of Abu al-Dardaʾ, and al-Albani graded the attribution to the Prophet ﷺ as fabricated. The verse itself is beautiful to say — just don’t rely on that specific promise.", ur:"مشہور ہے کہ «صبح شام سات بار کہو تو اللہ کافی ہو جائے گا»۔ یہ روایت (ابوداؤد 5081) ابو الدرداءؓ کا قول ہے، اور البانیؒ نے اسے نبی ﷺ کی طرف منسوب کرنے کو موضوع کہا۔ آیت پڑھنا بہت اچھا ہے — بس اس خاص وعدے پر بھروسہ نہ کریں۔"},
 src:"Qur'an 9:129 · (Abu Dawud 5081 — see note)", acts:["morning","any"], needs:["worry","ease"], cnt:7, from:"@piousdeenn (August)"},

{id:"awzini", kind:"quran", g:"quran",
 t:{en:"Ask Allah to make you grateful (Sulayman’s dua)", ur:"اللہ سے شکر گزاری کی توفیق مانگیں (سلیمانؑ کی دعا)"},
 ar:"رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ",
 m:{en:"My Lord, inspire me to be grateful for the favour You have blessed me and my parents with, and to do good deeds that please You, and admit me by Your mercy among Your righteous servants.", ur:"اے میرے رب! مجھے توفیق دے کہ میں تیری اس نعمت کا شکر ادا کروں جو تو نے مجھ پر اور میرے والدین پر کی، اور ایسے نیک عمل کروں جو تجھے پسند ہوں، اور اپنی رحمت سے مجھے اپنے نیک بندوں میں داخل فرما۔"},
 use:{en:"Gratitude, and praying for your parents.", ur:"شکر گزاری، اور والدین کے لیے دعا۔"},
 rw:{en:"Sulayman’s dua when he heard the ant (27:19). A similar dua is at 46:15.", ur:"سلیمانؑ کی دعا جب انہوں نے چیونٹی کی بات سنی (النمل 27:19)۔ ایسی ہی دعا الاحقاف 46:15 میں بھی ہے۔"},
 how:{en:"When you receive something good, or any time.", ur:"جب کوئی اچھی چیز ملے، یا کسی بھی وقت۔"},
 note:{en:"The carousel showed only the first part; the full verse is above.", ur:"کیروسل میں صرف پہلا حصہ تھا؛ پوری آیت اوپر ہے۔"},
 src:"Qur'an 27:19", acts:["any"], needs:["grat","family"], from:"@piousdeenn (September)"},

{id:"qurrata", kind:"quran", g:"quran",
 t:{en:"Pray for a righteous spouse and children", ur:"نیک شریکِ حیات اور اولاد کی دعا"},
 ar:"رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا",
 m:{en:"Our Lord, grant us from our spouses and children comfort to our eyes, and make us leaders of the God-conscious.", ur:"اے ہمارے رب! ہمیں ہماری بیویوں اور اولاد سے آنکھوں کی ٹھنڈک عطا فرما اور ہمیں پرہیزگاروں کا امام بنا۔"},
 use:{en:"Marriage, a loving home, righteous children.", ur:"شادی، محبت بھرا گھر، نیک اولاد۔"},
 rw:{en:"Among the duas of «the servants of the Most Merciful» (25:74).", ur:"«رحمٰن کے بندوں» کی دعاؤں میں سے (الفرقان 25:74)۔"},
 how:{en:"Any time — in sujud and after salah too.", ur:"کسی بھی وقت — سجدے میں اور نماز کے بعد بھی۔"},
 src:"Qur'an 25:74", acts:["any"], needs:["family"], from:"@piousdeenn (October)"},

{id:"sadness", kind:"dua", g:"sahih",
 t:{en:"Make the dua for sadness and worry", ur:"غم اور فکر کی دعا"},
 ar:"اللَّهُمَّ إِنِّي عَبْدُكَ، ابْنُ عَبْدِكَ، ابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكْمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ، سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ، أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجِلَاءَ حُزْنِي، وَذَهَابَ هَمِّي",
 m:{en:"O Allah, I am Your servant, son of Your servant, son of Your maidservant. My forelock is in Your hand; Your command over me is done; Your decree about me is just. I ask You by every name that is Yours — which You named Yourself with, revealed in Your Book, taught to any of Your creation, or kept in the knowledge of the unseen with You — to make the Qur'an the spring of my heart, the light of my chest, the remover of my sadness and the departure of my worry.", ur:"اے اللہ! میں تیرا بندہ ہوں، تیرے بندے کا بیٹا، تیری بندی کا بیٹا۔ میری پیشانی تیرے ہاتھ میں ہے؛ تیرا حکم مجھ پر جاری ہے؛ تیرا فیصلہ میرے بارے میں عدل ہے۔ میں تجھ سے تیرے ہر اس نام کے واسطے سے مانگتا ہوں جو تیرا ہے — جو تو نے خود رکھا، اپنی کتاب میں اتارا، اپنی کسی مخلوق کو سکھایا، یا اپنے علمِ غیب میں اپنے پاس رکھا — کہ تو قرآن کو میرے دل کی بہار، میرے سینے کا نور، میرے غم کا مٹانے والا اور میری فکر کو دور کرنے والا بنا دے۔"},
 use:{en:"Sadness, heaviness, «sad for no reason» days.", ur:"اداسی، بوجھل پن، «بلاوجہ اداس» دن۔"},
 rw:{en:"«No one says it except that Allah removes his worry and grief and replaces it with joy» — so learn it (Musnad Ahmad 3712 — sahih per al-Albani, Silsilah as-Sahihah 199, and Ahmad Shakir; Shuʿayb al-Arnaʾut graded the chain weak).", ur:"«جو بھی یہ کہے اللہ اس کی فکر اور غم دور کر کے اسے خوشی سے بدل دیتا ہے» — اس لیے اسے سیکھو (مسند احمد 3712 — البانیؒ: صحیح، سلسلہ صحیحہ 199، اور احمد شاکرؒ؛ شعیب ارناؤوطؒ نے سند کو ضعیف کہا)۔"},
 how:{en:"Whenever you feel low. Women say «amatuka bintu ʿabdika bintu amatik» (أَمَتُكَ بِنْتُ عَبْدِكَ بِنْتُ أَمَتِكَ).", ur:"جب بھی دل بوجھل ہو۔ خواتین کہیں «أَمَتُكَ بِنْتُ عَبْدِكَ بِنْتُ أَمَتِكَ»۔"},
 src:"Musnad Ahmad 3712 · as-Silsilah as-Sahihah 199", acts:["any"], needs:["worry"], from:"@dailyduaremindershq"},

{id:"istighfar_hayy", kind:"dua", g:"sahih",
 t:{en:"Seek forgiveness with the «Al-Ḥayy al-Qayyūm» istighfar", ur:"«الحی القیوم» والا استغفار پڑھیں"},
 ar:"أَسْتَغْفِرُ اللَّهَ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ وَأَتُوبُ إِلَيْهِ",
 m:{en:"I seek forgiveness from Allah — there is no god but Him, the Ever-Living, the Sustainer — and I repent to Him.", ur:"میں اللہ سے مغفرت مانگتا ہوں — اس کے سوا کوئی معبود نہیں، وہ ہمیشہ زندہ، سب کو قائم رکھنے والا ہے — اور اسی کی طرف توبہ کرتا ہوں۔"},
 use:{en:"Forgiveness for even major sins — and istighfar opens rizq.", ur:"بڑے گناہوں کی بھی معافی — اور استغفار سے رزق کے دروازے کھلتے ہیں۔"},
 rw:{en:"«Whoever says it will be forgiven, even if he had fled from the battlefield» (Abu Dawud 1517 — sahih per al-Albani). Nuh told his people: «Seek forgiveness from your Lord… He will send rain, increase you in wealth and children, and give you gardens and rivers» (71:10–12).", ur:"«جو یہ کہے اسے بخش دیا جائے گا، چاہے میدانِ جنگ سے بھاگا ہو» (ابوداؤد 1517 — البانیؒ: صحیح)۔ نوحؑ نے قوم سے کہا: «اپنے رب سے مغفرت مانگو… وہ بارش برسائے گا، مال اور اولاد بڑھائے گا، باغ اور نہریں دے گا» (نوح 71:10–12)۔"},
 how:{en:"Any time — make it a constant habit.", ur:"کسی بھی وقت — اسے مستقل عادت بنائیں۔"},
 note:{en:"The reel also quotes «whoever holds to istighfar, Allah gives him a way out of every hardship, relief from every worry and provision from where he never expected». That hadith (Abu Dawud 1518) is graded weak by al-Albani — but Qur'an 71:10–12 and 65:2–3 make similar promises.", ur:"ریل میں یہ بھی ہے: «جو استغفار کو لازم پکڑ لے اللہ ہر تنگی سے نکلنے کا راستہ، ہر غم سے نجات اور بے گمان رزق دیتا ہے»۔ یہ حدیث (ابوداؤد 1518) البانیؒ کے نزدیک ضعیف ہے — لیکن قرآن 71:10–12 اور 65:2–3 میں ایسے ہی وعدے ہیں۔"},
 src:"Sunan Abi Dawud 1517 · Qur'an 71:10–12", acts:["any"], needs:["forgive","rizq"], cnt:3, from:"@alima.bytes, @reachmohammed"},

{id:"sayyid", kind:"dua", g:"sahih",
 t:{en:"Say Sayyid al-Istighfar — the master of seeking forgiveness — morning & evening", ur:"صبح و شام سید الاستغفار پڑھیں"},
 ar:"اللَّهُمَّ أَنْتَ رَبِّي، لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ لَكَ بِذَنْبِي، فَاغْفِرْ لِي، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ",
 m:{en:"O Allah, You are my Lord; there is no god but You. You created me and I am Your servant. I hold to Your covenant and promise as much as I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me, and I acknowledge my sin — so forgive me, for none forgives sins except You.", ur:"اے اللہ! تو میرا رب ہے، تیرے سوا کوئی معبود نہیں۔ تو نے مجھے پیدا کیا اور میں تیرا بندہ ہوں۔ میں اپنی استطاعت بھر تیرے عہد اور وعدے پر قائم ہوں۔ میں اپنے کیے کے شر سے تیری پناہ مانگتا ہوں۔ میں اپنے اوپر تیری نعمت کا اقرار کرتا ہوں اور اپنے گناہ کا بھی اقرار کرتا ہوں — پس مجھے بخش دے، کیونکہ تیرے سوا کوئی گناہ نہیں بخشتا۔"},
 use:{en:"The best form of asking forgiveness.", ur:"مغفرت مانگنے کا سب سے بہترین طریقہ۔"},
 rw:{en:"Whoever says it in the day with firm belief and dies before evening is among the people of Paradise; whoever says it at night with firm belief and dies before morning is among the people of Paradise (Bukhari 6306).", ur:"جو دن میں یقین کے ساتھ کہے اور شام سے پہلے فوت ہو جائے وہ جنتی ہے؛ جو رات کو یقین کے ساتھ کہے اور صبح سے پہلے فوت ہو جائے وہ جنتی ہے (بخاری 6306)۔"},
 how:{en:"Once in the morning and once in the evening.", ur:"ایک بار صبح، ایک بار شام۔"},
 src:"Sahih al-Bukhari 6306", acts:["morning"], needs:["forgive","jannah"], from:"@safideenn, @thehalalhustleclub"},

{id:"maghfiratuka", kind:"dua", g:"disputed",
 t:{en:"When sins weigh on you: «Your forgiveness is vaster than my sins»", ur:"جب گناہ بوجھ لگیں: «تیری مغفرت میرے گناہوں سے وسیع ہے»"},
 ar:"اللَّهُمَّ مَغْفِرَتُكَ أَوْسَعُ مِنْ ذُنُوبِي، وَرَحْمَتُكَ أَرْجَى عِنْدِي مِنْ عَمَلِي",
 m:{en:"O Allah, Your forgiveness is vaster than my sins, and Your mercy is more hopeful to me than my own deeds.", ur:"اے اللہ! تیری مغفرت میرے گناہوں سے زیادہ وسیع ہے، اور تیری رحمت مجھے اپنے اعمال سے زیادہ امید دلاتی ہے۔"},
 use:{en:"Despair over sins; hope in Allah’s mercy.", ur:"گناہوں پر مایوسی؛ اللہ کی رحمت سے امید۔"},
 rw:{en:"A man cried «my sins, my sins!». The Prophet ﷺ told him to say this; he repeated it three times, then: «Stand — Allah has forgiven you» (al-Hakim, al-Mustadrak 1/728, from Jabir ibn ʿAbdullah).", ur:"ایک شخص پکار رہا تھا «ہائے میرے گناہ!»۔ نبی ﷺ نے یہ کہنے کو فرمایا؛ اس نے تین بار کہا، پھر فرمایا: «اٹھو، اللہ نے تمہیں بخش دیا» (حاکم، المستدرک 1/728، جابر بن عبداللہؓ سے)۔"},
 how:{en:"3 times.", ur:"تین بار۔"},
 note:{en:"Graded differently: al-Hakim and al-Mundhiri considered the chain sound; others (incl. al-Albani) weakened it due to an unknown narrator. The meaning is fully sound.", ur:"درجے میں اختلاف: حاکمؒ اور منذریؒ نے سند کو درست کہا؛ دیگر (بشمول البانیؒ) نے ایک مجہول راوی کی وجہ سے ضعیف کہا۔ معنیٰ بالکل درست ہے۔"},
 src:"al-Mustadrak of al-Hakim (1/728) · al-Mundhiri, at-Targhib 2/386", acts:["any"], needs:["forgive"], cnt:3, from:"@the_scottish_beard"},

{id:"ya_rabbi_lakal", kind:"dua", g:"weak",
 t:{en:"Praise Allah «as befits the majesty of Your Face»", ur:"اللہ کی حمد «جیسے تیرے چہرے کے جلال کے لائق ہے»"},
 ar:"يَا رَبِّ لَكَ الْحَمْدُ كَمَا يَنْبَغِي لِجَلَالِ وَجْهِكَ وَلِعَظِيمِ سُلْطَانِكَ",
 m:{en:"O my Lord, to You belongs all praise, as befits the majesty of Your Face and the greatness of Your sovereignty.", ur:"اے میرے رب! تمام تعریف تیرے لیے ہے، جیسے تیرے چہرے کے جلال اور تیری عظیم بادشاہی کے لائق ہے۔"},
 use:{en:"Beautiful words of praise.", ur:"حمد کے خوبصورت الفاظ۔"},
 rw:{en:"Narrated: two angels did not know how to record it, so Allah said «write it as My servant said it; I will reward him myself when he meets Me» (Ibn Majah 3801).", ur:"روایت ہے: دو فرشتے نہ جان سکے کہ اسے کیسے لکھیں، تو اللہ نے فرمایا «جیسے میرے بندے نے کہا ویسے لکھو؛ ملاقات کے دن میں خود اسے بدلہ دوں گا» (ابن ماجہ 3801)۔"},
 how:{en:"Fine to say as praise; don’t rely on the specific story.", ur:"حمد کے طور پر کہنا ٹھیک ہے؛ اس خاص قصے پر بھروسہ نہ کریں۔"},
 note:{en:"This hadith is graded weak (Darussalam; al-Albani). The words are sound praise, but the reward story isn’t established.", ur:"یہ حدیث ضعیف ہے (دارالسلام؛ البانیؒ)۔ الفاظ درست حمد ہیں، لیکن اجر والا قصہ ثابت نہیں۔"},
 src:"Sunan Ibn Majah 3801 (weak)", acts:["any"], needs:["grat"], from:"@saifwithyou"},

{id:"comprehensive", kind:"dua", g:"sahih",
 t:{en:"Make the dua that covers everything (taught to ʿAʾishah)", ur:"وہ دعا جو ہر چیز کو سمیٹ لے (حضرت عائشہؓ کو سکھائی گئی)"},
 ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنَ الْخَيْرِ كُلِّهِ، عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، وَأَعُوذُ بِكَ مِنَ الشَّرِّ كُلِّهِ، عَاجِلِهِ وَآجِلِهِ، مَا عَلِمْتُ مِنْهُ وَمَا لَمْ أَعْلَمْ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ عَبْدُكَ وَنَبِيُّكَ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا عَاذَ بِهِ عَبْدُكَ وَنَبِيُّكَ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَعُوذُ بِكَ مِنَ النَّارِ وَمَا قَرَّبَ إِلَيْهَا مِنْ قَوْلٍ أَوْ عَمَلٍ، وَأَسْأَلُكَ أَنْ تَجْعَلَ كُلَّ قَضَاءٍ قَضَيْتَهُ لِي خَيْرًا",
 m:{en:"O Allah, I ask You for all good — now and later — what I know of it and what I don’t; and I seek refuge in You from all evil — now and later — what I know and what I don’t. O Allah, I ask You for the good that Your servant and Prophet asked You for, and seek refuge in You from the evil Your servant and Prophet sought refuge from. O Allah, I ask You for Paradise and every word or deed that brings me near to it, and seek refuge in You from the Fire and every word or deed that brings me near to it. And I ask You to make every decree You decree for me good.", ur:"اے اللہ! میں تجھ سے ہر بھلائی مانگتا ہوں — جلد والی اور دیر والی — جو میں جانتا ہوں اور جو نہیں جانتا؛ اور ہر برائی سے تیری پناہ مانگتا ہوں — جلد والی اور دیر والی — جو جانتا ہوں اور جو نہیں جانتا۔ اے اللہ! میں تجھ سے وہ بھلائی مانگتا ہوں جو تیرے بندے اور نبی ﷺ نے مانگی، اور اس برائی سے پناہ مانگتا ہوں جس سے تیرے بندے اور نبی ﷺ نے پناہ مانگی۔ اے اللہ! میں تجھ سے جنت مانگتا ہوں اور ہر وہ بات یا عمل جو اس کے قریب کرے، اور جہنم سے پناہ مانگتا ہوں اور ہر اس بات یا عمل سے جو اس کے قریب کرے۔ اور تجھ سے مانگتا ہوں کہ میرے لیے ہر فیصلہ خیر بنا دے۔"},
 use:{en:"When you don’t know what to ask — this asks for all of it.", ur:"جب سمجھ نہ آئے کیا مانگیں — یہ سب کچھ مانگ لیتی ہے۔"},
 rw:{en:"The Prophet ﷺ taught it to ʿAʾishah (Ibn Majah 3846 — sahih per al-Albani). Scholars call it one of the most comprehensive duas.", ur:"نبی ﷺ نے یہ عائشہؓ کو سکھائی (ابن ماجہ 3846 — البانیؒ: صحیح)۔ علماء اسے جامع ترین دعاؤں میں شمار کرتے ہیں۔"},
 how:{en:"Any time — great in sujud, after tashahhud, or in the last third of the night.", ur:"کسی بھی وقت — سجدے میں، تشہد کے بعد، یا رات کے آخری تہائی حصے میں بہترین۔"},
 src:"Sunan Ibn Majah 3846", acts:["any","salah"], needs:["answer","jannah"], from:"@bymouadh"},

{id:"muadh_dream", kind:"dua", g:"sahih",
 t:{en:"Make the dua the Prophet ﷺ was taught when he saw his Lord in a dream", ur:"وہ دعا جو نبی ﷺ کو خواب میں اپنے رب کے دیدار پر سکھائی گئی"},
 ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ فِعْلَ الْخَيْرَاتِ، وَتَرْكَ الْمُنْكَرَاتِ، وَحُبَّ الْمَسَاكِينِ، وَأَنْ تَغْفِرَ لِي وَتَرْحَمَنِي، وَإِذَا أَرَدْتَ فِتْنَةَ قَوْمٍ فَتَوَفَّنِي غَيْرَ مَفْتُونٍ، أَسْأَلُكَ حُبَّكَ، وَحُبَّ مَنْ يُحِبُّكَ، وَحُبَّ عَمَلٍ يُقَرِّبُ إِلَى حُبِّكَ",
