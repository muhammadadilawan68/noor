 m:{en:"O Allah, I ask You for doing good deeds, leaving evil ones, and loving the poor; that You forgive me and have mercy on me; and if You intend a trial for a people, take me without being tested. I ask You for Your love, the love of those who love You, and the love of deeds that bring one closer to Your love.", ur:"اے اللہ! میں تجھ سے نیکیوں کے کرنے، برائیوں کے چھوڑنے اور مسکینوں سے محبت کی توفیق مانگتا ہوں؛ اور یہ کہ تو مجھے بخش دے اور مجھ پر رحم کرے؛ اور جب تو کسی قوم کو آزمائش میں ڈالنا چاہے تو مجھے آزمائش سے بچا کر اٹھا لے۔ میں تجھ سے تیری محبت، تجھ سے محبت کرنے والوں کی محبت، اور اس عمل کی محبت مانگتا ہوں جو مجھے تیری محبت کے قریب کر دے۔"},
 use:{en:"Love of Allah, good deeds, safety from fitnah.", ur:"اللہ کی محبت، نیک اعمال، فتنوں سے حفاظت۔"},
 rw:{en:"From the long hadith of Muʿadh: the Prophet ﷺ saw his Lord in the best form (in a dream) and was taught this. He said: «It is true — learn it and teach it» (Tirmidhi 3235 — al-Tirmidhi: hasan sahih; al-Bukhari called it sahih).", ur:"معاذؓ کی طویل حدیث سے: نبی ﷺ نے (خواب میں) اپنے رب کو بہترین صورت میں دیکھا اور یہ دعا سکھائی گئی۔ فرمایا: «یہ حق ہے — اسے سیکھو اور سکھاؤ» (ترمذی 3235 — ترمذیؒ: حسن صحیح؛ بخاریؒ نے صحیح کہا)۔"},
 how:{en:"Any time.", ur:"کسی بھی وقت۔"},
 src:"Jami' at-Tirmidhi 3235", acts:["any"], needs:["guide","forgive"], from:"@idawd_ (Urdu reel — dua shown on screen)"},

{id:"shaddad", kind:"dua", g:"hasan",
 t:{en:"Treasure these words when others treasure gold and silver", ur:"جب لوگ سونا چاندی جمع کریں تو یہ کلمات جمع کریں"},
 ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الثَّبَاتَ فِي الْأَمْرِ، وَالْعَزِيمَةَ عَلَى الرُّشْدِ، وَأَسْأَلُكَ شُكْرَ نِعْمَتِكَ، وَحُسْنَ عِبَادَتِكَ، وَأَسْأَلُكَ قَلْبًا سَلِيمًا، وَلِسَانًا صَادِقًا، وَأَسْأَلُكَ مِنْ خَيْرِ مَا تَعْلَمُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا تَعْلَمُ، وَأَسْتَغْفِرُكَ لِمَا تَعْلَمُ، إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ",
 m:{en:"O Allah, I ask You for steadfastness in the matter, and determination upon right guidance. I ask You for gratitude for Your favours and excellence in worshipping You. I ask You for a sound heart and a truthful tongue. I ask You for the good of what You know, seek refuge in You from the evil of what You know, and seek Your forgiveness for what You know. Indeed You are the Knower of the unseen.", ur:"اے اللہ! میں تجھ سے دین کے معاملے میں ثابت قدمی اور ہدایت پر پختہ ارادہ مانگتا ہوں۔ تیری نعمتوں کا شکر اور تیری اچھی عبادت مانگتا ہوں۔ سلیم دل اور سچی زبان مانگتا ہوں۔ جو کچھ تو جانتا ہے اس کی بھلائی مانگتا ہوں، اس کے شر سے پناہ مانگتا ہوں، اور جو تو جانتا ہے اس کی معافی مانگتا ہوں۔ بے شک تو غیب کا خوب جاننے والا ہے۔"},
 use:{en:"Steadfastness, gratitude, a clean heart and honest tongue — «everything in one».", ur:"ثابت قدمی، شکر، صاف دل اور سچی زبان — «سب کچھ ایک ساتھ»۔"},
 rw:{en:"Shaddad ibn Aws reported: «When people hoard gold and silver, hoard these words» (Musnad Ahmad 17114). The Prophet ﷺ used to say it in his prayer (an-Nasa'i 1304 — hasan).", ur:"شداد بن اوسؓ سے روایت: «جب لوگ سونا چاندی جمع کریں تو تم یہ کلمات جمع کرو» (مسند احمد 17114)۔ نبی ﷺ یہ نماز میں پڑھتے تھے (نسائی 1304 — حسن)۔"},
 how:{en:"In salah after tashahhud, or any time.", ur:"نماز میں تشہد کے بعد، یا کسی بھی وقت۔"},
 note:{en:"«إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ» is in Ahmad’s narration; an-Nasa'i’s ends at «لِمَا تَعْلَمُ».", ur:"«إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ» احمد کی روایت میں ہے؛ نسائی کی روایت «لِمَا تَعْلَمُ» پر ختم ہوتی ہے۔"},
 src:"Sunan an-Nasa'i 1304 · Musnad Ahmad 17114", acts:["salah","any"], needs:["guide","grat"], from:"@official.sheima"}
);

ITEMS.push(
/* ================= SALAH ================= */
{id:"rabbana_lakal", kind:"dhikr", g:"sahih",
 t:{en:"Rising from rukuʿ: add «ḥamdan kathīran ṭayyiban mubārakan fīh»", ur:"رکوع سے اٹھ کر: «حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ» کا اضافہ کریں"},
 ar:"رَبَّنَا وَلَكَ الْحَمْدُ، حَمْدًا كَثِيرًا طَيِّبًا مُبَارَكًا فِيهِ",
 m:{en:"Our Lord, and to You belongs all praise — abundant, pure, blessed praise.", ur:"اے ہمارے رب! تمام تعریف تیرے لیے ہے — بہت زیادہ، پاکیزہ، برکت والی تعریف۔"},
 use:{en:"Turning one moment of every rakʿah into a race of angels.", ur:"ہر رکعت کے ایک لمحے کو فرشتوں کی دوڑ بنا دینا۔"},
 rw:{en:"A man behind the Prophet ﷺ said it after «samiʿAllāhu liman ḥamidah». He ﷺ said: «I saw over thirty angels racing to see which of them would write it first» (Bukhari 799).", ur:"نبی ﷺ کے پیچھے ایک شخص نے «سمع اللہ لمن حمدہ» کے بعد یہ کہا۔ آپ ﷺ نے فرمایا: «میں نے تیس سے زیادہ فرشتے دیکھے جو جلدی کر رہے تھے کہ کون اسے پہلے لکھے» (بخاری 799)۔"},
 how:{en:"Every time you rise from rukuʿ, in all 5 prayers.", ur:"ہر بار رکوع سے اٹھتے وقت، پانچوں نمازوں میں۔"},
 src:"Sahih al-Bukhari 799", acts:["salah"], needs:["reward","grat"], from:"@reflections.by.tahir"},

{id:"between_sajdah", kind:"dua", g:"hasan",
 t:{en:"Between the two sajdahs: don’t rush — ask for these five things", ur:"دو سجدوں کے درمیان: جلدی نہ کریں — یہ پانچ چیزیں مانگیں"},
 ar:"اللَّهُمَّ اغْفِرْ لِي، وَارْحَمْنِي، وَعَافِنِي، وَاهْدِنِي، وَارْزُقْنِي",
 m:{en:"O Allah, forgive me, have mercy on me, grant me well-being, guide me, and provide for me.", ur:"اے اللہ! مجھے بخش دے، مجھ پر رحم فرما، مجھے عافیت دے، مجھے ہدایت دے، اور مجھے رزق دے۔"},
 use:{en:"Forgiveness, mercy, health, guidance and rizq — everything you need, in one short sitting.", ur:"مغفرت، رحمت، صحت، ہدایت اور رزق — ایک مختصر جلسے میں سب کچھ۔"},
 rw:{en:"The Prophet ﷺ said this between the two prostrations (Abu Dawud 850 — hasan per al-Albani). He also said these words «gather for you your dunya and your akhirah» (Muslim 2697).", ur:"نبی ﷺ دو سجدوں کے درمیان یہ پڑھتے تھے (ابوداؤد 850 — البانیؒ: حسن)۔ آپ ﷺ نے فرمایا یہ کلمات «تمہاری دنیا اور آخرت دونوں کو جمع کر دیتے ہیں» (مسلم 2697)۔"},
 how:{en:"In every prayer, sitting between the two sajdahs. Sit still and say it calmly.", ur:"ہر نماز میں، دو سجدوں کے درمیان بیٹھ کر۔ اطمینان سے بیٹھ کر پڑھیں۔"},
 src:"Sunan Abi Dawud 850 · Sahih Muslim 2697", acts:["salah"], needs:["forgive","rizq","heal","guide"], from:"@brother_sulaiman_fariz, @abostani"},

{id:"greatest_b", kind:"dua", g:"sahih",
 t:{en:"After tashahhud, call Allah by His Greatest Name (Al-Ḥayy al-Qayyūm)", ur:"تشہد کے بعد اللہ کو اسمِ اعظم (الحی القیوم) سے پکاریں"},
 ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ بِأَنَّ لَكَ الْحَمْدَ، لَا إِلَٰهَ إِلَّا أَنْتَ الْمَنَّانُ، بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ، يَا ذَا الْجَلَالِ وَالْإِكْرَامِ، يَا حَيُّ يَا قَيُّومُ",
 m:{en:"O Allah, I ask You, for all praise is Yours; there is no god but You, the Bestower, Originator of the heavens and the earth. O Lord of Majesty and Honour, O Ever-Living, O Sustainer.", ur:"اے اللہ! میں تجھ سے مانگتا ہوں، کیونکہ تمام تعریف تیرے لیے ہے؛ تیرے سوا کوئی معبود نہیں، بہت احسان کرنے والا، آسمانوں اور زمین کو بے مثال پیدا کرنے والا۔ اے جلال اور عزت والے! اے ہمیشہ زندہ! اے سب کو قائم رکھنے والے!"},
 use:{en:"Opening your dua with Allah’s Greatest Name — then ask for what you need.", ur:"اپنی دعا اسمِ اعظم سے شروع کریں — پھر اپنی حاجت مانگیں۔"},
 rw:{en:"A man prayed, recited the tashahhud and said this. The Prophet ﷺ said: «By the One in whose hand my soul is, he has called upon Allah by His Great Name — when called by it He answers, and when asked by it He gives» (an-Nasa'i 1300, Abu Dawud 1495 — sahih).", ur:"ایک شخص نے نماز پڑھی، تشہد پڑھا اور یہ کہا۔ نبی ﷺ نے فرمایا: «اس ذات کی قسم جس کے ہاتھ میں میری جان ہے، اس نے اللہ کو اس کے عظیم نام سے پکارا — جب اس سے پکارا جائے تو وہ جواب دیتا ہے، اور جب اس سے مانگا جائے تو عطا کرتا ہے» (نسائی 1300، ابوداؤد 1495 — صحیح)۔"},
 how:{en:"After the final tashahhud and salawat, before salam. Then add your own request.", ur:"آخری تشہد اور درود کے بعد، سلام سے پہلے۔ پھر اپنی دعا مانگیں۔"},
 src:"Sunan an-Nasa'i 1300 · Sunan Abi Dawud 1495", acts:["salah"], needs:["answer"], from:"@bobireality"},

{id:"greatest_a", kind:"dua", g:"sahih",
 t:{en:"Ask Allah by His Oneness — the other «Greatest Name» dua", ur:"اللہ کی وحدانیت کے واسطے سے مانگیں — اسمِ اعظم والی دوسری دعا"},
 ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ أَنِّي أَشْهَدُ أَنَّكَ أَنْتَ اللَّهُ، لَا إِلَٰهَ إِلَّا أَنْتَ، الْأَحَدُ الصَّمَدُ، الَّذِي لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ",
 m:{en:"O Allah, I ask You, as I bear witness that You are Allah, there is no god but You, the One, the Self-Sufficient, who neither begets nor was begotten, and there is none equal to Him.", ur:"اے اللہ! میں تجھ سے مانگتا ہوں، اس گواہی کے ساتھ کہ تو ہی اللہ ہے، تیرے سوا کوئی معبود نہیں، اکیلا، بے نیاز، جس نے نہ کسی کو جنا نہ وہ جنا گیا، اور کوئی اس کا ہمسر نہیں۔"},
 use:{en:"Getting duas answered — for deen or dunya.", ur:"دعا کی قبولیت — دین کی ہو یا دنیا کی۔"},
 rw:{en:"The Prophet ﷺ heard a man say this and said: «He has asked Allah by the Name which, when asked by it He gives, and when called by it He answers» (Abu Dawud 1493 — sahih; Ibn Hajar called it the strongest narration on the Greatest Name).", ur:"نبی ﷺ نے ایک شخص کو یہ کہتے سنا تو فرمایا: «اس نے اللہ سے اس نام کے ذریعے مانگا کہ جب اس سے مانگا جائے تو وہ دیتا ہے، اور جب پکارا جائے تو جواب دیتا ہے» (ابوداؤد 1493 — صحیح؛ ابن حجرؒ نے اسے اسمِ اعظم کی سب سے مضبوط روایت کہا)۔"},
 how:{en:"Before asking for anything — in salah or any time.", ur:"کچھ بھی مانگنے سے پہلے — نماز میں یا کسی بھی وقت۔"},
 src:"Sunan Abi Dawud 1493 · Jami' at-Tirmidhi 3475", acts:["salah","any"], needs:["answer"], from:"@moen.bobak (Urdu reel)"},

/* ================= AFTER SALAH ================= */
{id:"after_istighfar", kind:"dhikr", g:"sahih",
 t:{en:"Right after salam: «Astaghfirullāh» ×3, then «Allāhumma antas-salām…»", ur:"سلام پھیرتے ہی: تین بار «استغفر اللہ»، پھر «اللّٰہم انت السلام…»"},
 ar:"أَسْتَغْفِرُ اللَّهَ (×٣)\nاللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ ذَا الْجَلَالِ وَالْإِكْرَامِ",
 m:{en:"I seek Allah’s forgiveness (3×). O Allah, You are Peace and from You comes peace. Blessed are You, Possessor of Majesty and Honour.", ur:"میں اللہ سے مغفرت مانگتا ہوں (تین بار)۔ اے اللہ! تو سلامتی والا ہے اور تجھ ہی سے سلامتی ہے۔ تو بابرکت ہے، اے جلال اور عزت والے!"},
 use:{en:"Patching any shortcomings in your prayer.", ur:"نماز کی کوتاہیوں کی تلافی۔"},
 rw:{en:"The Prophet ﷺ did this after finishing every prayer (Muslim 591).", ur:"نبی ﷺ ہر نماز کے بعد یہی کرتے تھے (مسلم 591)۔"},
 note:{en:"Muslim 591 says he «sought forgiveness three times»; the narrator al-Awzaʿi explained it as saying «Astaghfirullāh, Astaghfirullāh…». The Arabic is exactly as in Muslim 591 («tabārakta dhal-jalāl…»); some other narrations say «yā dhal-jalāl».", ur:"مسلم 591 میں ہے کہ آپ ﷺ نے «تین بار استغفار کیا»؛ راوی اوزاعیؒ نے بتایا کہ «استغفر اللہ، استغفر اللہ…» کہتے۔ عربی بالکل مسلم 591 کے مطابق ہے («تَبَارَكْتَ ذَا الْجَلَالِ…»)؛ بعض دیگر روایات میں «يَا ذَا الْجَلَالِ» ہے۔"},
 how:{en:"Immediately after salam in all 5 prayers.", ur:"پانچوں نمازوں میں سلام کے فوراً بعد۔"},
 src:"Sahih Muslim 591", acts:["after"], needs:["forgive"], from:"@brother_sulaiman_fariz"},

{id:"after_tasbih", kind:"dhikr", g:"sahih",
 t:{en:"After salah: 33 · 33 · 33 + the 100th", ur:"نماز کے بعد: 33 · 33 · 33 + سوواں کلمہ"},
 ar:"سُبْحَانَ اللَّهِ (٣٣) — الْحَمْدُ لِلَّهِ (٣٣) — اللَّهُ أَكْبَرُ (٣٣)\nلَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
 m:{en:"Glory be to Allah (33), all praise is for Allah (33), Allah is the Greatest (33). Then: There is no god but Allah, alone, without partner; His is the dominion and His is the praise, and He has power over all things.", ur:"سبحان اللہ (33)، الحمد للہ (33)، اللہ اکبر (33)۔ پھر: اللہ کے سوا کوئی معبود نہیں، اکیلا ہے، کوئی شریک نہیں؛ بادشاہی اور تعریف اسی کی ہے، اور وہ ہر چیز پر قادر ہے۔"},
 use:{en:"The sin-erasing routine after every prayer.", ur:"ہر نماز کے بعد گناہ مٹانے والا معمول۔"},
 rw:{en:"«His sins will be forgiven even if they are like the foam of the sea» (Muslim 597).", ur:"«اس کے گناہ معاف کر دیے جائیں گے چاہے سمندر کی جھاگ کے برابر ہوں» (مسلم 597)۔"},
 how:{en:"After each of the 5 prayers. Use the counter — it walks you through all 100.", ur:"پانچوں نمازوں کے بعد۔ کاؤنٹر استعمال کریں — یہ پورے 100 تک لے جائے گا۔"},
 src:"Sahih Muslim 597", acts:["after"], needs:["forgive","reward"],
 seq:[{ar:"سُبْحَانَ اللَّهِ",n:33},{ar:"الْحَمْدُ لِلَّهِ",n:33},{ar:"اللَّهُ أَكْبَرُ",n:33},{ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",n:1}], from:"@brother_sulaiman_fariz"},

{id:"muadh_aini", kind:"dua", g:"sahih",
 t:{en:"Never leave this dua at the end of any prayer (the Prophet’s gift to Muʿadh)", ur:"کسی نماز کے آخر میں یہ دعا نہ چھوڑیں (معاذؓ کو نبی ﷺ کا تحفہ)"},
 ar:"اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ، وَشُكْرِكَ، وَحُسْنِ عِبَادَتِكَ",
 m:{en:"O Allah, help me to remember You, to thank You, and to worship You well.", ur:"اے اللہ! اپنے ذکر، اپنے شکر اور اپنی اچھی عبادت پر میری مدد فرما۔"},
 use:{en:"When you keep promising to change and falling back — ask Him for the strength.", ur:"جب بار بار بدلنے کا وعدہ کر کے پھر پھسل جائیں — اسی سے طاقت مانگیں۔"},
 rw:{en:"The Prophet ﷺ took Muʿadh’s hand and said: «O Muʿadh, by Allah I love you… do not leave saying this at the end of every prayer» (Abu Dawud 1522 — sahih per al-Albani).", ur:"نبی ﷺ نے معاذؓ کا ہاتھ پکڑ کر فرمایا: «اے معاذ! اللہ کی قسم میں تم سے محبت کرتا ہوں… ہر نماز کے آخر میں یہ کہنا نہ چھوڑنا» (ابوداؤد 1522 — البانیؒ: صحیح)۔"},
 how:{en:"At the end of every prayer (before or after salam — scholars mention both).", ur:"ہر نماز کے آخر میں (سلام سے پہلے یا بعد — علماء نے دونوں ذکر کیے ہیں)۔"},
 src:"Sunan Abi Dawud 1522", acts:["after"], needs:["guide"], from:"@dailyduaremindershq, @brother_sulaiman_fariz"},

{id:"stay_seated", kind:"action", g:"sahih",
 t:{en:"Don’t rush off after salah — stay in your place a little (Shaytan’s trap is the phone)", ur:"نماز کے بعد فوراً نہ اٹھیں — کچھ دیر اپنی جگہ بیٹھیں (شیطان کا جال: فون)"},
 ar:null,
 m:{en:"", ur:""},
 use:{en:"Beating Shaytan’s trick of pulling you straight to your phone and losing the after-prayer adhkar.", ur:"شیطان کی اس چال کو ناکام بنانا کہ آپ فوراً فون اٹھا لیں اور نماز کے بعد کے اذکار رہ جائیں۔"},
 rw:{en:"«The angels keep praying for one of you as long as he stays in the place where he prayed: ‘O Allah, forgive him; O Allah, have mercy on him’» (Bukhari 445).", ur:"«فرشتے تم میں سے ہر ایک کے لیے دعا کرتے رہتے ہیں جب تک وہ اپنی نماز کی جگہ بیٹھا رہے: ’اے اللہ! اسے بخش دے، اے اللہ! اس پر رحم فرما‘» (بخاری 445)۔"},
 how:{en:"Finish the after-salah adhkar before touching your phone.", ur:"فون اٹھانے سے پہلے نماز کے بعد کے اذکار مکمل کریں۔"},
 src:"Sahih al-Bukhari 445", acts:["after"], needs:["forgive"], from:"@brother_sulaiman_fariz"},

{id:"qini", kind:"dua", g:"sahih",
 t:{en:"Ask to be saved from punishment on the Day of Resurrection (at bedtime, after salah)", ur:"قیامت کے دن کے عذاب سے بچاؤ کی دعا (سوتے وقت، نماز کے بعد)"},
 ar:"اللَّهُمَّ قِنِي عَذَابَكَ يَوْمَ تَبْعَثُ عِبَادَكَ",
 m:{en:"O Allah, protect me from Your punishment on the Day You resurrect Your servants.", ur:"اے اللہ! مجھے اپنے عذاب سے بچا جس دن تو اپنے بندوں کو اٹھائے گا۔"},
 use:{en:"Safety on the Day of Judgement.", ur:"قیامت کے دن حفاظت۔"},
 rw:{en:"When going to sleep, the Prophet ﷺ placed his right hand under his cheek and said this (Abu Dawud 5045 — al-Albani: sahih, except the words «three times»). After prayer, when he turned to face people, he said «Rabbi qinī ʿadhābaka…» (Muslim 709).", ur:"سوتے وقت نبی ﷺ داہنا ہاتھ رخسار کے نیچے رکھتے اور یہ کہتے (ابوداؤد 5045 — البانیؒ: صحیح، سوائے «تین بار» کے الفاظ کے)۔ نماز کے بعد لوگوں کی طرف رخ کرتے تو «رَبِّ قِنِي عَذَابَكَ…» کہتے (مسلم 709)۔"},
 how:{en:"In bed on your right side, right hand under your cheek. Saying it once follows the authentic part; the «3 times» in the reels is from the part al-Albani did not authenticate.", ur:"بستر پر داہنی کروٹ، داہنا ہاتھ رخسار کے نیچے۔ ایک بار کہنا مستند حصے کے مطابق ہے؛ ریلز والا «تین بار» اس حصے سے ہے جسے البانیؒ نے صحیح نہیں کہا۔"},
 note:{en:"One reel shows «Allāhumma iḥfaẓnī min ʿadhābik». The authentic wording is «qinī» (قِنِي), as above.", ur:"ایک ریل میں «اللّٰہم احفظنی من عذابک» ہے۔ مستند الفاظ «قِنِي» ہیں، جیسا اوپر۔"},
 src:"Sunan Abi Dawud 5045 · Jami' at-Tirmidhi 3398 · Sahih Muslim 709", acts:["sleep","after"], needs:["jannah"], from:"@farhatbashir04, WhatsApp video (@xeshaanstudio), @danielle_best_"},

/* ================= SLEEP ================= */
{id:"witr", kind:"action", g:"sahih",
 t:{en:"Pray Witr before you sleep — even one rakʿah", ur:"سونے سے پہلے وتر پڑھیں — چاہے ایک رکعت"},
 ar:null, m:{en:"",ur:""},
 use:{en:"Never ending a day without Witr.", ur:"کوئی دن وتر کے بغیر ختم نہ ہو۔"},
 rw:{en:"Abu Hurayrah: «My close friend ﷺ advised me… to pray Witr before sleeping» (Bukhari 1981). «Allah is Witr (One) and loves Witr» (Muslim 2677).", ur:"ابو ہریرہؓ: «میرے خلیل ﷺ نے مجھے وصیت کی… کہ سونے سے پہلے وتر پڑھوں» (بخاری 1981)۔ «اللہ وتر (طاق) ہے اور وتر کو پسند کرتا ہے» (مسلم 2677)۔"},
 how:{en:"After Isha, before bed (or in the last part of the night if you are sure you’ll wake).", ur:"عشاء کے بعد، سونے سے پہلے (یا اگر جاگنے کا یقین ہو تو رات کے آخری حصے میں)۔"},
 src:"Sahih al-Bukhari 1981 · Sahih Muslim 2677", acts:["sleep"], needs:["reward"], from:"@aboo.yahyaa"},

{id:"wudu_sleep", kind:"action", g:"sahih",
 t:{en:"Go to sleep with wudu", ur:"باوضو سوئیں"},
 ar:null, m:{en:"",ur:""},
 use:{en:"An angel prays for you all night.", ur:"ساری رات ایک فرشتہ آپ کے لیے دعا کرتا ہے۔"},
 rw:{en:"«Whoever sleeps in a state of purity, an angel stays with him; whenever he wakes, the angel says: ‘O Allah, forgive Your servant, for he slept pure’» (Ibn Hibban 1051 — graded sahih by Ibn Hibban; some critics weakened one narrator). The Prophet ﷺ also told al-Baraʾ: «When you go to bed, make wudu as for prayer» (Bukhari 247).", ur:"«جو پاکیزگی کی حالت میں سوئے، ایک فرشتہ اس کے ساتھ رہتا ہے؛ جب بھی وہ جاگے، فرشتہ کہتا ہے: ’اے اللہ! اپنے بندے کو بخش دے، یہ پاک ہو کر سویا تھا‘» (ابن حبان 1051 — ابن حبانؒ نے صحیح کہا؛ بعض ناقدین نے ایک راوی کو کمزور کہا)۔ نبی ﷺ نے براءؓ سے فرمایا: «جب بستر پر جاؤ تو نماز جیسا وضو کرو» (بخاری 247)۔"},
 how:{en:"Make wudu right before bed.", ur:"سونے سے بالکل پہلے وضو کریں۔"},
 src:"Sahih Ibn Hibban 1051 · Sahih al-Bukhari 247", acts:["sleep"], needs:["forgive"], from:"@aboo.yahyaa"},

{id:"bed_foam", kind:"dhikr", g:"sahih",
 t:{en:"In bed: the dhikr that erases sins «like the foam of the sea»", ur:"بستر پر: وہ ذکر جو «سمندر کی جھاگ» جتنے گناہ مٹا دے"},
 ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ، سُبْحَانَ اللَّهِ، وَالْحَمْدُ لِلَّهِ، وَلَا إِلَٰهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ",
 m:{en:"There is no god but Allah, alone, without partner; His is the dominion and His is the praise, and He has power over all things. There is no might nor power except with Allah. Glory be to Allah, all praise is for Allah, there is no god but Allah, and Allah is the Greatest.", ur:"اللہ کے سوا کوئی معبود نہیں، اکیلا ہے، کوئی شریک نہیں؛ بادشاہی اور تعریف اسی کی ہے اور وہ ہر چیز پر قادر ہے۔ اللہ کے سوا نہ کوئی طاقت ہے نہ قوت۔ اللہ پاک ہے، سب تعریف اللہ کے لیے، اللہ کے سوا کوئی معبود نہیں، اور اللہ سب سے بڑا ہے۔"},
 use:{en:"Going to sleep forgiven.", ur:"بخشش کے ساتھ سونا۔"},
 rw:{en:"«Whoever says when he goes to bed: … his sins are forgiven, even if they are like the foam of the sea» (Ibn Hibban 5528 — sahih per al-Albani, Sahih at-Targhib 607, and Shuʿayb al-Arnaʾut).", ur:"«جو بستر پر جاتے وقت یہ کہے… اس کے گناہ معاف کر دیے جاتے ہیں چاہے سمندر کی جھاگ کے برابر ہوں» (ابن حبان 5528 — البانیؒ: صحیح، صحیح الترغیب 607، اور شعیب ارناؤوطؒ)۔"},
 how:{en:"Once, when you lie down to sleep.", ur:"ایک بار، جب سونے کے لیے لیٹیں۔"},
 note:{en:"One reel says «say each part 3 times». The hadith mentions saying it once at bedtime.", ur:"ایک ریل میں «ہر حصہ تین بار» کہا گیا۔ حدیث میں سوتے وقت ایک بار کہنا مذکور ہے۔"},
 src:"Sahih Ibn Hibban 5528 · Sahih at-Targhib 607", acts:["sleep"], needs:["forgive"], from:"@the_scottish_beard, @aboo.yahyaa"},

/* ================= NIGHT ================= */
{id:"wake_night", kind:"dhikr", g:"sahih",
 t:{en:"If you wake up at night — before you touch your phone — say this, then ask", ur:"رات کو آنکھ کھلے — فون چھونے سے پہلے — یہ کہیں، پھر مانگیں"},
 ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، الْحَمْدُ لِلَّهِ، وَسُبْحَانَ اللَّهِ، وَلَا إِلَٰهَ إِلَّا اللَّهُ، وَاللَّهُ أَكْبَرُ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
 ar2:"اللَّهُمَّ اغْفِرْ لِي", ar2l:{en:"Then say (or ask for anything):", ur:"پھر کہیں (یا کچھ بھی مانگیں):"},
 m:{en:"There is no god but Allah, alone, without partner; His is the dominion and His is the praise, and He has power over all things. All praise is for Allah, glory be to Allah, there is no god but Allah, Allah is the Greatest, and there is no might nor power except with Allah. — Then: O Allah, forgive me.", ur:"اللہ کے سوا کوئی معبود نہیں، اکیلا ہے، کوئی شریک نہیں؛ بادشاہی اور تعریف اسی کی ہے اور وہ ہر چیز پر قادر ہے۔ سب تعریف اللہ کے لیے، اللہ پاک ہے، اللہ کے سوا کوئی معبود نہیں، اللہ سب سے بڑا ہے، اور اللہ کے سوا نہ طاقت ہے نہ قوت۔ — پھر: اے اللہ! مجھے بخش دے۔"},
 use:{en:"«The blank cheque» — a dua that gets answered.", ur:"«بلینک چیک» — وہ دعا جو قبول ہوتی ہے۔"},
 rw:{en:"«Whoever wakes at night and says [this], then says ‘O Allah, forgive me’ or makes a dua, it is answered; and if he makes wudu and prays, his prayer is accepted» (Bukhari 1154).", ur:"«جو رات کو جاگے اور یہ کہے، پھر ’اے اللہ مجھے بخش دے‘ کہے یا کوئی دعا کرے تو قبول ہوتی ہے؛ اور اگر وضو کر کے نماز پڑھے تو نماز قبول ہوتی ہے» (بخاری 1154)۔"},
 how:{en:"Whenever you wake during the night — first thing.", ur:"رات میں جب بھی آنکھ کھلے — سب سے پہلے۔"},
 src:"Sahih al-Bukhari 1154", acts:["wake"], needs:["answer","forgive"], from:"@niiirjon, @muslims_reminder12"},

/* ================= PEOPLE / OUT ================= */
{id:"market", kind:"dhikr", g:"disputed",
 t:{en:"Entering a market, mall or shop — say this", ur:"بازار، مال یا دکان میں داخل ہوتے وقت یہ کہیں"},
 ar:"لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ، وَهُوَ حَيٌّ لَا يَمُوتُ، بِيَدِهِ الْخَيْرُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
 m:{en:"There is no god but Allah, alone, without partner. His is the dominion and His is the praise. He gives life and causes death, and He is Ever-Living and never dies. In His hand is all good, and He has power over all things.", ur:"اللہ کے سوا کوئی معبود نہیں، اکیلا ہے، کوئی شریک نہیں۔ بادشاہی اسی کی ہے اور تعریف اسی کی۔ وہی زندہ کرتا ہے اور مارتا ہے، اور وہ ہمیشہ زندہ ہے، کبھی نہیں مرے گا۔ تمام بھلائی اسی کے ہاتھ میں ہے اور وہ ہر چیز پر قادر ہے۔"},
 use:{en:"Remembering Allah where people are most distracted.", ur:"وہاں اللہ کو یاد کرنا جہاں لوگ سب سے زیادہ غافل ہوں۔"},
 rw:{en:"Allah writes a million good deeds, erases a million sins, raises a million ranks (and builds a house in Paradise) (Tirmidhi 3428/3429 — hasan per al-Albani).", ur:"اللہ دس لاکھ نیکیاں لکھتا ہے، دس لاکھ گناہ مٹاتا ہے، دس لاکھ درجے بلند کرتا ہے (اور جنت میں گھر بناتا ہے) (ترمذی 3428/3429 — البانیؒ: حسن)۔"},
 how:{en:"Each time you enter a market, mall or shop.", ur:"ہر بار بازار، مال یا دکان میں داخل ہوتے وقت۔"},
 note:{en:"Grading differs: sunnah.com shows Tirmidhi 3428 as daʿif (Darussalam); al-Albani graded the hadith hasan through its other chains (3429).", ur:"درجے میں اختلاف: sunnah.com پر ترمذی 3428 دارالسلام کے مطابق ضعیف ہے؛ البانیؒ نے دوسری سندوں (3429) کی بنا پر حسن کہا۔"},
 src:"Jami' at-Tirmidhi 3428, 3429 · Ibn Majah 2235", acts:["out"], needs:["reward"], from:"@anshida.azeez"},

{id:"love_allah", kind:"action", g:"hasan",
 t:{en:"Tell a brother or sister «I love you for the sake of Allah»", ur:"کسی بھائی یا بہن سے کہیں «میں تم سے اللہ کے لیے محبت کرتا ہوں»"},
 ar:"إِنِّي أُحِبُّكَ فِي اللَّهِ",
 ar2:"أَحَبَّكَ الَّذِي أَحْبَبْتَنِي لَهُ", ar2l:{en:"Their reply:", ur:"جواب:"},
 m:{en:"I love you for the sake of Allah. — Reply: May the One for whose sake you love me, love you.", ur:"میں تم سے اللہ کی خاطر محبت کرتا ہوں۔ — جواب: وہ ذات تم سے محبت کرے جس کی خاطر تم نے مجھ سے محبت کی۔"},
 use:{en:"A bond the Prophets will envy on the Day of Judgement.", ur:"ایسا رشتہ جس پر قیامت کے دن انبیاء بھی رشک کریں گے۔"},
 rw:{en:"A man said he loved another; the Prophet ﷺ said «Tell him» (Abu Dawud 5125). Allah says: «Those who love each other for My glory will have pulpits of light that the Prophets and martyrs will envy» (Tirmidhi 2390 — hasan sahih). Two who love each other for Allah are among the seven shaded on the Day with no shade but His (Bukhari 660).", ur:"ایک شخص نے کہا وہ کسی سے محبت کرتا ہے؛ نبی ﷺ نے فرمایا: «اسے بتا دو» (ابوداؤد 5125)۔ اللہ فرماتا ہے: «میری عظمت کی خاطر آپس میں محبت کرنے والوں کے لیے نور کے منبر ہوں گے جن پر انبیاء اور شہداء رشک کریں گے» (ترمذی 2390)۔ اللہ کے لیے محبت کرنے والے دو افراد ان سات میں ہیں جو عرش کے سائے میں ہوں گے (بخاری 660)۔"},
 how:{en:"Send that message today to someone you love for Allah.", ur:"آج ہی کسی کو یہ پیغام بھیجیں جس سے آپ اللہ کے لیے محبت کرتے ہیں۔"},
 src:"Sunan Abi Dawud 5125 · Jami' at-Tirmidhi 2390 · Sahih al-Bukhari 660", acts:["people"], needs:["reward","family"], from:"@youssefbaleeghcoach"},

/* ================= SALAWAT ================= */
{id:"salawat", kind:"dhikr", g:"sahih",
 t:{en:"Send salawat on the Prophet ﷺ (Durood Ibrahimi)", ur:"نبی ﷺ پر درود بھیجیں (درودِ ابراہیمی)"},
 ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ",
 m:{en:"O Allah, send prayers upon Muhammad and the family of Muhammad, as You sent prayers upon Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious. O Allah, bless Muhammad and the family of Muhammad, as You blessed Ibrahim and the family of Ibrahim; You are Praiseworthy, Glorious.", ur:"اے اللہ! محمد ﷺ اور آلِ محمد پر رحمت نازل فرما، جیسے تو نے ابراہیمؑ اور آلِ ابراہیم پر رحمت نازل فرمائی؛ بے شک تو تعریف والا، بزرگی والا ہے۔ اے اللہ! محمد ﷺ اور آلِ محمد پر برکت نازل فرما، جیسے تو نے ابراہیمؑ اور آلِ ابراہیم پر برکت نازل فرمائی؛ بے شک تو تعریف والا، بزرگی والا ہے۔"},
 use:{en:"Love for the Prophet ﷺ — and Allah’s blessings on you.", ur:"نبی ﷺ سے محبت — اور آپ پر اللہ کی رحمتیں۔"},
 rw:{en:"«Whoever sends one salah upon me, Allah sends ten upon him» (Muslim 408). This is the wording the Prophet ﷺ taught when asked how to send salawat (Bukhari 3370).", ur:"«جو مجھ پر ایک بار درود بھیجے، اللہ اس پر دس رحمتیں بھیجتا ہے» (مسلم 408)۔ یہ وہ الفاظ ہیں جو نبی ﷺ نے درود کا طریقہ پوچھنے پر سکھائے (بخاری 3370)۔"},
 how:{en:"In every tashahhud, after every Adhan, and as often as you can — especially on Friday.", ur:"ہر تشہد میں، ہر اذان کے بعد، اور جتنی بار ہو سکے — خاص طور پر جمعہ کو۔"},
 note:{en:"A reel promotes a different salawat («…an-nabiyyi wa azwājihi ummahātil-muʾminīn…», Abu Dawud 982) claiming you’ll see the Prophet ﷺ in dreams, die Muslim and be guaranteed Jannah. That narration is graded weak by al-Albani, and those specific promises are not in it. The Durood Ibrahimi above is from Sahih al-Bukhari.", ur:"ایک ریل میں ایک اور درود («…النَّبِيِّ وَأَزْوَاجِهِ أُمَّهَاتِ الْمُؤْمِنِينَ…»، ابوداؤد 982) کے بارے میں کہا گیا کہ اس سے نبی ﷺ کی خواب میں زیارت، ایمان پر موت اور جنت کی ضمانت ہے۔ وہ روایت البانیؒ کے نزدیک ضعیف ہے اور یہ وعدے اس میں نہیں ہیں۔ اوپر والا درودِ ابراہیمی صحیح بخاری سے ہے۔"},
 src:"Sahih al-Bukhari 3370 · Sahih Muslim 408", acts:["any","salah","adhan"], needs:["reward","answer"], cnt:10, from:"@nafees__l, @farhatbashir04"},

/* ================= JANNAH ================= */
{id:"la_tukhzina", kind:"quran", g:"quran",
 t:{en:"Ask Allah not to disgrace you on the Day of Judgement", ur:"اللہ سے قیامت کے دن رسوائی سے بچنے کی دعا"},
 ar:"رَبَّنَا وَآتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ الْقِيَامَةِ ۗ إِنَّكَ لَا تُخْلِفُ الْمِيعَادَ",
 m:{en:"Our Lord, grant us what You promised us through Your messengers, and do not disgrace us on the Day of Resurrection. Indeed, You never break Your promise.", ur:"اے ہمارے رب! ہمیں وہ عطا فرما جس کا تو نے اپنے رسولوں کے ذریعے وعدہ کیا، اور قیامت کے دن ہمیں رسوا نہ کر۔ بے شک تو وعدہ خلافی نہیں کرتا۔"},
 use:{en:"Protection from public humiliation when everything is exposed.", ur:"اُس دن سرِعام رسوائی سے حفاظت جب سب کچھ کھل جائے گا۔"},
 rw:{en:"The dua of «those of understanding» (3:190–194). Allah responded: «I will not let the deed of any doer among you be lost» (3:195).", ur:"«عقل والوں» کی دعا (آل عمران 3:190–194)۔ اللہ نے جواب دیا: «میں تم میں سے کسی عمل کرنے والے کا عمل ضائع نہیں کروں گا» (3:195)۔"},
 how:{en:"Any time — and make it for the whole Ummah too.", ur:"کسی بھی وقت — اور پوری امت کے لیے بھی مانگیں۔"},
 src:"Qur'an 3:194–195", acts:["any"], needs:["jannah"], from:"@deentourr"},

{id:"jannah3", kind:"dua", g:"sahih",
 t:{en:"Ask for Jannah 3 times and refuge from the Fire 3 times — they will speak for you", ur:"تین بار جنت مانگیں اور تین بار جہنم سے پناہ — وہ آپ کے لیے دعا کریں گی"},
 ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ (×٣)\nاللَّهُمَّ أَجِرْنِي مِنَ النَّارِ (×٣)",
 m:{en:"O Allah, I ask You for Paradise (3×). O Allah, save me from the Fire (3×).", ur:"اے اللہ! میں تجھ سے جنت مانگتا ہوں (تین بار)۔ اے اللہ! مجھے جہنم سے بچا (تین بار)۔"},
 use:{en:"Making Jannah itself pray for you.", ur:"جنت خود آپ کے لیے دعا کرے۔"},
 rw:{en:"«Whoever asks Allah for Paradise three times, Paradise says: ‘O Allah, admit him into Paradise.’ Whoever seeks refuge from the Fire three times, the Fire says: ‘O Allah, save him from the Fire’» (Tirmidhi 2572 — sahih per al-Albani).", ur:"«جو تین بار اللہ سے جنت مانگے، جنت کہتی ہے: ’اے اللہ! اسے جنت میں داخل کر دے۔‘ اور جو تین بار جہنم سے پناہ مانگے، جہنم کہتی ہے: ’اے اللہ! اسے جہنم سے بچا لے‘» (ترمذی 2572 — البانیؒ: صحیح)۔"},
 how:{en:"3 + 3, any time — easy to add after every prayer.", ur:"تین + تین، کسی بھی وقت — ہر نماز کے بعد آسانی سے۔"},
 note:{en:"The hadith says «whoever asks Allah for Paradise three times»; the Arabic above is a simple way of asking, not a wording quoted from the hadith.", ur:"حدیث میں ہے «جو تین بار اللہ سے جنت مانگے»؛ اوپر کی عربی مانگنے کا سادہ طریقہ ہے، حدیث کے الفاظ نہیں۔"},
 src:"Jami' at-Tirmidhi 2572", acts:["any","after"], needs:["jannah"], cnt:3, from:"@samer_speaks"},

{id:"firdaws", kind:"dua", g:"sahih",
 t:{en:"Aim high: ask for Al-Firdaws, the highest Jannah", ur:"بلند ہمت رکھیں: سب سے اونچی جنت، الفردوس مانگیں"},
 ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ الْفِرْدَوْسَ الْأَعْلَى مِنَ الْجَنَّةِ",
 m:{en:"O Allah, I ask You for Al-Firdaws, the highest level of Paradise.", ur:"اے اللہ! میں تجھ سے جنت کا سب سے اونچا درجہ، الفردوس مانگتا ہوں۔"},
 use:{en:"Not settling for the lowest level.", ur:"سب سے نچلے درجے پر قناعت نہ کرنا۔"},
 rw:{en:"«When you ask Allah, ask Him for Al-Firdaws; it is the middle and highest part of Paradise, above it is the Throne of the Most Merciful, and from it the rivers of Paradise flow» (Bukhari 2790, 7423).", ur:"«جب اللہ سے مانگو تو الفردوس مانگو؛ وہ جنت کا درمیانی اور سب سے اونچا حصہ ہے، اس کے اوپر رحمٰن کا عرش ہے، اور اسی سے جنت کی نہریں نکلتی ہیں» (بخاری 2790، 7423)۔"},
 how:{en:"Often — in sujud, after salah.", ur:"کثرت سے — سجدے میں، نماز کے بعد۔"},
 note:{en:"The command to ask for Firdaws is from Bukhari; this exact wording is a natural way of doing so.", ur:"فردوس مانگنے کا حکم بخاری سے ہے؛ یہ الفاظ اس کا فطری طریقہ ہیں۔"},
 src:"Sahih al-Bukhari 2790, 7423", acts:["any","salah"], needs:["jannah"], from:"@youssefbaleeghcoach"},

{id:"ammar", kind:"dua", g:"sahih",
 t:{en:"Ask for the joy of looking at Allah’s Face — greater than Jannah itself", ur:"اللہ کے دیدار کی لذت مانگیں — جو جنت سے بھی بڑی نعمت ہے"},
 ar:"وَأَسْأَلُكَ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ، وَالشَّوْقَ إِلَى لِقَائِكَ، فِي غَيْرِ ضَرَّاءَ مُضِرَّةٍ، وَلَا فِتْنَةٍ مُضِلَّةٍ",
 m:{en:"And I ask You for the delight of looking at Your Face and the longing to meet You, without any harmful hardship or misleading trial.", ur:"اور میں تجھ سے تیرے چہرے کو دیکھنے کی لذت اور تجھ سے ملاقات کا شوق مانگتا ہوں، بغیر کسی نقصان دہ تکلیف اور گمراہ کن فتنے کے۔"},
 use:{en:"Longing for the greatest reward of all.", ur:"سب سے بڑے انعام کی آرزو۔"},
 rw:{en:"Part of a dua the Prophet ﷺ made in his prayer (an-Nasa'i 1305 — hasan per Darussalam; sahih per al-Albani). Seeing Allah will be dearer to the people of Paradise than anything they were given (Muslim 181).", ur:"اس دعا کا حصہ جو نبی ﷺ نماز میں کرتے تھے (نسائی 1305 — دارالسلام: حسن؛ البانیؒ: صحیح)۔ اہلِ جنت کو اللہ کا دیدار ہر نعمت سے زیادہ محبوب ہوگا (مسلم 181)۔"},
 how:{en:"In salah after tashahhud, or any time. You can begin with «Allāhumma innī» (اللَّهُمَّ إِنِّي).", ur:"نماز میں تشہد کے بعد، یا کسی بھی وقت۔ «اللَّهُمَّ إِنِّي» سے شروع کر سکتے ہیں۔"},
 src:"Sunan an-Nasa'i 1305 · Sahih Muslim 181", acts:["salah","any"], needs:["jannah"], from:"@youssefbaleeghcoach"},

{id:"rabbana_atina", kind:"quran", g:"sahih",
 t:{en:"Make the Prophet’s most frequent dua — good in this world and the next", ur:"نبی ﷺ کی سب سے زیادہ کی جانے والی دعا — دنیا اور آخرت کی بھلائی"},
 ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
 m:{en:"Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.", ur:"اے ہمارے رب! ہمیں دنیا میں بھلائی دے اور آخرت میں بھی بھلائی دے، اور ہمیں آگ کے عذاب سے بچا۔"},
 use:{en:"Rizq, a good life and Jannah — all in one line.", ur:"رزق، اچھی زندگی اور جنت — ایک ہی جملے میں۔"},
 rw:{en:"Anas said this was the dua the Prophet ﷺ made most often (Bukhari 6389).", ur:"انسؓ نے فرمایا یہ نبی ﷺ کی سب سے زیادہ کی جانے والی دعا تھی (بخاری 6389)۔"},
 how:{en:"Any time; also between the Yemeni corner and the Black Stone in tawaf.", ur:"کسی بھی وقت؛ طواف میں رکنِ یمانی اور حجرِ اسود کے درمیان بھی۔"},
 src:"Qur'an 2:201 · Sahih al-Bukhari 6389", acts:["any"], needs:["rizq","jannah"], cnt:3, from:"@reachmohammed"},

{id:"ramadan_atiq", kind:"dua", g:"general",
 t:{en:"Every Ramadan night: ask to be freed from the Fire", ur:"رمضان کی ہر رات: جہنم سے آزادی مانگیں"},
 ar:"اللَّهُمَّ أَعْتِقْ رَقَبَتِي مِنَ النَّارِ",
 m:{en:"O Allah, free my neck from the Fire.", ur:"اے اللہ! میری گردن کو جہنم سے آزاد فرما۔"},
 use:{en:"Hoping to be among those freed each night of Ramadan.", ur:"امید کہ رمضان کی ہر رات آزاد ہونے والوں میں شامل ہوں۔"},
 rw:{en:"«Allah has people He frees from the Fire, and that is every night» of Ramadan (Tirmidhi 682 — authenticated by al-Albani).", ur:"«اللہ رمضان کی ہر رات کچھ لوگوں کو جہنم سے آزاد کرتا ہے» (ترمذی 682 — البانیؒ نے صحیح قرار دیا)۔"},
 how:{en:"Every night of Ramadan — especially at iftar and in the last third of the night.", ur:"رمضان کی ہر رات — خاص طور پر افطار پر اور رات کے آخری تہائی حصے میں۔"},
 note:{en:"This exact wording is a general dua (not quoted from a specific hadith); the reward of being freed each night is from Tirmidhi 682.", ur:"یہ الفاظ ایک عام دعا ہیں (کسی خاص حدیث کے الفاظ نہیں)؛ ہر رات آزادی کی فضیلت ترمذی 682 سے ہے۔"},
 src:"Jami' at-Tirmidhi 682 (for the virtue)", acts:["ramadan"], needs:["jannah"], cnt:3, from:"@youssefbaleeghcoach"}
);

const KNOW = [
{id:"k_greatest", e:"👑",
 t:{en:"The Greatest Name of Allah (Ism-e-Aʿẓam)", ur:"اللہ کا اسمِ اعظم"},
 b:{en:`<p>The hadiths say Allah’s Greatest Name — by which He answers when called and gives when asked — is found in:</p>
<ul><li><b>Three surahs:</b> Al-Baqarah, Āl ʿImrān and Ṭā-Hā (Ibn Majah 3856 — hasan/sahih per al-Albani).</li>
<li><b>Two verses:</b> 2:163 and 3:1–2 (Abu Dawud 1496 — hasan per al-Albani; Ibn Hajar weakened its chain).</li>
<li><b>Two sahih duas</b> the Prophet ﷺ approved: Abu Dawud 1493 and Abu Dawud 1495 / an-Nasa'i 1300 (both in the cards).</li></ul>
<p><b>Mapping every name across the six texts:</b> no single name is in all six. <span class="ar-inline">الْحَيُّ الْقَيُّومُ</span> is the only name common to all three surahs (2:255, 3:2, 20:111) and is also in the sahih dua of Abu Dawud 1495 — and the hadith’s own narrator, al-Qasim, said: «I searched for it — it is Al-Ḥayy al-Qayyūm» (al-Hakim 1885). <b>Allah</b> is in both sahih duas.</p>
<p><b>Verdict:</b> the strongest answer is <span class="ar-inline">الْحَيُّ الْقَيُّومُ</span>. The one phrase that touches all six texts is:</p>
<div class="ar-block">اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ</div>
<p>In dua: <span class="ar-inline">يَا حَيُّ يَا قَيُّومُ</span> — «O Ever-Living, O Sustainer». Scholars still differ (Ibn Hajar listed 14 opinions); this is the best-supported reading, and Allah knows best.</p>`,
 ur:`<p>احادیث کے مطابق اللہ کا اسمِ اعظم — جس سے پکارا جائے تو وہ جواب دیتا ہے اور مانگا جائے تو عطا کرتا ہے — ان میں ہے:</p>
<ul><li><b>تین سورتیں:</b> البقرہ، آلِ عمران اور طٰہٰ (ابن ماجہ 3856 — البانیؒ: حسن/صحیح)۔</li>
<li><b>دو آیتیں:</b> 2:163 اور 3:1–2 (ابوداؤد 1496 — البانیؒ: حسن؛ ابن حجرؒ نے سند کو ضعیف کہا)۔</li>
<li><b>دو صحیح دعائیں</b> جن کی نبی ﷺ نے تصدیق فرمائی: ابوداؤد 1493 اور ابوداؤد 1495 / نسائی 1300 (دونوں کارڈز میں ہیں)۔</li></ul>
<p><b>چھ نصوص میں ہر نام کا موازنہ:</b> کوئی ایک نام چھ کی چھ میں نہیں۔ <span class="ar-inline">الْحَيُّ الْقَيُّومُ</span> واحد نام ہے جو تینوں سورتوں (2:255، 3:2، 20:111) میں مشترک ہے، اور ابوداؤد 1495 کی صحیح دعا میں بھی ہے — اور حدیث کے راوی قاسمؒ نے خود کہا: «میں نے تلاش کیا — وہ الحی القیوم ہے» (حاکم 1885)۔ <b>اللہ</b> دونوں صحیح دعاؤں میں ہے۔</p>
<p><b>نتیجہ:</b> سب سے مضبوط جواب <span class="ar-inline">الْحَيُّ الْقَيُّومُ</span> ہے۔ وہ ایک جملہ جو چھ کی چھ نصوص کو چھوتا ہے:</p>
<div class="ar-block">اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ</div>
<p>دعا میں: <span class="ar-inline">يَا حَيُّ يَا قَيُّومُ</span> — «اے ہمیشہ زندہ، اے سب کو قائم رکھنے والے»۔ علماء میں اب بھی اختلاف ہے (ابن حجرؒ نے 14 اقوال ذکر کیے)؛ یہ سب سے مضبوط رائے ہے، واللہ اعلم۔</p>`},
 src:"Ibn Majah 3856 · Abu Dawud 1493, 1495, 1496 · an-Nasa'i 1300 · al-Hakim 1885", from:"Our earlier research"},

{id:"k_beloved", e:"💛",
 t:{en:"The four most beloved words — and the deeds that last", ur:"چار سب سے پسندیدہ کلمات — اور باقی رہنے والے اعمال"},
 b:{en:`<p>«The most beloved words to Allah are four: <b>SubḥānAllāh, Alḥamdulillāh, Lā ilāha illallāh, Allāhu Akbar</b> — it doesn’t matter which you begin with» (Muslim 2137). Saying them is «dearer to me than everything the sun rises over» (Muslim 2695).</p><p>Some of the salaf (Saʿid ibn al-Musayyib) said these are the «lasting good deeds» in <span class="ar-inline">وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا</span> (18:46) — wealth and children fade; these stay.</p>`,
    ur:`<p>«اللہ کو سب سے پسندیدہ کلمات چار ہیں: <b>سبحان اللہ، الحمد للہ، لا الٰہ الا اللہ، اللہ اکبر</b> — جس سے چاہو شروع کرو» (مسلم 2137)۔ ان کا کہنا «مجھے ہر اس چیز سے زیادہ محبوب ہے جس پر سورج طلوع ہوتا ہے» (مسلم 2695)۔</p><p>بعض سلف (سعید بن المسیبؒ) نے کہا یہی وہ «باقی رہنے والی نیکیاں» ہیں: <span class="ar-inline">وَالْبَاقِيَاتُ الصَّالِحَاتُ خَيْرٌ عِندَ رَبِّكَ ثَوَابًا وَخَيْرٌ أَمَلًا</span> (الکہف 18:46) — مال اور اولاد ختم ہو جاتے ہیں؛ یہ باقی رہتے ہیں۔</p>`},
 src:"Sahih Muslim 2137, 2695 · Qur'an 18:46 · Muwatta Malik", from:"@aliexplainsdeen slides"},

{id:"k_muadh", e:"🤫",
 t:{en:"The secret Muʿadh kept until he died", ur:"وہ راز جو معاذؓ نے موت تک چھپائے رکھا"},
 b:{en:`<p>Muʿadh was riding behind the Prophet ﷺ when he heard: «No one testifies, truly from the heart, that there is no god but Allah and that Muhammad is His Messenger, except that Allah makes the Fire forbidden for him.» Muʿadh asked: «Shall I tell people so they rejoice?» He ﷺ said: «Then they will just rely on it.» Muʿadh told it only at his death, fearing the sin of hiding knowledge (Bukhari 128).</p>`,
    ur:`<p>معاذؓ نبی ﷺ کے پیچھے سوار تھے جب سنا: «جو بھی سچے دل سے گواہی دے کہ اللہ کے سوا کوئی معبود نہیں اور محمد اس کے رسول ہیں، اللہ اس پر آگ حرام کر دیتا ہے۔» معاذؓ نے پوچھا: «کیا لوگوں کو بتا دوں تاکہ خوش ہوں؟» فرمایا: «پھر وہ اسی پر بھروسہ کر بیٹھیں گے۔» معاذؓ نے یہ صرف وفات کے وقت بتایا، علم چھپانے کے گناہ کے ڈر سے (بخاری 128)۔</p>`},
 src:"Sahih al-Bukhari 128 · Sahih Muslim 32", from:"@aliexplainsdeen slides"},

{id:"k_after_salah", e:"📱",
 t:{en:"Shaytan’s trap right after salah", ur:"نماز کے فوراً بعد شیطان کا جال"},
 b:{en:`<p>Many people finish with «as-salāmu ʿalaykum» and immediately grab their phone or get up — losing the after-prayer adhkar that erase sins «like the foam of the sea» (Muslim 597).</p><p>Meanwhile, «the angels keep praying for you as long as you stay in your place of prayer: ‘O Allah forgive him, O Allah have mercy on him’» (Bukhari 445). Sit for a few minutes — it’s the cheapest reward of your day.</p>`,
    ur:`<p>بہت سے لوگ «السلام علیکم» کہتے ہی فون اٹھا لیتے ہیں یا اٹھ جاتے ہیں — اور نماز کے بعد کے وہ اذکار رہ جاتے ہیں جو «سمندر کی جھاگ» جتنے گناہ مٹا دیتے ہیں (مسلم 597)۔</p><p>جبکہ «جب تک تم اپنی نماز کی جگہ بیٹھے رہو فرشتے تمہارے لیے دعا کرتے رہتے ہیں: ’اے اللہ اسے بخش دے، اے اللہ اس پر رحم فرما‘» (بخاری 445)۔ چند منٹ بیٹھیں — یہ آپ کے دن کا سب سے سستا اجر ہے۔</p>`},
 src:"Sahih Muslim 597 · Sahih al-Bukhari 445", from:"@brother_sulaiman_fariz"},

{id:"k_love", e:"🤝",
 t:{en:"People the Prophets will envy", ur:"وہ لوگ جن پر انبیاء بھی رشک کریں گے"},
 b:{en:`<p>Not martyrs, not scholars — two friends who loved each other only for Allah, with no family tie and no worldly benefit. Allah says: «Those who love each other for My glory will have pulpits of light; the Prophets and martyrs will envy them» (Tirmidhi 2390). They are also among the seven in Allah’s shade on the Day there is no shade but His (Bukhari 660). See the «With people» card for what to say.</p>`,
    ur:`<p>شہید نہیں، عالم نہیں — دو دوست جو صرف اللہ کے لیے ایک دوسرے سے محبت کرتے تھے، نہ رشتہ داری، نہ دنیاوی فائدہ۔ اللہ فرماتا ہے: «میری عظمت کی خاطر آپس میں محبت کرنے والوں کے لیے نور کے منبر ہوں گے؛ انبیاء اور شہداء ان پر رشک کریں گے» (ترمذی 2390)۔ یہ ان سات میں بھی ہیں جو اس دن اللہ کے سائے میں ہوں گے جب کوئی سایہ نہ ہوگا (بخاری 660)۔ کیا کہنا ہے — «لوگوں کے ساتھ» والا کارڈ دیکھیں۔</p>`},
 src:"Jami' at-Tirmidhi 2390 · Sahih al-Bukhari 660", from:"@youssefbaleeghcoach"},

{id:"k_birth", e:"👶",
 t:{en:"Why every baby cries at birth", ur:"ہر بچہ پیدائش پر کیوں روتا ہے"},
 b:{en:`<p>«No child of Adam is born without Shaytan touching it when it is born, so it cries out from his touch — except Maryam and her son» (Bukhari 3431). Abu Hurayrah then recited her mother’s words: <span class="ar-inline">وَإِنِّي أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ الشَّيْطَانِ الرَّجِيمِ</span> (3:36). You can make the same dua for your children — see the Ruqyah tab.</p>`,
    ur:`<p>«آدم کی ہر اولاد کو پیدائش کے وقت شیطان چھوتا ہے تو وہ اس کے چھونے سے چیختا ہے — سوائے مریمؑ اور ان کے بیٹے کے» (بخاری 3431)۔ پھر ابو ہریرہؓ نے ان کی والدہ کے الفاظ پڑھے: <span class="ar-inline">وَإِنِّي أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ الشَّيْطَانِ الرَّجِيمِ</span> (آل عمران 3:36)۔ آپ بھی اپنی اولاد کے لیے یہی دعا کر سکتے ہیں — رقیہ ٹیب دیکھیں۔</p>`},
 src:"Sahih al-Bukhari 3431 · Qur'an 3:36", from:"@quranflows.app"},

{id:"k_argue", e:"⚖️",
 t:{en:"When Jannah and Jahannam argued", ur:"جب جنت اور جہنم نے آپس میں بحث کی"},
 b:{en:`<p>The Fire said: «The arrogant and the tyrants will enter me.» Paradise said: «The weak and the humble will enter me.» Allah said to Paradise: «You are My mercy — through you I show mercy to whom I will,» and to the Fire: «You are My punishment.» And each will be filled (Muslim 2846).</p><p>And they speak for you: ask for Jannah 3 times and it asks Allah to admit you; seek refuge from the Fire 3 times and it asks Allah to protect you (Tirmidhi 2572).</p>`,
    ur:`<p>جہنم نے کہا: «مجھ میں متکبر اور ظالم داخل ہوں گے۔» جنت نے کہا: «مجھ میں کمزور اور عاجز لوگ داخل ہوں گے۔» اللہ نے جنت سے فرمایا: «تو میری رحمت ہے، تیرے ذریعے جس پر چاہوں رحم کروں،» اور جہنم سے: «تو میرا عذاب ہے۔» اور دونوں بھر دی جائیں گی (مسلم 2846)۔</p><p>اور یہ آپ کے لیے بولتی ہیں: تین بار جنت مانگیں تو وہ اللہ سے آپ کو داخل کرنے کی دعا کرتی ہے؛ تین بار جہنم سے پناہ مانگیں تو وہ آپ کو بچانے کی دعا کرتی ہے (ترمذی 2572)۔</p>`},
 src:"Sahih Muslim 2846 · Jami' at-Tirmidhi 2572", from:"@samer_speaks"},

{id:"k_lowest", e:"🏰",
 t:{en:"The lowest level of Jannah — so aim for Firdaws", ur:"جنت کا سب سے نچلا درجہ — اس لیے فردوس کا ہدف رکھیں"},
 b:{en:`<p>The last person to enter Jannah will be told to wish; he wishes until his wishes run out, and Allah says: «You have that, and ten times as much» (Muslim 186). That is the <i>lowest</i> rank. The Prophet ﷺ told us: when you ask Allah, ask for Al-Firdaws — the highest, beneath the Throne, where the rivers of Jannah begin (Bukhari 2790).</p>`,
    ur:`<p>جنت میں آخری داخل ہونے والے سے کہا جائے گا آرزو کرو؛ وہ آرزوئیں کرتا رہے گا یہاں تک کہ ختم ہو جائیں، اور اللہ فرمائے گا: «یہ سب تمہارا ہے اور اس کا دس گنا» (مسلم 186)۔ یہ سب سے <i>نچلا</i> درجہ ہے۔ نبی ﷺ نے فرمایا: جب اللہ سے مانگو تو فردوس مانگو — سب سے اونچا، عرش کے نیچے، جہاں سے جنت کی نہریں نکلتی ہیں (بخاری 2790)۔</p>`},
 src:"Sahih Muslim 186 · Sahih al-Bukhari 2790 · Riyad as-Salihin", from:"@youssefbaleeghcoach"},

{id:"k_greater", e:"✨",
 t:{en:"Something greater than Jannah", ur:"جنت سے بھی بڑی نعمت"},
 b:{en:`<p>Allah will ask the people of Paradise: «Are you satisfied?» They say: «How could we not be, when You gave us what You gave no one else?» He says: «Shall I not give you something better? I bestow My pleasure upon you and will never be angry with you again» (Bukhari 6549). And when the veil is lifted, «nothing they were given will be dearer to them than looking at their Lord» (Muslim 181).</p>`,
    ur:`<p>اللہ اہلِ جنت سے پوچھے گا: «کیا تم راضی ہو؟» وہ کہیں گے: «کیوں نہ ہوں، تو نے ہمیں وہ دیا جو کسی کو نہیں دیا۔» فرمائے گا: «کیا میں تمہیں اس سے بہتر چیز نہ دوں؟ میں تم پر اپنی رضا نازل کرتا ہوں، اس کے بعد کبھی ناراض نہ ہوں گا» (بخاری 6549)۔ اور جب پردہ اٹھے گا تو «انہیں اپنے رب کے دیدار سے زیادہ محبوب کوئی چیز نہ دی گئی ہوگی» (مسلم 181)۔</p>`},
 src:"Sahih al-Bukhari 6549 · Sahih Muslim 181", from:"@youssefbaleeghcoach"},

{id:"k_999", e:"🔥",
 t:{en:"999 of every 1000 — and why Ramadan matters", ur:"ہر ہزار میں سے 999 — اور رمضان کیوں اہم ہے"},
 b:{en:`<p>On the Day of Judgement Allah will tell Adam: «Bring out the people of the Fire.» «How many?» «From every thousand, nine hundred and ninety-nine.» The companions were shaken; the Prophet ﷺ reassured them that Gog and Magog make up the vast number and said: «I hope you will be half the people of Paradise» (Bukhari 3348).</p><p>And in Ramadan, «Allah has people He frees from the Fire — every night» (Tirmidhi 682). So ask every night.</p>`,
    ur:`<p>قیامت کے دن اللہ آدمؑ سے فرمائے گا: «جہنم والوں کو نکالو۔» «کتنے؟» «ہر ہزار میں سے نو سو ننانوے۔» صحابہ گھبرا گئے؛ نبی ﷺ نے تسلی دی کہ اتنی بڑی تعداد یاجوج ماجوج کی ہوگی اور فرمایا: «مجھے امید ہے تم اہلِ جنت کا آدھا ہو گے» (بخاری 3348)۔</p><p>اور رمضان میں «اللہ ہر رات کچھ لوگوں کو جہنم سے آزاد کرتا ہے» (ترمذی 682)۔ اس لیے ہر رات مانگیں۔</p>`},
 src:"Sahih al-Bukhari 3348 · Jami' at-Tirmidhi 682", from:"@youssefbaleeghcoach"},

{id:"k_seven", e:"⚠️",
 t:{en:"Seven kinds of Muslims in danger", ur:"سات قسم کے مسلمان جو خطرے میں ہیں"},
 b:{en:`<ol><li><b>The show-off</b> — doing deeds to be seen; the Prophet ﷺ called it «the minor shirk» (Ahmad 23630).</li><li><b>The bankrupt</b> — comes with prayer and fasting but had insulted, slandered and wronged people; his good deeds are given to them (Muslim 2581).</li><li><b>The one who abandons prayer</b> — «between a man and shirk and kufr is abandoning the prayer» (Muslim 82).</li><li><b>The arrogant</b> — «no one with a mustard seed of arrogance in his heart will enter Paradise» (Muslim 91).</li><li><b>The private sinner</b> — good deeds like mountains made scattered dust, because alone he violated Allah’s limits (Ibn Majah 4245 — sahih per al-Albani).</li><li><b>«I’ll repent later»</b> — delaying tawbah until it’s too late; tawbah is accepted only until the death-rattle (Tirmidhi 3537).</li><li><b>The complacent «born Muslim»</b> — relying on a Muslim name and family instead of actually practising (a general reminder, see 49:14).</li></ol>`,
    ur:`<ol><li><b>دکھاوا کرنے والا</b> — لوگوں کو دکھانے کے لیے عمل؛ نبی ﷺ نے اسے «شرکِ اصغر» فرمایا (مسند احمد 23630)۔</li><li><b>مفلس</b> — نماز روزہ لے کر آئے گا مگر لوگوں کو گالی دی، تہمت لگائی، ظلم کیا؛ اس کی نیکیاں انہیں دے دی جائیں گی (مسلم 2581)۔</li><li><b>نماز چھوڑنے والا</b> — «آدمی اور شرک و کفر کے درمیان نماز کا چھوڑنا ہے» (مسلم 82)۔</li><li><b>متکبر</b> — «جس کے دل میں رائی کے دانے برابر تکبر ہو وہ جنت میں داخل نہ ہوگا» (مسلم 91)۔</li><li><b>چھپ کر گناہ کرنے والا</b> — پہاڑوں جیسی نیکیاں بکھری ہوئی دھول بنا دی جائیں گی، کیونکہ تنہائی میں اللہ کی حدیں توڑیں (ابن ماجہ 4245 — البانیؒ: صحیح)۔</li><li><b>«بعد میں توبہ کر لوں گا»</b> — توبہ ٹالتے رہنا؛ توبہ صرف موت کے غرغرے سے پہلے تک قبول ہے (ترمذی 3537)۔</li><li><b>بے فکر «پیدائشی مسلمان»</b> — عمل کے بجائے مسلم نام اور خاندان پر بھروسہ (عمومی نصیحت، دیکھیں الحجرات 49:14)۔</li></ol>`},
 src:"Muslim 2581, 82, 91 · Ahmad 23630 · Ibn Majah 4245 · Tirmidhi 3537", from:"@samer_speaks"},

{id:"k_near", e:"📡",
 t:{en:"Al-Qarīb & Al-Mujīb — the Near, the Responder", ur:"القریب اور المجیب — قریب، جواب دینے والا"},
 b:{en:`<p>«When My servants ask you about Me — I am near. I respond to the call of the caller when he calls Me» (2:186). Salih said: <span class="ar-inline">إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ</span> «My Lord is Near and Responsive» (11:61). He is «nearer than the jugular vein» (50:16). No dua is lost: He answers it, stores its reward, or averts an equal harm (Ahmad 11133).</p>`,
    ur:`<p>«جب میرے بندے تم سے میرے بارے میں پوچھیں — میں قریب ہوں۔ پکارنے والے کی پکار کا جواب دیتا ہوں جب وہ مجھے پکارے» (البقرہ 2:186)۔ صالحؑ نے کہا: <span class="ar-inline">إِنَّ رَبِّي قَرِيبٌ مُّجِيبٌ</span> «میرا رب قریب ہے، قبول کرنے والا» (ہود 11:61)۔ وہ «شہ رگ سے بھی زیادہ قریب» ہے (ق 50:16)۔ کوئی دعا ضائع نہیں: یا قبول ہوتی ہے، یا اس کا اجر محفوظ ہوتا ہے، یا اتنی ہی کوئی مصیبت ٹل جاتی ہے (مسند احمد 11133)۔</p>`},
 src:"Qur'an 2:186, 11:61, 50:16 · Musnad Ahmad 11133", from:"@samiespeaks"},

{id:"k_rizq", e:"🗝️",
 t:{en:"Your rizq is already written", ur:"آپ کا رزق پہلے سے لکھا جا چکا ہے"},
 b:{en:`<p>«And in the heaven is your provision and whatever you are promised» (51:22). When a baby is in the womb, an angel writes its provision, lifespan, deeds and whether it will be wretched or happy (Bukhari 3208). So chase it the halal way, without panic — and remember: «If you are grateful, I will surely increase you» (14:7). Tie your camel and trust Allah (Tirmidhi 2517).</p>`,
    ur:`<p>«اور آسمان میں تمہارا رزق ہے اور وہ جس کا تم سے وعدہ کیا جاتا ہے» (الذاریات 51:22)۔ جب بچہ رحم میں ہوتا ہے تو فرشتہ اس کا رزق، عمر، عمل اور نیک بخت یا بدبخت ہونا لکھ دیتا ہے (بخاری 3208)۔ اس لیے حلال طریقے سے کوشش کریں، گھبراہٹ کے بغیر — اور یاد رکھیں: «اگر تم شکر کرو گے تو میں ضرور زیادہ دوں گا» (ابراہیم 14:7)۔ اونٹ باندھو اور اللہ پر بھروسہ کرو (ترمذی 2517)۔</p>`},
 src:"Qur'an 51:22, 14:7 · Bukhari 3208 · Tirmidhi 2517", from:"@reachmohammed"},

{id:"k_ease", e:"🌤️",
 t:{en:"Sad for no reason? Allah answered that — twice", ur:"بلاوجہ اداس؟ اللہ نے اس کا جواب دیا — دو بار"},
 b:{en:`<div class="ar-block">فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٥﴾ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٦﴾</div><p>«So surely with hardship comes ease. Surely with hardship comes ease» (94:5–6). Not «after» — <i>with</i>. The cloud doesn’t stay forever. Pair it with the dua for sadness (Ahmad 3712) in the «Anxiety, grief & stress» tab.</p>`,
    ur:`<div class="ar-block">فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٥﴾ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴿٦﴾</div><p>«پس بے شک تنگی کے ساتھ آسانی ہے۔ بے شک تنگی کے ساتھ آسانی ہے» (الانشراح 94:5–6)۔ «بعد» نہیں — <i>ساتھ</i>۔ بادل ہمیشہ نہیں رہتا۔ اس کے ساتھ غم کی دعا (مسند احمد 3712) پڑھیں — «پریشانی، غم اور دباؤ» ٹیب میں۔</p>`},
 src:"Qur'an 94:5–6", from:"@dailyduaremindershq"},

{id:"k_allah40", e:"🌙",
 t:{en:"Things about Allah you should never forget", ur:"اللہ کے بارے میں وہ باتیں جو کبھی نہ بھولیں"},
 b:{en:`<ul><li>Tawbah stays open until your last breath (Tirmidhi 3537).</li><li>He never sleeps — «neither drowsiness nor sleep overtakes Him» (2:255).</li><li>Relief is inside the hardship, not after it (94:5–6).</li><li>Your rizq is written; stop panicking (51:22).</li><li>Shaytan has no authority over those who rely on Him (16:99).</li><li>Your guilt is a sign He hasn’t let you go — regret itself is repentance (Ibn Majah 4252).</li><li>Your pain burns sins: no fatigue, illness, worry or even a thorn’s prick except that Allah wipes sins with it (Bukhari 5641).</li><li>He is Al-Wadūd — the Most Loving (85:14).</li><li>He was there before anyone loved you, and He has never given up on you: «Do not despair of the mercy of Allah» (39:53).</li></ul>`,
    ur:`<ul><li>توبہ کا دروازہ آخری سانس تک کھلا ہے (ترمذی 3537)۔</li><li>وہ کبھی نہیں سوتا — «نہ اسے اونگھ آتی ہے نہ نیند» (2:255)۔</li><li>راحت تنگی کے اندر ہے، اس کے بعد نہیں (94:5–6)۔</li><li>آپ کا رزق لکھا ہے؛ گھبرانا چھوڑیں (51:22)۔</li><li>شیطان کا ان پر کوئی زور نہیں جو اللہ پر بھروسہ کرتے ہیں (النحل 16:99)۔</li><li>آپ کا احساسِ گناہ نشانی ہے کہ اس نے آپ کو چھوڑا نہیں — ندامت ہی توبہ ہے (ابن ماجہ 4252)۔</li><li>تکلیف گناہ جلاتی ہے: کوئی تھکن، بیماری، فکر حتیٰ کہ کانٹا چبھنا بھی ایسا نہیں جس سے اللہ گناہ نہ مٹائے (بخاری 5641)۔</li><li>وہ الودود ہے — سب سے زیادہ محبت کرنے والا (البروج 85:14)۔</li><li>وہ آپ سے کسی کے پیار کرنے سے پہلے موجود تھا، اور اس نے کبھی آپ کو نہیں چھوڑا: «اللہ کی رحمت سے مایوس نہ ہو» (الزمر 39:53)۔</li></ul>`},
 src:"Qur'an 2:255, 94:5–6, 51:22, 16:99, 85:14, 39:53 · Tirmidhi 3537 · Ibn Majah 4252 · Bukhari 5641", from:"@seedsof.ilm (40 things about Allah — selected, each verified)"},

{id:"k_habits", e:"🌱",
 t:{en:"Life habits from the Prophet ﷺ", ur:"نبی ﷺ کی زندگی کی عادات"},
 b:{en:`<ul><li>Start everything with «Bismillāh» (Muslim 2017 for eating; Abu Dawud 5095 leaving home).</li><li>Speak good or stay silent (Bukhari 6018).</li><li>Never belittle a good deed — even meeting your brother with a smile (Muslim 2626).</li><li>The best of you are the best to their families (Tirmidhi 3895).</li><li>Lower your gaze — it protects the heart (24:30).</li><li>Beware of envy (avoid it — 113:5; Abu Dawud 4903 on envy eating good deeds is weak).</li><li>The most beloved deeds to Allah are the most consistent, even if small (Bukhari 6464).</li><li>Tie your camel, then trust Allah (Tirmidhi 2517).</li><li>Check your intention — deeds are by intentions (Bukhari 1).</li><li>Seek knowledge — it is an obligation on every Muslim (Ibn Majah 224).</li><li>Feed people — one of the best deeds (Bukhari 12).</li><li>Don’t laugh too much — it deadens the heart (Ibn Majah 4193).</li><li>The merciful are shown mercy by the Most Merciful (Tirmidhi 1924).</li><li>Look at those below you in worldly things, not above (Muslim 2963).</li><li>Your body has a right over you — rest (Bukhari 1975).</li><li>None of you truly believes until he loves for his brother what he loves for himself (Bukhari 13).</li></ul>`,
    ur:`<ul><li>ہر کام «بسم اللہ» سے شروع کریں (کھانا: مسلم 2017؛ گھر سے نکلنا: ابوداؤد 5095)۔</li><li>اچھی بات کہو یا خاموش رہو (بخاری 6018)۔</li><li>کسی نیکی کو حقیر نہ سمجھو — چاہے بھائی سے مسکرا کر ملنا ہو (مسلم 2626)۔</li><li>تم میں بہترین وہ ہے جو اپنے گھر والوں کے لیے بہترین ہو (ترمذی 3895)۔</li><li>نظریں نیچی رکھو — یہ دل کی حفاظت ہے (النور 24:30)۔</li><li>حسد سے بچو (الفلق 113:5؛ ابوداؤد 4903 والی «حسد نیکیاں کھا جاتا ہے» روایت ضعیف ہے)۔</li><li>اللہ کو سب سے پسندیدہ عمل وہ ہے جو مستقل ہو، چاہے تھوڑا ہو (بخاری 6464)۔</li><li>اونٹ باندھو، پھر اللہ پر بھروسہ کرو (ترمذی 2517)۔</li><li>نیت درست کرو — اعمال کا دار و مدار نیتوں پر ہے (بخاری 1)۔</li><li>علم حاصل کرو — یہ ہر مسلمان پر فرض ہے (ابن ماجہ 224)۔</li><li>لوگوں کو کھانا کھلاؤ — بہترین اعمال میں سے (بخاری 12)۔</li><li>زیادہ نہ ہنسو — یہ دل کو مردہ کر دیتا ہے (ابن ماجہ 4193)۔</li><li>رحم کرنے والوں پر رحمٰن رحم کرتا ہے (ترمذی 1924)۔</li><li>دنیا میں اپنے سے کم والوں کو دیکھو، اوپر والوں کو نہیں (مسلم 2963)۔</li><li>تمہارے جسم کا بھی تم پر حق ہے — آرام کرو (بخاری 1975)۔</li><li>تم میں سے کوئی کامل مومن نہیں جب تک اپنے بھائی کے لیے وہی پسند نہ کرے جو اپنے لیے کرتا ہے (بخاری 13)۔</li></ul>`},
 src:"Bukhari 1, 12, 13, 1975, 6018, 6464 · Muslim 2017, 2626, 2963 · Tirmidhi 1924, 2517, 3895 · Ibn Majah 224, 4193", from:"@seedsof.ilm (30 habits — selected, each verified)"},

{id:"k_myths", e:"🔍",
 t:{en:"Myth check: claims in the reels that aren’t established", ur:"حقیقت جانچ: ریلز کے وہ دعوے جو ثابت نہیں"},
 b:{en:`<ul><li><b>«A dua for your birth month»</b> — no basis; every dua there is for everyone.</li><li><b>«Do this for 7 nights and watch your rizq»</b> — no source for the 7-night promise.</li><li><b>«70,000 angels pray for you and you die a martyr»</b> (last verses of al-Hashr in the morning, Tirmidhi 2922) — graded weak. The two reels said «read caption», and the caption wasn’t included.</li><li><b>«The angels were confused how to record it»</b> (Ibn Majah 3801) — weak.</li><li><b>«Whoever holds to istighfar gets a way out of every hardship»</b> (Abu Dawud 1518) — weak; but Qur'an 71:10–12 and 65:2–3 give similar promises.</li><li><b>«Ḥasbiyallāh 7 times morning & evening»</b> (Abu Dawud 5081) — a saying of Abu al-Dardaʾ; al-Albani graded attributing it to the Prophet ﷺ as fabricated.</li><li><b>Salawat that «guarantees» seeing the Prophet ﷺ in dreams and Jannah</b> — the narration (Abu Dawud 982) is weak and doesn’t contain those promises.</li><li><b>«…innaka lā tukhliful-mīʿād» at the end of the Adhan dua</b> — not in Bukhari; judged an irregular addition.</li><li><b>«Last verses of al-Baqarah (285–287)»</b> — Al-Baqarah has 286 verses; it’s 285–286.</li><li><b>«Allāhumma iḥfaẓnī min ʿadhābik»</b> — the authentic wording is «qinī ʿadhābak».</li><li><b>«Read Al-Fatiha an odd number of times»</b> — no specific narration; recite as often as you like.</li></ul>`,
    ur:`<ul><li><b>«آپ کے پیدائش کے مہینے کی دعا»</b> — کوئی بنیاد نہیں؛ ہر دعا سب کے لیے ہے۔</li><li><b>«سات راتیں یہ کرو اور رزق دیکھو»</b> — سات راتوں کے وعدے کا کوئی ماخذ نہیں۔</li><li><b>«ستر ہزار فرشتے دعا کریں گے اور شہید کی موت»</b> (صبح سورۂ حشر کی آخری آیات، ترمذی 2922) — ضعیف۔ دونوں ریلز میں «کیپشن پڑھیں» تھا اور کیپشن شامل نہیں تھا۔</li><li><b>«فرشتے حیران تھے کہ اجر کیسے لکھیں»</b> (ابن ماجہ 3801) — ضعیف۔</li><li><b>«جو استغفار لازم پکڑے اسے ہر تنگی سے نکلنے کا راستہ»</b> (ابوداؤد 1518) — ضعیف؛ لیکن قرآن 71:10–12 اور 65:2–3 میں ایسے ہی وعدے ہیں۔</li><li><b>«حسبی اللہ صبح شام سات بار»</b> (ابوداؤد 5081) — ابو الدرداءؓ کا قول؛ البانیؒ نے اسے نبی ﷺ کی طرف منسوب کرنا موضوع کہا۔</li><li><b>وہ درود جو خواب میں زیارت اور جنت کی «ضمانت» دے</b> — روایت (ابوداؤد 982) ضعیف ہے اور اس میں یہ وعدے نہیں۔</li><li><b>اذان کی دعا کے آخر میں «إنك لا تخلف الميعاد»</b> — بخاری میں نہیں؛ شاذ اضافہ قرار دیا گیا۔</li><li><b>«سورۂ بقرہ کی آخری آیات (285–287)»</b> — بقرہ میں 286 آیات ہیں؛ یہ 285–286 ہیں۔</li><li><b>«اللّٰہم احفظنی من عذابک»</b> — مستند الفاظ «قِنِي عذابك» ہیں۔</li><li><b>«فاتحہ طاق عدد میں پڑھیں»</b> — کوئی خاص روایت نہیں؛ جتنی بار چاہیں پڑھیں۔</li></ul>`},
 src:"Checked against sunnah.com, dorar.net and al-Albani’s gradings", from:"All reels"}
];

// ===== Batch 2 (Nov 15): @awbaa.ar, @danielle_best_, @ilm_ayah ×2, @reachmohammed, @uzmannmalik =====
ITEMS.push(
{id:"makrub", kind:"dua", g:"hasan",
 t:{en:"Make the dua of the distressed — «Raḥmataka arjū»", ur:"پریشان حال کی دعا — «رحمتک أرجو»"},
 ar:"اللَّهُمَّ رَحْمَتَكَ أَرْجُو، فَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ، وَأَصْلِحْ لِي شَأْنِي كُلَّهُ، لَا إِلَهَ إِلَّا أَنْتَ",
 m:{en:"O Allah, it is Your mercy I hope for, so do not leave me to myself even for the blink of an eye. Set right all of my affairs. There is no god but You.", ur:"اے اللہ! میں تیری ہی رحمت کی امید رکھتا ہوں، پس مجھے پلک جھپکنے کے برابر بھی میرے نفس کے حوالے نہ کر، اور میرے سارے کام درست فرما دے۔ تیرے سوا کوئی معبود نہیں۔"},
 use:{en:"When you feel overwhelmed, anxious or stuck, and want Allah to take charge of your affairs.", ur:"جب دل گھبرائے، پریشانی ہو یا کام اٹک جائیں اور آپ چاہیں کہ اللہ آپ کے معاملات سنبھال لے۔"},
 rw:{en:"The Prophet ﷺ named these words «the supplications of the distressed» (daʿawāt al-makrūb) — Abu Dawud 5090, graded hasan by al-Albani.", ur:"نبی ﷺ نے ان الفاظ کو «پریشان حال کی دعائیں» (دعوات المکروب) فرمایا — ابوداؤد 5090، البانی: حسن۔"},
 how:{en:"Say it whenever worry hits — any time of day or night. The last part of the night is a special time for duas in general.", ur:"جب بھی پریشانی آئے پڑھیں — دن ہو یا رات۔ رات کا آخری حصہ عمومی طور پر دعا کی قبولیت کا خاص وقت ہے۔"},
 note:{en:"The reel says no one makes this dua at the end of the night without it being answered. That promise is not in the hadith — the hadith only calls it the dua of the distressed. What is authentic is that Allah calls out in the last third of every night: «Who will call on Me so I may answer him?» (Bukhari 1145).", ur:"ریل میں کہا گیا کہ جو بھی رات کے آخری حصے میں یہ دعا کرے اس کی دعا ضرور قبول ہوتی ہے۔ یہ وعدہ حدیث میں نہیں — حدیث صرف اسے پریشان حال کی دعا کہتی ہے۔ مستند یہ ہے کہ ہر رات کے آخری تہائی حصے میں اللہ فرماتا ہے: «کون ہے جو مجھے پکارے کہ میں اس کی دعا قبول کروں؟» (بخاری 1145)۔"},
 src:"Sunan Abi Dawud 5090 · Sahih al-Bukhari 1145", acts:["wake","any"], needs:["worry","ease"], from:"@uzmannmalik"},

{id:"four_refuge", kind:"dua", g:"sahih",
 t:{en:"Before salam in every salah, seek refuge from 4 things — including the Dajjal", ur:"ہر نماز میں سلام سے پہلے 4 چیزوں سے پناہ مانگیں — دجال سمیت"},
 ar:"اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ جَهَنَّمَ، وَمِنْ عَذَابِ الْقَبْرِ، وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ، وَمِنْ شَرِّ فِتْنَةِ الْمَسِيحِ الدَّجَّالِ",
 m:{en:"O Allah, I seek refuge in You from the punishment of Hell, from the punishment of the grave, from the trials of life and death, and from the evil of the trial of the False Messiah (the Dajjal).", ur:"اے اللہ! میں تیری پناہ مانگتا ہوں جہنم کے عذاب سے، قبر کے عذاب سے، زندگی اور موت کے فتنوں سے، اور مسیح دجال کے فتنے کے شر سے۔"},
 use:{en:"Protection from the four greatest dangers — in this life, at death, in the grave and in the Hereafter.", ur:"چار سب سے بڑے خطروں سے حفاظت — دنیا میں، موت کے وقت، قبر میں اور آخرت میں۔"},
 rw:{en:"The Prophet ﷺ said: when one of you finishes the tashahhud, let him seek refuge in Allah from these four (Muslim 588). It is one of the three protections from the Dajjal.", ur:"نبی ﷺ نے فرمایا: جب تم میں سے کوئی تشہد سے فارغ ہو تو ان چار چیزوں سے اللہ کی پناہ مانگے (مسلم 588)۔ یہ دجال سے بچاؤ کے تین طریقوں میں سے ایک ہے۔"},
 how:{en:"In the last sitting of every salah: after the tashahhud and the salawat on the Prophet ﷺ, say this, then say salam.", ur:"ہر نماز کے آخری قعدے میں: تشہد اور درود کے بعد یہ پڑھیں، پھر سلام پھیریں۔"},
 note:{en:"The reel shortens it to «Allāhumma innī aʿūdhu bika min fitnatil-masīḥid-dajjāl». The full wording above is what the Prophet ﷺ taught.", ur:"ریل میں صرف «اللّٰہم إنی أعوذ بک من فتنۃ المسیح الدجال» ہے۔ اوپر والے مکمل الفاظ وہ ہیں جو نبی ﷺ نے سکھائے۔"},
 src:"Sahih Muslim 588", acts:["salah"], needs:["protect","jannah"], from:"@ilm_ayah"},

{id:"kahf10", kind:"action", g:"sahih",
 t:{en:"Memorise the first ten verses of Surah Al-Kahf (18:1–10)", ur:"سورۂ کہف کی پہلی دس آیتیں (18:1–10) یاد کریں"},
 ar:null, m:{en:"",ur:""},
 use:{en:"Protection from the Dajjal — the greatest trial from Adam until the Last Day.", ur:"دجال سے حفاظت — آدمؑ سے قیامت تک کا سب سے بڑا فتنہ۔"},
 rw:{en:"«Whoever memorises ten verses from the beginning of Surah al-Kahf will be protected from the Dajjal» (Muslim 809). «Whoever of you meets him, let him recite over him the opening verses of Surah al-Kahf» (Muslim 2937).", ur:"«جس نے سورۂ کہف کی ابتدائی دس آیتیں یاد کیں وہ دجال سے محفوظ رہے گا» (مسلم 809)۔ «تم میں سے جو اسے پائے وہ اس پر سورۂ کہف کی ابتدائی آیتیں پڑھے» (مسلم 2937)۔"},
 how:{en:"Learn one or two verses a day until you have all ten, then keep revising them.", ur:"روزانہ ایک دو آیتیں یاد کریں یہاں تک کہ دسوں ہو جائیں، پھر دہراتے رہیں۔"},
 note:{en:"One narration in Muslim 809 says «the last ten verses». Learning both the first and last ten covers both narrations.", ur:"مسلم 809 کی ایک روایت میں «آخری دس آیتیں» ہیں۔ پہلی اور آخری دونوں دس آیتیں یاد کرنے سے دونوں روایتوں پر عمل ہو جاتا ہے۔"},
 src:"Sahih Muslim 809 · Sahih Muslim 2937 · Qur'an 18:1–10", acts:["any"], needs:["protect","guide"], from:"@ilm_ayah"},

{id:"after_eat", kind:"dua", g:"hasan",
 t:{en:"After eating, praise Allah who fed you — your past sins are forgiven", ur:"کھانے کے بعد اللہ کی حمد کریں — پچھلے گناہ معاف"},
 ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَذَا، وَرَزَقَنِيهِ، مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ",
 m:{en:"All praise is for Allah, who fed me this and provided it for me without any power or strength on my part.", ur:"تمام تعریف اللہ کے لیے ہے جس نے مجھے یہ کھلایا اور مجھے یہ رزق دیا، بغیر میری کسی طاقت اور قوت کے۔"},
 use:{en:"Gratitude for every meal, and forgiveness.", ur:"ہر کھانے پر شکر، اور مغفرت۔"},
 rw:{en:"«Whoever eats food and then says this, his past sins are forgiven» (Tirmidhi 3458 — at-Tirmidhi: hasan; al-Albani: hasan).", ur:"«جو کھانا کھائے پھر یہ کہے، اس کے پچھلے گناہ معاف کر دیے جاتے ہیں» (ترمذی 3458 — ترمذی: حسن؛ البانی: حسن)۔"},
 how:{en:"Once you finish a meal.", ur:"کھانا ختم کرنے کے بعد۔"},
 note:{en:"Abu Dawud 4023 adds «and his future sins»; al-Albani graded it hasan without that addition. Scholars explain that good deeds like this wipe out minor sins.", ur:"ابوداؤد 4023 میں «اور آئندہ کے گناہ» کا اضافہ ہے؛ البانی نے اس اضافے کے بغیر حسن کہا۔ علماء کے مطابق ایسے نیک اعمال صغیرہ گناہ مٹاتے ہیں۔"},
 src:"Jami' at-Tirmidhi 3458 · Sunan Ibn Majah 3285 · Sunan Abi Dawud 4023", acts:["eat"], needs:["forgive","grat","reward"], from:"@ilm_ayah"},

{id:"handshake", kind:"action", g:"sahih",
 t:{en:"Shake hands when you meet a fellow Muslim", ur:"مسلمان بھائی سے ملیں تو مصافحہ کریں"},
 ar:null, m:{en:"",ur:""},
 use:{en:"Love between Muslims — and forgiveness for both of you.", ur:"مسلمانوں میں محبت — اور دونوں کی مغفرت۔"},
 rw:{en:"«No two Muslims meet and shake hands except that they are forgiven before they part» (Abu Dawud 5212, Tirmidhi 2727 — al-Albani: sahih).", ur:"«جب بھی دو مسلمان ملتے ہیں اور مصافحہ کرتے ہیں تو جدا ہونے سے پہلے ان کی مغفرت کر دی جاتی ہے» (ابوداؤد 5212، ترمذی 2727 — البانی: صحیح)۔"},
 how:{en:"Say salam and shake hands with a smile — men with men, women with women.", ur:"سلام کریں اور مسکرا کر مصافحہ کریں — مرد مردوں سے، خواتین خواتین سے۔"},
 note:null,
 src:"Sunan Abi Dawud 5212 · Jami' at-Tirmidhi 2727 · Sunan Ibn Majah 3703", acts:["people"], needs:["forgive","reward"], from:"@ilm_ayah"},

{id:"ameen", kind:"action", g:"sahih",
 t:{en:"Say «Āmīn» with the imam after Al-Fātiḥah", ur:"سورۂ فاتحہ کے بعد امام کے ساتھ «آمین» کہیں"},
 ar:null, m:{en:"",ur:""},
 use:{en:"Forgiveness of past sins in congregational prayer.", ur:"باجماعت نماز میں پچھلے گناہوں کی معافی۔"},
 rw:{en:"«When the imam says Āmīn, say Āmīn — whoever's Āmīn coincides with the Āmīn of the angels, his past sins are forgiven» (Bukhari 780).", ur:"«جب امام آمین کہے تو تم بھی آمین کہو — جس کی آمین فرشتوں کی آمین کے موافق ہو گئی اس کے پچھلے گناہ معاف کر دیے جاتے ہیں» (بخاری 780)۔"},
 how:{en:"In congregation, say Āmīn together with the imam right after «wa laḍ-ḍāllīn».", ur:"جماعت میں «ولا الضالین» کے فوراً بعد امام کے ساتھ آمین کہیں۔"},
 note:null,
 src:"Sahih al-Bukhari 780", acts:["salah"], needs:["forgive","reward"], from:"@ilm_ayah"},

{id:"shaytan_wasi", kind:"dua", g:"athar",
 t:{en:"Ask Allah to make Shaytan despair of you (words of Muhammad ibn Wāsiʿ)", ur:"اللہ سے دعا کہ شیطان کو آپ سے مایوس کر دے (محمد بن واسعؒ کے الفاظ)"},
 ar:"اللَّهُمَّ إِنَّكَ سَلَّطْتَ عَلَيْنَا عَدُوًّا بَصِيرًا بِعُيُوبِنَا، يَرَانَا هُوَ وَقَبِيلُهُ مِنْ حَيْثُ لَا نَرَاهُمْ، اللَّهُمَّ فَآيِسْهُ مِنَّا كَمَا آيَسْتَهُ مِنْ رَحْمَتِكَ، وَقَنِّطْهُ مِنَّا كَمَا قَنَّطْتَهُ مِنْ عَفْوِكَ، وَبَاعِدْ بَيْنَنَا وَبَيْنَهُ كَمَا بَاعَدْتَ بَيْنَهُ وَبَيْنَ رَحْمَتِكَ، إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ",
 m:{en:"O Allah, You have set over us an enemy who sees our faults; he and his tribe see us from where we cannot see them. O Allah, make him despair of us as You made him despair of Your mercy, make him lose hope in us as You made him lose hope of Your pardon, and put distance between us and him as You put distance between him and Your mercy. Indeed, You have power over all things.", ur:"اے اللہ! تو نے ہم پر ایک ایسا دشمن مسلط کیا ہے جو ہمارے عیبوں کو خوب دیکھتا ہے؛ وہ اور اس کا گروہ ہمیں وہاں سے دیکھتے ہیں جہاں سے ہم انہیں نہیں دیکھتے۔ اے اللہ! اسے ہم سے ایسا مایوس کر دے جیسے تو نے اسے اپنی رحمت سے مایوس کیا، اسے ہم سے ایسا ناامید کر دے جیسے تو نے اسے اپنی معافی سے ناامید کیا، اور ہمارے اور اس کے درمیان ایسی دوری ڈال دے جیسی تو نے اس کے اور اپنی رحمت کے درمیان ڈالی۔ بے شک تو ہر چیز پر قادر ہے۔"},
 use:{en:"Asking for protection from Shaytan's whispers.", ur:"شیطان کے وسوسوں سے حفاظت کی دعا۔"},
 rw:{en:"No reward is narrated for it — it is not a hadith.", ur:"اس کا کوئی اجر منقول نہیں — یہ حدیث نہیں۔"},
 how:{en:"You may say it any time. For your daily protection, rely on the Prophet's ﷺ adhkar first: Ayat al-Kursi and the three Quls.", ur:"کسی بھی وقت پڑھ سکتے ہیں۔ روزانہ حفاظت کے لیے پہلے نبی ﷺ کے اذکار پر بھروسا کریں: آیت الکرسی اور تینوں قل۔"},
 note:{en:"These are the words of Muhammad ibn Wāsiʿ (a Tābiʿī, d. 123 AH), recorded by al-Ghazali in Iḥyāʾ ʿUlūm al-Dīn. The story of Shaytan begging him to hide it has no chain of narration. Ibn Baz and IslamQA said the words are fine to say, but don't believe in a special reward for them or make them a fixed daily wird. The reel's version adds «wa jannatik» (and Your Paradise) near the end. The line «he and his tribe see us from where we cannot see them» echoes Qur'an 7:27.", ur:"یہ تابعی محمد بن واسعؒ (وفات 123ھ) کے الفاظ ہیں جنہیں غزالی نے احیاء علوم الدین میں نقل کیا۔ شیطان کے انہیں چھپانے کی التجا والا قصہ کسی سند سے ثابت نہیں۔ ابن باز اور اسلام کیو اے کے مطابق یہ الفاظ پڑھنا درست ہے، مگر ان کے کسی خاص اجر کا عقیدہ نہ رکھیں اور انہیں روزانہ کا مقرر وظیفہ نہ بنائیں۔ ریل والے الفاظ میں آخر کے قریب «وجنتک» (اور تیری جنت) کا اضافہ ہے۔ «وہ اور اس کا گروہ ہمیں وہاں سے دیکھتے ہیں جہاں سے ہم انہیں نہیں دیکھتے» قرآن 7:27 سے ماخوذ ہے۔"},
 src:"Iḥyāʾ ʿUlūm al-Dīn 3/37 · Fatawa Ibn Baz 26/129 · Qur'an 7:27", acts:["any"], needs:["protect"], from:"@awbaa.ar"}
);

KNOW.push(
{id:"k_erasers", e:"🧽",
 t:{en:"Things that quietly erase your sins", ur:"وہ چیزیں جو خاموشی سے گناہ مٹا دیتی ہیں"},
 b:{en:`<ul><li><b>Pain, illness, tiredness, worry and sadness</b> — even a thorn that pricks you; Allah wipes away sins with it (Bukhari 5641–5642).</li><li><b>Fever</b> — «Don't curse it, for it removes sins the way a furnace removes impurities from iron» (Muslim 2575).</li><li><b>Wudu</b> — the sins of the face, hands and feet leave with the water (Muslim 244).</li><li><b>Walking to the masjid</b> for a fard prayer — one step erases a sin, the other raises you a rank (Muslim 666).</li><li><b>Āmīn with the imam</b> that matches the angels' Āmīn — past sins forgiven (Bukhari 780).</li><li><b>Shaking hands</b> — forgiven before you part (Abu Dawud 5212).</li><li><b>The dua after eating</b> (Tirmidhi 3458).</li><li><b>A good deed after a bad one</b> — «Good deeds remove bad deeds» (Qur'an 11:114); «Follow a bad deed with a good one and it will wipe it out» (Tirmidhi 1987).</li></ul><p>These wipe out minor sins. The five prayers, Jumuʿah to Jumuʿah and Ramadan to Ramadan expiate what is between them as long as major sins are avoided (Muslim 233). Major sins need sincere tawbah: stop, regret, resolve never to return, and make amends.</p>`,
    ur:`<ul><li><b>درد، بیماری، تھکن، فکر اور غم</b> — یہاں تک کہ چبھنے والا کانٹا بھی؛ اللہ اس سے گناہ مٹا دیتا ہے (بخاری 5641–5642)۔</li><li><b>بخار</b> — «اسے برا نہ کہو، یہ گناہوں کو ایسے دور کرتا ہے جیسے بھٹی لوہے کا میل دور کرتی ہے» (مسلم 2575)۔</li><li><b>وضو</b> — چہرے، ہاتھوں اور پاؤں کے گناہ پانی کے ساتھ نکل جاتے ہیں (مسلم 244)۔</li><li><b>فرض نماز کے لیے مسجد جانا</b> — ایک قدم گناہ مٹاتا ہے، دوسرا درجہ بلند کرتا ہے (مسلم 666)۔</li><li><b>امام کے ساتھ آمین</b> جو فرشتوں کی آمین سے مل جائے — پچھلے گناہ معاف (بخاری 780)۔</li><li><b>مصافحہ</b> — جدا ہونے سے پہلے مغفرت (ابوداؤد 5212)۔</li><li><b>کھانے کے بعد کی دعا</b> (ترمذی 3458)۔</li><li><b>برائی کے بعد نیکی</b> — «بے شک نیکیاں برائیوں کو مٹا دیتی ہیں» (ہود 11:114)؛ «برائی کے بعد نیکی کرو، وہ اسے مٹا دے گی» (ترمذی 1987)۔</li></ul><p>یہ صغیرہ گناہ مٹاتے ہیں۔ پانچ نمازیں، جمعہ سے جمعہ اور رمضان سے رمضان درمیان کے گناہوں کا کفارہ ہیں جب تک کبیرہ گناہوں سے بچا جائے (مسلم 233)۔ کبیرہ گناہوں کے لیے سچی توبہ چاہیے: گناہ چھوڑیں، نادم ہوں، دوبارہ نہ کرنے کا پختہ ارادہ کریں، اور حق تلفی ہو تو ازالہ کریں۔</p>`},
 src:"Sahih al-Bukhari 5641, 5642, 780 · Sahih Muslim 2575, 244, 666, 233 · Sunan Abi Dawud 5212 · Jami' at-Tirmidhi 3458, 1987 · Qur'an 11:114", from:"@ilm_ayah"},

{id:"k_dajjal", e:"👁️",
 t:{en:"The Dajjal: 7 signs and 3 protections", ur:"دجال: 7 نشانیاں اور 3 حفاظتیں"},
 b:{en:`<p>Every prophet warned his people about him (Bukhari 7131), and there is nothing between Adam's creation and the Hour greater than the Dajjal (Muslim 2946).</p><p><b>Signs</b></p><ol><li>Blind in his right eye, which looks like a floating grape (Bukhari 3439).</li><li>«Kāfir» is written between his eyes — every believer will read it, whether they can read or not (Muslim 2934).</li><li>He stays on earth 40 days: a day like a year, a day like a month, a day like a week, and the rest like normal days (Muslim 2937).</li><li>He commands the sky and it rains, and the earth and it grows (Muslim 2937).</li><li>He brings «water» and «fire» — but his fire is cool water and his water is fire (Bukhari 7130).</li><li>He kills a young man and brings him back to life to fool people (Bukhari 1882).</li><li>He enters every land except Makkah and Madinah, which angels guard (Bukhari 1881).</li></ol><p><b>Protections</b></p><ol><li>Memorise the first ten verses of Surah Al-Kahf (Muslim 809) — see its card.</li><li>Seek refuge from him before salam in every prayer (Muslim 588) — see its card.</li><li>Keep away from him: a man will go to him sure of his faith, and end up following him because of the doubts he stirs (Abu Dawud 4319).</li></ol><p>ʿĪsā ﷺ will descend and kill him at the gate of Lud (Muslim 2937).</p>`,
    ur:`<p>ہر نبی نے اپنی قوم کو اس سے ڈرایا (بخاری 7131)، اور آدمؑ کی پیدائش سے قیامت تک دجال سے بڑا کوئی معاملہ نہیں (مسلم 2946)۔</p><p><b>نشانیاں</b></p><ol><li>داہنی آنکھ سے کانا، جو ابھرے ہوئے انگور کی طرح ہے (بخاری 3439)۔</li><li>اس کی آنکھوں کے درمیان «کافر» لکھا ہوگا — ہر مومن اسے پڑھ لے گا، چاہے پڑھنا جانتا ہو یا نہیں (مسلم 2934)۔</li><li>زمین پر 40 دن رہے گا: ایک دن سال کے برابر، ایک دن مہینے کے برابر، ایک دن ہفتے کے برابر، اور باقی عام دنوں جیسے (مسلم 2937)۔</li><li>آسمان کو حکم دے گا تو بارش ہوگی، زمین کو حکم دے گا تو اگائے گی (مسلم 2937)۔</li><li>«پانی» اور «آگ» ساتھ لائے گا — مگر اس کی آگ ٹھنڈا پانی ہے اور اس کا پانی آگ (بخاری 7130)۔</li><li>ایک نوجوان کو قتل کر کے زندہ کرے گا تاکہ لوگوں کو دھوکا دے (بخاری 1882)۔</li><li>مکہ اور مدینہ کے سوا ہر شہر میں داخل ہوگا؛ ان کی فرشتے حفاظت کریں گے (بخاری 1881)۔</li></ol><p><b>حفاظتیں</b></p><ol><li>سورۂ کہف کی پہلی دس آیتیں یاد کریں (مسلم 809) — اس کا کارڈ دیکھیں۔</li><li>ہر نماز میں سلام سے پہلے اس سے پناہ مانگیں (مسلم 588) — اس کا کارڈ دیکھیں۔</li><li>اس سے دور رہیں: آدمی اپنے ایمان پر مطمئن ہو کر اس کے پاس جائے گا، اور اس کے پیدا کردہ شبہات کی وجہ سے اس کا پیروکار بن جائے گا (ابوداؤد 4319)۔</li></ol><p>عیسیٰؑ نازل ہوں گے اور اسے باب لُد پر قتل کریں گے (مسلم 2937)۔</p>`},

{id:"k_quran_dua", e:"🕊️",
 t:{en:"How the Qur'an teaches us to make dua", ur:"قرآن دعا کرنا کیسے سکھاتا ہے"},
 b:{en:`<ul><li><b>He is near and He answers</b> — «When My servants ask you about Me, I am near; I respond to the call of the caller when he calls Me» (2:186).</li><li><b>Humbly and quietly</b> — «Call upon your Lord humbly and in secret» (7:55).</li><li><b>From within, morning and evening</b> — «Remember your Lord within yourself, humbly and with awe, without raising your voice, morning and evening, and do not be among the heedless» (7:205).</li><li><b>With a present heart</b> — «It is not the eyes that go blind, but the hearts in the chests» (22:46); «Successful are the believers who are humble in their prayer» (23:1–2).</li><li><b>Hearts find rest</b> in the remembrance of Allah (13:28).</li></ul><p>So slow down, quieten yourself and bring your heart before you ask.</p><p><b>One correction:</b> the reel suggests you don't need to ask for anything specific. The Qur'an says «Call upon Me; I will respond to you» (40:60), and the prophets asked for specific things — Musa for provision (28:24, see its card), Zakariyya for a child (21:89). The Prophet ﷺ said «Dua is worship» (Abu Dawud 1479). Ask for guidance <i>and</i> ask for your needs. The part about brain waves is the speaker's own view, not from the Qur'an.</p>`,
    ur:`<ul><li><b>وہ قریب ہے اور جواب دیتا ہے</b> — «جب میرے بندے تم سے میرے بارے میں پوچھیں تو میں قریب ہوں؛ پکارنے والے کی پکار کا جواب دیتا ہوں جب وہ مجھے پکارے» (البقرہ 2:186)۔</li><li><b>عاجزی سے اور چپکے سے</b> — «اپنے رب کو گڑگڑا کر اور چپکے چپکے پکارو» (الاعراف 7:55)۔</li><li><b>دل میں، صبح و شام</b> — «اپنے رب کو اپنے دل میں یاد کرو، عاجزی اور خوف کے ساتھ، بلند آواز کے بغیر، صبح و شام، اور غافلوں میں سے نہ ہو» (الاعراف 7:205)۔</li><li><b>حاضر دل کے ساتھ</b> — «آنکھیں اندھی نہیں ہوتیں بلکہ وہ دل اندھے ہوتے ہیں جو سینوں میں ہیں» (الحج 22:46)؛ «کامیاب ہو گئے وہ مومن جو اپنی نماز میں خشوع کرتے ہیں» (المؤمنون 23:1–2)۔</li><li><b>دلوں کو سکون</b> اللہ کے ذکر سے ملتا ہے (الرعد 13:28)۔</li></ul><p>تو مانگنے سے پہلے رکیں، خود کو پرسکون کریں اور دل کو حاضر کریں۔</p><p><b>ایک درستی:</b> ریل میں کہا گیا کہ کچھ خاص مانگنے کی ضرورت نہیں۔ قرآن کہتا ہے «مجھے پکارو، میں تمہاری دعا قبول کروں گا» (غافر 40:60)، اور انبیاء نے خاص چیزیں مانگیں — موسیٰؑ نے رزق (القصص 28:24، اس کا کارڈ دیکھیں)، زکریاؑ نے اولاد (الانبیاء 21:89)۔ نبی ﷺ نے فرمایا «دعا ہی عبادت ہے» (ابوداؤد 1479)۔ ہدایت بھی مانگیں <i>اور</i> اپنی ضرورتیں بھی۔ دماغی لہروں والی بات مقرر کی اپنی رائے ہے، قرآن سے نہیں۔</p>`},
 src:"Qur'an 2:186, 7:55, 7:205, 22:46, 23:1–2, 13:28, 40:60, 28:24, 21:89 · Sunan Abi Dawud 1479", from:"@reachmohammed"}
);

        else if(/[–-]/.test(r)){const[x,y]=r.split(/[–-]/).map(Number);for(let i=x;i<=y;i++)add("Qur'an "+i,"https://quran.com/"+i)}
        else add("Qur'an "+r,"https://quran.com/"+r)});return}

    for(const[re,c,host]of map){if(re.test(s)){const name=s.match(re)[0];(s.replace(re,"").match(/\b\d+\b/g)||[]).forEach(n=>add(name+" "+n,"https://"+host+"/"+c+":"+n));return}}
  });
  (XL[id]||[]).forEach(x=>add(x[0],x[1]));
  return out.length?`<div class="links">${out.map(([l,u])=>`<a class="lnk" href="${u}" target="_blank" rel="noopener">🔗 ${esc(l)}</a>`).join("")}</div>`:"";
