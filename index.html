/* ---------- card ---------- */
function card(x){
  const l=L(); const g=x.g;
  const isDaily=DAILY_ITEMS.has(x.id);
  const ents=DAILY.filter(d=>d.item===x.id);
  const doneAll=ents.length&&ents.every(e=>slotsOf(e.id).every(Boolean));
  let h=`<article class="card" id="c-${x.id}"><div class="meta">${x.kind==="quran"&&g==="quran"?"":`<span class="badge kind">${l.kinds[x.kind]}</span>`}<span class="badge g-${g}">${l.grades[g]}</span>${isDaily?`<span class="badge daily">⭐ ${l.dailyB}</span>`:""}${x.ar?(UNCHECKED.has(x.id)?`<span class="badge kind">✎ ${l.genW}</span>`:`<span class="badge ok">✓ ${l.chk}</span>`):""}</div>`;
  h+=`<h3>${esc(tx(x.t))}</h3>`;
  if(x.ar) h+=`<div class="arabic${x.ar.length>420?" small":""}">${esc(x.ar)}</div>`;
  if(x.ar2) h+=`<div class="ar2l">${esc(tx(x.ar2l))}</div><div class="arabic small">${esc(x.ar2)}</div>`;
  if(x.m&&tx(x.m)) h+=`<div class="mean">${esc(tx(x.m))}</div>`;
  h+=fld("🎯",l.forW,x.use)+fld("🏆",l.reward,x.rw)+fld("🕰️",l.how,x.how);
  if(x.note) h+=`<div class="note">⚠️ ${esc(tx(x.note))}</div>`;
  h+=`<div class="src">📚 <div style="min-width:0;flex:1"><b>${l.source}:</b> ${esc(x.src)}${srcLinks(x.src,x.id)}${x.from?`<div class="from">${l.from}: ${esc(x.from)}</div>`:""}</div></div>`;
  const tags=[...(x.acts||[]).map(a=>ACT[a]&&`${ACT[a].e} ${tx(ACT[a])}`),...(x.needs||[]).map(n=>NEED[n]&&`${NEED[n].e} ${tx(NEED[n])}`)].filter(Boolean);
  h+=`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
  h+=`<div class="actions">`;
  if(x.cnt||x.seq) h+=`<button class="act primary" data-count="${x.id}">🔢 ${l.count}</button>`;
  if(x.ar) h+=`<button class="act" data-copy="${x.id}">📋 ${l.copy}</button>`;
  if(isDaily) h+=`<button class="act ${doneAll?"done":""}" data-tick="${x.id}">${doneAll?"✅ "+l.isDone:"☑️ "+l.markDone}</button>`;
  h+=`</div></article>`; return h;
  function fld(e,hd,o){return o&&tx(o)?`<div class="field"><div class="h">${e} ${hd}</div><div class="txt">${esc(tx(o))}</div></div>`:""}
}

function week(){let h="";const d=new Date();d.setDate(d.getDate()-6);const names=st.lang==="ur"?["ا","پ","م","ب","جم","ج","ہ"]:["S","M","T","W","T","F","S"];

function viewNeed(){

function drawC(){const s=C.seq[C.stage],tot=C.seq.reduce((a,b)=>a+b.n,0),before=C.seq.slice(0,C.stage).reduce((a,b)=>a+b.n,0);
  $("#cN").textContent=C.n; $("#cOf").textContent="/ "+s.n+(C.seq.length>1?`  ·  ${before+C.n}/${tot}`:"");
  $("#cPhrase").textContent=s.ar||""; $("#cStage").textContent=C.seq.length>1?`${L().step} ${C.stage+1}/${C.seq.length}`:"";
  const w=Math.min(innerWidth*.72,300); $("#cSvg").innerHTML=ringSVG(w,14,C.n/s.n,"#46c08f","#d9b46a","cg");}
function bump(){const s=C.seq[C.stage]; if(C.fin)return; C.n++; buzz(12);
  if(C.n>=s.n){ if(C.stage<C.seq.length-1){C.stage++;C.n=0;buzz([40,40,40]);} else {C.fin=true;drawC();buzz([60,50,120]);confetti();
      const ticked=tickNext(C.id); toast(L().completed+(ticked?" ☑️":"")); if(C.onDone)C.onDone(); render(true); return;} }
  drawC();}

<li><b>کمپیوٹر:</b> ڈیسک ٹاپ پر رکھیں اور جب چاہیں ڈبل کلک کریں۔</li>
<li><b>آئی فون:</b> فائل کام نہیں کرے گی (آئی فون بٹنوں کے بغیر صرف پیش منظر دکھاتا ہے) — اوپر والا لنک استعمال کریں۔</li></ol>
<p>ٹِک آپ کے اپنے فون پر محفوظ ہوتے ہیں، ہر ورژن میں الگ — ہمیشہ وہی استعمال کریں۔ اگر «آج» ٹیب پر پیلی تنبیہ نظر آئے تو یہ ایسے ویوئر میں کھلی ہے جو محفوظ نہیں کر سکتا؛ Chrome میں کھولیں۔</p>
<div class="sub">🔤 فونٹس</div>
<p>لنک والا ورژن Amiri اور نستعلیق فونٹ آف لائن کے لیے محفوظ کر لیتا ہے۔ فائل اور APK آف لائن ہونے پر فون کا اپنا عربی فونٹ استعمال کرتے ہیں — الفاظ اور اعراب وہی رہتے ہیں، صرف انداز بدلتا ہے۔</p></div>`};
function openHelp(){V=null;$("#ovT").textContent="ℹ️ "+L().help;let hh=HELP[st.lang];if(location.protocol==="https:"){const here=location.origin+location.pathname.replace(/index\.html$/,"");hh=hh.split("https://muhammadadilawan68.github.io/noor/").join(here).split("muhammadadilawan68.github.io/noor").join(here.replace("https://","").replace(/\/$/,""))}$("#ovC").innerHTML=`<div class="sheet">${hh}</div>`;$("#ov").classList.add("show");document.body.style.overflow="hidden";}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-lang],[data-slot],[data-open],[data-count],[data-copy],[data-tick],[data-act],[data-need],[data-k],[data-t],#needBack,#dailyTog,#surprise,#rqStart,#ovX,#cUndo,#cReset,#cRing,#rPrev,#rNext,#rCount,#searchBtn,#helpBtn,#szUp,#szDn,#resetDay");
  if(!t)return; const d=t.dataset;
  if(d.tab){st.tab=d.tab;if(d.tab!=="need")st.need=null;save();render();scrollTo(0,0);return}
  if(d.lang){st.lang=d.lang;save();render(true);if(C)drawC();return}
  if(d.slot){const[id,i]=d.slot.split(":");const before=totals().p;setSlot(id,+i);buzz(15);const after=totals().p;render(true);if(after>=1&&before<1){confetti();toast(L().allDone)}return}
  if(d.open){showCard(d.open);return}
  if(d.count){openCounter(d.count);return}
  if(d.copy){const x=BY_ID[d.copy];const txt=x.ar+(x.ar2?"\n"+x.ar2:"");(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(L().copied)).catch(()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast(L().copied)}catch(_){}ta.remove()});return}
  if(d.tick){const ents=DAILY.filter(x=>x.item===d.tick);const all=ents.every(en=>slotsOf(en.id).every(Boolean));const before=totals().p;if(all){ents.forEach(en=>slotsOf(en.id).forEach((_,i)=>setSlot(en.id,i,false)))}else{tickNext(d.tick);buzz(15);toast("☑️ "+L().isDone)}if(totals().p>=1&&before<1)confetti();render(true);if(R)drawR();else if(V)showCard(V);return}
  if(d.act){st.act=d.act;save();render();return}
  if(d.need){st.need=d.need;render();scrollTo(0,0);return}
  if(d.k){t.parentElement.classList.toggle("open");return}
  if(d.t&&C){C.seq[0].n=+d.t;C.n=0;C.fin=false;document.querySelectorAll("#cTargets button").forEach(b=>b.classList.toggle("on",b===t));drawC();return}
  switch(t.id){
    case"needBack":st.need=null;render();return;
    case"dailyTog":st.dailyOnly=!st.dailyOnly;save();render(true);return;
    case"surprise":{const pick=ITEMS.filter(x=>x.ar)[Math.random()*ITEMS.filter(x=>x.ar).length|0];showCard(pick.id);return}
    case"rqStart":openRuq();return;
    case"ovX":closeOv();return;
    case"cRing":bump();return;
    case"cUndo":if(C){if(C.n>0)C.n--;else if(C.stage>0){C.stage--;C.n=C.seq[C.stage].n-1}C.fin=false;drawC()}return;
    case"cReset":if(C){C.stage=0;C.n=0;C.fin=false;drawC()}return;
    case"rPrev":if(R&&R.i>0){R.i--;drawR()}return;
    case"rNext":if(R){if(R.i<RQ.length-1){R.i++;drawR()}else{closeOv();confetti();toast("🌿 "+L().completed)}}return;
    case"rCount":{const id=RQ[R.i];const keep=R.i;R=null;openCounter(id,{onDone:()=>setTimeout(()=>{R={i:keep};drawR()},900)});return}
    case"searchBtn":openSearch();return;
    case"helpBtn":openHelp();return;
    case"szUp":st.ar=Math.min(44,st.ar+2);save();render(true);return;
    case"szDn":st.ar=Math.max(22,st.ar-2);save();render(true);return;
    case"resetDay":st.days[dkey()]={};save();render(true);toast(L().cleared);return;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="q")doSearch(e.target.value)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#ov").classList.contains("show"))closeOv();if(C&&(e.key===" "||e.key==="Enter")){e.preventDefault();bump()}});
function showCard(id){V=id;const l=L();$("#ovT").textContent=tx(BY_ID[id].t);$("#ovC").innerHTML=`<div class="sheet">${card(BY_ID[id])}</div>`;$("#ov").classList.add("show");document.body.style.overflow="hidden";}

render();
})();
